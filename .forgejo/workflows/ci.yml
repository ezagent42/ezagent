name: CI

# Forgejo Actions mirror of the ezagent merge gate, targeting the org-scoped
# Docker runners at code.hyprial.com (labels: docker, ubuntu-latest, ...). This
# is the low-risk step toward making Forgejo the SSOT with an enforced merge
# gate; GitHub's `.github/workflows/` is left untouched during the transition.
#
# Three jobs, all on `ubuntu-latest` (a Forgejo Docker runner):
#   gate      — the DETERMINISTIC backend merge gate. Byte-for-byte the chain
#               `docker/ci-runner.sh gate` runs (the authoritative gate chain):
#               deps.get -> compile --warnings-as-errors --force ->
#               world.e2e.fixtures --check -> format --check-formatted ->
#               ecto.create/migrate -> check_invariants -> socialware.check ->
#               gate.arch (arch/invariant ExUnit subset) -> reflow-rehearsal.
#               NOT the full suite (`mix ci.local`) on purpose: the full suite
#               is ubuntu-flake-prone (#108) and was deliberately kept on the
#               native macOS runner. A flaky REQUIRED check is worse than none.
#   gitleaks  — working-tree secret scan (mirrors the GitHub gitleaks job),
#               using the gitleaks linux binary (no docker-in-docker).
#   frontend  — the frontend regression gate (mirrors frontend-ci.yml: lint,
#               typecheck, unit, Tier-1 Chromium E2E), inlined here because the
#               reusable `.github/` workflow must stay untouched.

on: [push, pull_request]

concurrency:
  # Cancel a stale run when the same ref is re-pushed, so the iterate loop never
  # queues redundant work onto the shared runners.
  group: forgejo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # act_runner force-injects `ImageOS=ubuntu20` into every step's env and it
    # OVERRIDES job-level env, step-level env, AND a $GITHUB_ENV write (all three
    # verified ignored). So setup-beam ALWAYS installs the ubuntu-20.04 arm64 OTP,
    # whose crypto NIF links libcrypto.so.1.1 (OpenSSL 1.1). The runner's DEFAULT
    # image (node:22-bookworm) ships OpenSSL 3 only -> the NIF can't load -> mix
    # loses TLS -> setup-beam's `mix local.rebar` dies. Rather than fight the
    # un-overridable ImageOS, run this job in a Debian BULLSEYE container, which
    # ships OpenSSL 1.1.1 (libcrypto.so.1.1) + node (for the JS actions) + git,
    # and whose glibc 2.31 matches the ubuntu-20.04 OTP build. (Clean long-term
    # fix is runner-side: set the runner's ImageOS to ubuntu22 to match a
    # bookworm/OpenSSL-3 image — that's runner config, out of this workflow's scope.)
    container:
      image: node:22-bullseye
    env:
      MIX_ENV: test
      POSTGRES_USER: ezagent_pg_compat
      POSTGRES_PASSWORD: ezagent_pg_compat
      # The job runs INSIDE a container on the job's docker network, so Postgres
      # is reached by SERVICE NAME (not 127.0.0.1 with a port mapping).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # erlexec's exec-port refuses to start without $SHELL set.
      SHELL: /bin/bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ezagent_pg_compat
          POSTGRES_PASSWORD: ezagent_pg_compat
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ezagent_pg_compat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Diagnostic: learn the runner container (arch, OS, user, preinstalled
      # tools) from the very first run so subsequent iterations are informed.
      - name: Environment probe
        shell: bash
        run: |
          echo "whoami=$(whoami) uid=$(id -u)"
          uname -a
          (cat /etc/os-release 2>/dev/null | head -3) || true
          echo "git=$(git --version 2>/dev/null)"
          echo "node=$(node --version 2>/dev/null) npm=$(npm --version 2>/dev/null)"

      - uses: actions/checkout@v4

      # Full github.com URL: this Forgejo runner's DEFAULT_ACTIONS_URL is
      # data.forgejo.org, which mirrors only the `actions/*` org — `erlef/*` is
      # not there (a bare `erlef/setup-beam` 404s). github.com egress is
      # available from the runner, so the explicit URL resolves. The runner's
      # injected ImageOS=ubuntu20 makes setup-beam install the ubuntu-20.04 arm64
      # OTP; the bullseye container (see job `container:`) satisfies its
      # libcrypto.so.1.1 dependency.
      - name: Set up Elixir/OTP
        uses: https://github.com/erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Wait for Postgres
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if (echo > "/dev/tcp/${POSTGRES_HOST}/${POSTGRES_PORT}") >/dev/null 2>&1; then
              echo "postgres reachable at ${POSTGRES_HOST}:${POSTGRES_PORT}"; exit 0
            fi
            echo "waiting for postgres ($i) ..."; sleep 2
          done
          echo "!! postgres never became reachable" >&2; exit 1

      # erlexec's exec-port REFUSES to run as root ("Not allowed to run as root
      # without setting effective user"). The app boot starts :erlexec (it is in
      # ezagent_core's `extra_applications`) at the check_invariants / gate.arch
      # steps, so the whole mix chain must run NON-ROOT — exactly how the
      # dockerized CI does it: docker/Dockerfile.ci does `chown -R ezagent:ezagent`
      # + `USER ezagent` and docker/ci-runner.sh runs the `gate` chain as uid 1000.
      # Mirror that here. checkout + setup-beam had to run as root, so hand the
      # workspace (deps/_build) + a writable HOME/MIX_HOME to uid 1000 (the image's
      # `node` user) and run the deterministic gate chain — byte-identical to
      # docker/ci-runner.sh `gate` — as that user via runuser. (Clean long-term
      # fix stays runner-side: run the job non-root from the start.)
      - name: Run deterministic gate (non-root; erlexec refuses root)
        shell: bash
        run: |
          set -euo pipefail
          # uid 1000 = `node` in node:22-bullseye (HOME=/home/node). Give it the
          # workspace + its home so it can fetch/compile/run mix + write _build.
          chown -R node:node "$PWD" /home/node
          # setup-beam extracted OTP/Elixir under /tmp/.setup-beam and put them on
          # PATH via $GITHUB_PATH (already in $PATH here). Make them traversable by
          # the non-root user, then forward PATH + DB env into the runuser shell.
          chmod -R a+rX /tmp/.setup-beam 2>/dev/null || true
          /sbin/runuser -u node -- env \
            PATH="$PATH" \
            HOME=/home/node \
            MIX_ENV=test \
            MIX_HOME=/home/node/.mix \
            HEX_HOME=/home/node/.hex \
            HEX_HTTP_CONCURRENCY="${HEX_HTTP_CONCURRENCY:-1}" \
            HEX_HTTP_TIMEOUT="${HEX_HTTP_TIMEOUT:-120}" \
            SHELL=/bin/bash \
            POSTGRES_HOST="$POSTGRES_HOST" POSTGRES_PORT="$POSTGRES_PORT" \
            POSTGRES_USER="$POSTGRES_USER" POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            bash -euo pipefail -c '
              git config --global --add safe.directory "*"
              # hex.pm fetches (local.hex/local.rebar hit builds.hex.pm; deps.get
              # hits repo.hex.pm ~150x) intermittently time out on a single tarball
              # and fail the whole gate (observed: exqlite on run 39, rebar.csv on
              # run 25). HEX_HTTP_TIMEOUT/CONCURRENCY (see runner env) lengthen +
              # serialize each request; retry() covers a hard transient failure.
              retry() { local n=0; until "$@"; do n=$((n+1)); [ "$n" -ge 3 ] && return 1; echo "retry $n/3: $*"; sleep $((n*5)); done; }
              retry mix local.hex --force
              retry mix local.rebar --force
              echo "== deps.get =="                    ; retry mix deps.get
              echo "== compile --warnings-as-errors ==" ; mix compile --warnings-as-errors --force
              echo "== world.e2e.fixtures --check =="   ; mix world.e2e.fixtures --check
              echo "== format --check-formatted =="     ; mix format --check-formatted
              echo "== ecto.create/migrate =="          ; mix ecto.create --quiet && mix ecto.migrate --quiet
              echo "== check_invariants =="             ; mix ezagent.check_invariants
              echo "== socialware.check =="             ; mix ezagent.socialware.check
              echo "== gate.arch =="                    ; mix gate.arch
              echo "== reflow-rehearsal =="             ; mix test --include reflow_rehearsal apps/ezagent_domain_identity/test/ezagent/socialware/config_store_seed_upsert_test.exs apps/ezagent_domain_session/test/integration/reflow_rehearsal_test.exs
            '

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Bare gitleaks CLI (MIT), not gitleaks-action (paid for orgs) and not
      # docker-in-docker (the job is already containerized). Pin the version;
      # detect the container arch so this works whether the runner container is
      # linux/amd64 or linux/arm64. Directory (no-git) scan, semantics identical
      # to the GitHub job's `gitleaks dir . --config .gitleaks.toml --redact`.
      - name: Scan working tree for secrets
        shell: bash
        run: |
          set -euo pipefail
          # Pin to the version the GitHub gitleaks job's `ghcr.io/gitleaks/gitleaks:latest`
          # currently resolves to, so the default ruleset matches main's (an older
          # pin flagged 2 false positives the current .gitleaks.toml allowlist,
          # written for the newer ruleset, does not cover).
          VER=8.30.1
          case "$(uname -m)" in
            x86_64|amd64) ARCH=x64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_${ARCH}.tar.gz"
          echo "downloading $url"
          curl -sSfL "$url" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner

  frontend:
    name: frontend regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Full github.com URL: the data.forgejo.org mirror flaked mid-clone on
      # this action (HTTP/2 stream reset). github.com egress is available and is
      # the canonical source, so resolve directly to avoid the flaky mirror.
      - name: Set up Node
        uses: https://github.com/actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Frontend lint, typecheck and unit tests
        shell: bash
        run: |
          set -euo pipefail
          for assets_dir in \
            apps/ezagent_web/assets \
            apps/ezagent_plugin_world/assets \
            apps/ezagent_plugin_hello/assets
          do
            pnpm --dir "$assets_dir" install --frozen-lockfile
            pnpm --dir "$assets_dir" lint
            pnpm --dir "$assets_dir" typecheck
            pnpm --dir "$assets_dir" test
          done

      # On linux the Chromium system libraries are not preinstalled, so
      # `--with-deps` (apt) is required (unlike the macOS job which drops it).
      - name: Install Tier-1 Chromium
        run: pnpm --dir apps/ezagent_plugin_world/assets exec playwright install --with-deps chromium

      - name: Frontend Tier-1 Playwright
        run: pnpm --dir apps/ezagent_plugin_world/assets test:e2e
