# ezagent PROD environment — `mix release` image + a containerized cloudflared that
# fronts app.ezagent.chat (reusing tunnel 7339e970). Prod data binds the STABLE
# host home ~/.ezagent (persistent across redeploys); dev/test use named volumes
# in docker-compose.dev.yml instead.
#   build: docker compose -f docker/docker-compose.prod.yml build \
#            --build-arg HTTP_PROXY=http://host.docker.internal:7897 \
#            --build-arg HTTPS_PROXY=http://host.docker.internal:7897
#   run:   ESR_PROXY=http://host.docker.internal:7897 \
#            docker compose -f docker/docker-compose.prod.yml up -d
# Distinct compose PROJECT name so prod never collides with the dev stack (both
# compose files live in docker/ → same default project "docker" → prod `up`
# would clobber the dev container). dev stays project "docker"; prod = ezagent-prod.
name: ezagent-prod

services:
  ezagent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      args:
        HTTP_PROXY: ${DOCKER_BUILD_PROXY:-}
        HTTPS_PROXY: ${DOCKER_BUILD_PROXY:-}
        NO_PROXY: "localhost,127.0.0.1,::1"
    image: ezagent-prod:latest
    restart: unless-stopped
    # Host-port 10043 (dev uses 10042) for Tailscale/admin access; cloudflared
    # reaches the app internally via the compose network (ezagent:10042).
    ports:
      - "10043:10042"
    # Distribution cookie (EZAGENT_COOKIE + RELEASE_COOKIE) lives in a gitignored
    # env_file — NOT committed (codex #21 review). Generated random per host.
    env_file:
      - ./secrets-prod/ezagent.env
    environment:
      PORT: "10042"
      SHELL: /bin/bash
      EZAGENT_HOME: /data
      EZAGENT_PROFILE: default
      EZAGENT_PUBLIC_HOST: app.ezagent.chat
      EZAGENT_PUBLIC_SCHEME: https
      # WS check_origin for the Tailscale admin fallback on the published host
      # port :10043 (the public app.ezagent.chat path is allowed in runtime.exs).
      EZAGENT_EXTRA_CHECK_ORIGINS: "http://100.64.0.27:10043,http://localhost:10043,http://127.0.0.1:10043"
      # Deterministic distribution so `bin/ezagent rpc` connects out-of-the-box:
      # release boots as ezagent_runtime@127.0.0.1 (matches Ezagent.Runtime); the
      # cookie (from env_file) is read by both ensure_cookie! (EZAGENT_COOKIE) and
      # the rpc helper (RELEASE_COOKIE).
      RELEASE_DISTRIBUTION: name
      RELEASE_NODE: ezagent_runtime@127.0.0.1
      # Agents' claude/codex subprocesses reach providers via the proxy; Feishu
      # + localhost go direct.
      HTTP_PROXY: ${ESR_PROXY:-}
      HTTPS_PROXY: ${ESR_PROXY:-}
      http_proxy: ${ESR_PROXY:-}
      https_proxy: ${ESR_PROXY:-}
      NO_PROXY: "localhost,127.0.0.1,::1,host.docker.internal,.feishu.cn,.larksuite.com,open.feishu.cn"
      no_proxy: "localhost,127.0.0.1,::1,host.docker.internal,.feishu.cn,.larksuite.com,open.feishu.cn"
    volumes:
      # STABLE prod data — Docker NAMED VOLUME (persists across redeploys; only
      # `down -v` removes it). Chosen over a ${HOME}/.ezagent host bind because
      # Docker Desktop's VirtioFS maps host-dir ownership inconsistently for a
      # non-root container (uid 1000 can't create /data/default on the bind),
      # which is unreliable for a writable data dir. Inspect via:
      #   docker compose -f docker/docker-compose.prod.yml exec ezagent ls -la /data/default
      - prod_home:/data
      # Static prod secrets (feishu app cli_a96e) — seeded into the volume on
      # first boot by the entrypoint. read-only.
      - ./secrets-prod:/secrets:ro
      # Iterate the entrypoint without a full image rebuild.
      - ./entrypoint.prod.sh:/app/entrypoint.prod.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:10042/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    # cloudflared must reach the cloudflare edge; if the host requires a proxy,
    # supply it here. Feishu/cloudflare egress validation is a known check.
    environment:
      HTTPS_PROXY: ${ESR_PROXY:-}
      https_proxy: ${ESR_PROXY:-}
      NO_PROXY: "ezagent,localhost,127.0.0.1,::1"
      no_proxy: "ezagent,localhost,127.0.0.1,::1"
    volumes:
      - ./cloudflared/prod-config.yml:/etc/cloudflared/config.yml:ro
      # ezagent-prod tunnel (8e249ea0) credentials (read-only) from the host.
      - ${HOME}/.cloudflared/8e249ea0-1285-4a86-81fc-eb3733a16cf4.json:/etc/cloudflared/cred.json:ro
    depends_on:
      ezagent:
        condition: service_healthy

volumes:
  prod_home:   # stable prod data (DB, profile, credentials) — survives redeploys
