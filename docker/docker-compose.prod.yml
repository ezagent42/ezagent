# ezagent PROD environment — FULLY containerized Mac stack:
#   ezagent (mix release) + postgres (DB) + mihomo (egress proxy) + cloudflared
#   (tunnel fronting app.ezagent.chat). Every moving part runs in a container;
#   the only host dependency is Docker + the gitignored secrets.
#
#   secrets (gitignored):
#     docker/.env                     → POSTGRES_PASSWORD=...           (compose interpolation)
#     docker/secrets-prod/ezagent.env → EZAGENT_COOKIE/RELEASE_COOKIE  (env_file)
#     docker/secrets-prod/mihomo/config.yaml → real mihomo config with the JMS
#                                       subscription URL (see docker/mihomo/config.example.yaml)
#     ${HOME}/.cloudflared/8e249ea0-...json → prod tunnel credentials
#
#   build: docker compose -f docker/docker-compose.prod.yml build \
#            --build-arg HTTP_PROXY=http://host.docker.internal:7897 \
#            --build-arg HTTPS_PROXY=http://host.docker.internal:7897
#          (build runs before the mihomo container exists → use the HOST proxy on
#           :7897 for build-time hex/npm/CLI fetches; runtime agent egress uses the
#           mihomo SERVICE on the compose network.)
#   run:   docker compose -f docker/docker-compose.prod.yml up -d
#
# Distinct compose PROJECT name so prod never collides with the dev stack (both
# compose files live in docker/ → same default project "docker"). dev = "docker";
# prod = ezagent-prod.
name: ezagent-prod

services:
  # ----- Postgres: the durable Repo (SQLite→PG migration). Internal-only: no
  # host port published; reachable on the compose network as `postgres:5432`. -----
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ezagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: ezagent_prod
    volumes:
      - prod_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezagent -d ezagent_prod"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ----- mihomo: containerized egress proxy (replaces the host clash/mihomo).
  # ONLY the agent (claude/codex) subprocesses need it — to reach
  # api.anthropic.com / api.openai.com past the GFW. ezagent's own traffic
  # (Feishu=China-direct, Postgres=internal) and cloudflared (tunnel→CF edge)
  # do NOT go through it. So the proxy env is set ONLY on the `ezagent` service
  # (the agents inherit it); see that service below.
  #
  # mixed-port is 7897 to match the external Mac proxy port. There is deliberately
  # NO `ports:` mapping → 7897 is reachable ONLY inside the compose network, never
  # from the host or LAN. (bind-address: '*' in the config is required so sibling
  # containers can reach it; the host instance binds 127.0.0.1 only.)
  # Config is rendered at start from the committed template, substituting the
  # SECRET JMS subscription URL from $JMS_SUBSCRIPTION_URL (set in docker/.env) —
  # no secret is committed. See docker/mihomo/config.template.yaml.
  mihomo:
    image: metacubex/mihomo:latest
    restart: unless-stopped
    environment:
      JMS_SUBSCRIPTION_URL: ${JMS_SUBSCRIPTION_URL:?set JMS_SUBSCRIPTION_URL in docker/.env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /root/.config/mihomo
        sh /etc/mihomo/render-config.sh /etc/mihomo/config.template.yaml /root/.config/mihomo/config.yaml
        exec "$$(command -v mihomo || echo /mihomo)" -d /root/.config/mihomo
    volumes:
      - ./mihomo/config.template.yaml:/etc/mihomo/config.template.yaml:ro
      - ./mihomo/render-config.sh:/etc/mihomo/render-config.sh:ro
    healthcheck:
      # mixed-port 7897 accepting connections = proxy is up. Image ships wget.
      test: ["CMD-SHELL", "wget -q -T2 -O- http://127.0.0.1:7897 >/dev/null 2>&1 || true; nc -z 127.0.0.1 7897 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ezagent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
      args:
        HTTP_PROXY: ${DOCKER_BUILD_PROXY:-}
        HTTPS_PROXY: ${DOCKER_BUILD_PROXY:-}
        NO_PROXY: "localhost,127.0.0.1,::1"
    image: ezagent-prod:latest
    restart: unless-stopped
    # Host-port 10043 (dev uses 10042) for Tailscale/admin access; cloudflared
    # reaches the app internally via the compose network (ezagent:10042).
    ports:
      - "10043:10042"
    # Distribution cookie (EZAGENT_COOKIE + RELEASE_COOKIE) lives in a gitignored
    # env_file — NOT committed (codex #21 review). Generated random per host.
    env_file:
      - ./secrets-prod/ezagent.env
    environment:
      PORT: "10042"
      SHELL: /bin/bash
      EZAGENT_HOME: /data
      EZAGENT_PROFILE: default
      EZAGENT_PUBLIC_HOST: app.ezagent.chat
      EZAGENT_PUBLIC_SCHEME: https
      # DB: Postgres on the compose network (runtime.exs requires DATABASE_URL).
      DATABASE_URL: ecto://ezagent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}@postgres:5432/ezagent_prod
      POOL_SIZE: ${POOL_SIZE:-5}
      # WS check_origin for the Tailscale admin fallback on the published host
      # port :10043 (the public app.ezagent.chat path is allowed in runtime.exs).
      EZAGENT_EXTRA_CHECK_ORIGINS: "http://100.64.0.27:10043,http://localhost:10043,http://127.0.0.1:10043"
      # Deterministic distribution so `bin/ezagent rpc` connects out-of-the-box:
      # release boots as ezagent_runtime@127.0.0.1 (matches Ezagent.Runtime); the
      # cookie (from env_file) is read by both ensure_cookie! (EZAGENT_COOKIE) and
      # the rpc helper (RELEASE_COOKIE).
      RELEASE_DISTRIBUTION: name
      RELEASE_NODE: ezagent_runtime@127.0.0.1
      # Proxy is set HERE ONLY (not on cloudflared) — the spawned claude/codex
      # subprocesses inherit it to reach api.anthropic.com / api.openai.com via
      # the mihomo SERVICE. Postgres (compose net), Feishu + localhost go direct
      # (NO_PROXY). Elixir's own HTTP clients don't auto-honor these env vars, so
      # the BEAM core's traffic stays direct regardless.
      HTTP_PROXY: ${ESR_PROXY:-http://mihomo:7897}
      HTTPS_PROXY: ${ESR_PROXY:-http://mihomo:7897}
      http_proxy: ${ESR_PROXY:-http://mihomo:7897}
      https_proxy: ${ESR_PROXY:-http://mihomo:7897}
      NO_PROXY: "localhost,127.0.0.1,::1,postgres,mihomo,host.docker.internal,.feishu.cn,.larksuite.com,open.feishu.cn"
      no_proxy: "localhost,127.0.0.1,::1,postgres,mihomo,host.docker.internal,.feishu.cn,.larksuite.com,open.feishu.cn"
    volumes:
      # STABLE prod data — Docker NAMED VOLUME (persists across redeploys; only
      # `down -v` removes it). Holds the prod PROFILE: credentials, snapshots,
      # logs, agent working dirs. The DB no longer lives here — it's in Postgres.
      # Inspect via:
      #   docker compose -f docker/docker-compose.prod.yml exec ezagent ls -la /data/default
      - prod_home:/data
      # Static prod secrets (feishu app cli_a96e) — seeded into the volume on
      # first boot by the entrypoint. read-only.
      - ./secrets-prod:/secrets:ro
      # Iterate the entrypoint without a full image rebuild.
      - ./entrypoint.prod.sh:/app/entrypoint.prod.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      mihomo:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:10042/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    # NO proxy: the tunnel connects to the Cloudflare edge DIRECTLY (it does not
    # need the JMS proxy, and routing it through mihomo only adds a hop). If this
    # specific network ever can't reach the CF edge directly, re-add
    # HTTPS_PROXY=http://mihomo:7897 here as a fallback.
    volumes:
      - ./cloudflared/prod-config.yml:/etc/cloudflared/config.yml:ro
      # ezagent-prod tunnel (8e249ea0) credentials (read-only) from the host.
      - ${HOME}/.cloudflared/8e249ea0-1285-4a86-81fc-eb3733a16cf4.json:/etc/cloudflared/cred.json:ro
    depends_on:
      ezagent:
        condition: service_healthy

volumes:
  prod_home:   # stable prod profile (credentials, snapshots, logs, agent dirs) — survives redeploys
  prod_pg:     # Postgres data — survives redeploys; only `down -v` removes it
