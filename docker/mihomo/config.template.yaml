# mihomo egress-proxy config — TEMPLATE (committed, no secret).
#
# The mihomo service in docker-compose.prod.yml mounts this template and renders
# it at container start, substituting __JMS_SUBSCRIPTION_URL__ from the
# JMS_SUBSCRIPTION_URL env var (set in docker/.env). So the secret subscription
# URL lives ONLY in the (gitignored) env — never in a committed file.
#
# To preview locally:  JMS_SUBSCRIPTION_URL=... docker/mihomo/render-config.sh
#
# This mirrors the host mihomo scheme (~/mihomo-test/config.yaml) with two
# container-specific changes: mixed-port 7897 (match the external Mac proxy port)
# and bind-address '*' so the ezagent container can reach it. The port is NOT
# published to the host → cluster-internal only.

mixed-port: 7897
bind-address: '*'
allow-lan: true
external-controller: 127.0.0.1:9897
mode: rule
log-level: info

dns:
  enable: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: [223.5.5.5, 119.29.29.29]
  fallback: [1.1.1.1, 8.8.8.8]

proxy-providers:
  jms:
    type: http
    # Rendered from $JMS_SUBSCRIPTION_URL at container start (do not hardcode).
    url: "__JMS_SUBSCRIPTION_URL__"
    interval: 600
    # Subscription is pulled DIRECT (no proxy) to avoid a boot deadlock.
    health-check: {enable: true, url: "https://www.gstatic.com/generate_204", interval: 180}

proxy-groups:
  - {name: auto, type: url-test, use: [jms], url: "https://www.gstatic.com/generate_204", interval: 180, tolerance: 50}

rules:
  - DOMAIN-SUFFIX,jmssub.net,DIRECT
  # Domestic traffic stays direct; only foreign (Anthropic/OpenAI) goes via JMS.
  - GEOIP,CN,DIRECT
  - MATCH,auto
