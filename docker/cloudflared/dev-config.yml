# cloudflared ingress for the DEV compose — dedicated tunnel `ezagent-dev`
# (8fb9e613) → dev.ezagent.chat. Separate tunnel from prod so the two compose
# stacks never share a connector. Credentials json mounted read-only from
# ~/.cloudflared/8fb9e613-...json; reaches the dev app by service name (esr:10042).
tunnel: 8fb9e613-05d6-44b6-a00a-4e44873c4de3
credentials-file: /etc/cloudflared/cred.json

ingress:
  - hostname: dev.ezagent.chat
    service: http://esr:10042
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 30s
  - service: http_status:404
