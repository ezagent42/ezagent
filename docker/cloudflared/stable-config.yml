# docker/cloudflared/stable-config.yml — stable 通道公网入口(app.ezagent.chat)。
# 从 prod-config.yml 迁移:保留 originRequest,service 指向 edge 网上的 ezagent-stable:10042。
tunnel: 8e249ea0-1285-4a86-81fc-eb3733a16cf4
credentials-file: /etc/cloudflared/cred.json

ingress:
  - hostname: app.ezagent.chat
    service: http://ezagent-stable:10042
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 30s
  - service: http_status:404
