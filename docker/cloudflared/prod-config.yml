# cloudflared ingress for the PROD compose — dedicated tunnel `ezagent-prod`
# (8e249ea0). The credentials json is mounted read-only from the host
# (~/.cloudflared/8e249ea0-...json). The cloudflared container reaches the prod
# app by compose service name (esr:10042), NOT a host port.
tunnel: 8e249ea0-1285-4a86-81fc-eb3733a16cf4
credentials-file: /etc/cloudflared/cred.json

ingress:
  - hostname: app.ezagent.chat
    service: http://esr:10042
    originRequest:
      connectTimeout: 30s
      tcpKeepAlive: 30s
  - service: http_status:404
