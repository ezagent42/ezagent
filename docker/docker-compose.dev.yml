# ezagent dev/test environment. Brings up a BLANK ezagent via `mix phx.server`.
#   build:  docker compose -f docker/docker-compose.dev.yml build \
#             --build-arg HTTP_PROXY=http://host.docker.internal:7897 \
#             --build-arg HTTPS_PROXY=http://host.docker.internal:7897
#   run:    ESR_PROXY=http://host.docker.internal:7897 \
#             docker compose -f docker/docker-compose.dev.yml up -d
# Reachable at http://100.64.0.27:10042 (Tailscale) — see docker/README.md.
# In-container E2E browser loop: add the `e2e` profile to bring up the headless
# `chromium` sidecar (cc drives the app from INSIDE the container). The dev-mode
# host-driven path (host `agent-browser open`) needs nothing here.
#   docker compose -f docker/docker-compose.dev.yml --profile e2e up -d
#   (set BROWSERLESS_TOKEN in docker/.env — gitignored — first.)
# See docs/together/2026-06-27/specs/container-e2e-browser.md.
services:
  ezagent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        HTTP_PROXY: ${DOCKER_BUILD_PROXY:-}
        HTTPS_PROXY: ${DOCKER_BUILD_PROXY:-}
        NO_PROXY: "localhost,127.0.0.1,::1"
    image: ezagent-dev:latest
    ports:
      - "10042:10042"
    # Distribution cookie (EZAGENT_COOKIE + RELEASE_COOKIE) in a gitignored
    # env_file — NOT committed (codex #21 review).
    env_file:
      - ./secrets/ezagent.env
    environment:
      PORT: "10042"
      SHELL: /bin/bash          # erlexec's exec-port requires SHELL (unset for non-root user)
      EZAGENT_HOME: /data
      EZAGENT_PROFILE: default
      EZAGENT_PUBLIC_HOST: dev.ezagent.chat   # generated URLs (magic-link) use the DEV host
      EZAGENT_PUBLIC_SCHEME: https
      # Agents' claude/codex subprocesses inherit these to reach Anthropic/OpenAI.
      # Feishu + localhost go direct (NO_PROXY). host.docker.internal = host proxy.
      # Set BOTH upper + lower case (many tools honor lowercase) so the runtime proxy
      # + NO_PROXY are authoritative and no stale build value leaks (codex r-review).
      HTTP_PROXY: ${ESR_PROXY:-}
      HTTPS_PROXY: ${ESR_PROXY:-}
      http_proxy: ${ESR_PROXY:-}
      https_proxy: ${ESR_PROXY:-}
      # chromium,ezagent bypass the proxy: the CDP ws:// + in-container app nav go direct.
      NO_PROXY: "chromium,ezagent,localhost,127.0.0.1,::1,host.docker.internal,.feishu.cn,.larksuite.com,open.feishu.cn"
      no_proxy: "chromium,ezagent,localhost,127.0.0.1,::1,host.docker.internal,.feishu.cn,.larksuite.com,open.feishu.cn"
      # --- in-container E2E browser (active only when the runbook runs; inert otherwise) ---
      # Generic CDP connect. NOTE the trailing slash before `?` — browserless v2 rejects
      # `ws://chromium:3000?token=` (HTTP 400); working form is `ws://chromium:3000/?token=`
      # (verified empirically, spec OQ-4).
      E2E_BROWSER_CDP: "ws://chromium:3000/?token=${BROWSERLESS_TOKEN:-}"
      BASE_URL: "http://ezagent:10042"          # internal app origin the sidecar navigates to
      EVID_DIR: "/data/e2e-evidence"            # persistent /data volume (survives recreate)
      # INERT under MIX_ENV=dev (runtime.exs reads this only when config_env()==:prod; this
      # stack runs `mix phx.server` in :dev where dev.exs sets check_origin:false). Kept
      # SPEC-faithful + forward-compatible for any future prod-mode profiled smoke.
      EZAGENT_EXTRA_CHECK_ORIGINS: "http://ezagent:10042"
    # `default` listed explicitly: adding `networks:` would otherwise drop ezagent from
    # the implicit default net (cutting LLM/Feishu egress + the cloudflared→ezagent path).
    networks:
      - default
      - e2e_browser
    volumes:
      - ezagent_home:/data                  # the swappable $EZAGENT_HOME (E2E layers restore here)
      - ./secrets:/secrets:ro           # static secrets: feishu.yaml (+ cred seeds)
      - cred_cc:/cred/cc                # durable cc OAuth source (seed-once, rotates)
      - cred_codex:/cred/codex          # durable codex OAuth source (seed-once, rotates)
      - layers:/layers                  # E2E snapshot layer cache (cred-free tars)
      - ./entrypoint.sh:/app/docker/entrypoint.sh:ro   # iterate entrypoint without a full rebuild
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:10042/"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Containerized cloudflared fronting dev.ezagent.chat via the dedicated
  # ezagent-dev tunnel (8fb9e613) — separate tunnel from prod so the two stacks
  # never share a connector. Reaches the dev app by service name (ezagent:10042).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    environment:
      HTTPS_PROXY: ${ESR_PROXY:-}
      https_proxy: ${ESR_PROXY:-}
      NO_PROXY: "ezagent,localhost,127.0.0.1,::1"
      no_proxy: "ezagent,localhost,127.0.0.1,::1"
    volumes:
      - ./cloudflared/dev-config.yml:/etc/cloudflared/config.yml:ro
      - ${HOME}/.cloudflared/8fb9e613-05d6-44b6-a00a-4e44873c4de3.json:/etc/cloudflared/cred.json:ro
    depends_on:
      ezagent:
        condition: service_healthy

  # Headless-chromium sidecar (browserless v2). Profile-gated (`--profile e2e`) so a
  # plain `up` never starts it. NO `ports:` (never published), on an `internal: true`
  # network (no internet egress from the browser), token-authed. No hard depends_on
  # from ezagent — the runbook connects lazily. See spec §2/§3/§4.
  chromium:
    image: ghcr.io/browserless/chromium:v2.38.1   # pinned; matched Chrome+CDP bundled
    restart: unless-stopped
    profiles: [e2e]
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:?set BROWSERLESS_TOKEN in docker/.env}
      HOST: "0.0.0.0"
      PORT: "3000"
      CONCURRENT: "2"
      TIMEOUT: "120000"
      HEALTH: "true"
    networks:
      - e2e_browser
    # browserless v2 has no `/` route (404); health/version is `/json/version?token=…`.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://127.0.0.1:3000/json/version?token=$${TOKEN}\" >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  # Implicit default net (LLM/Feishu egress + cloudflared) — declared so ezagent lists it.
  default:
  # Internal-only net shared by ezagent + chromium: `internal: true` = no internet NAT.
  e2e_browser:
    internal: true

volumes:
  ezagent_home:
  cred_cc:
  cred_codex:
  layers:
