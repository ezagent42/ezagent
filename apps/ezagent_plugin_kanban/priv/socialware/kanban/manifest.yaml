# kanban demo socialware — the #1213 config-file form of the boot-publish
# manifest (formerly inline `EzagentPluginKanban.Demo.manifest_attrs/1` code).
# Loaded at plugin boot by `EzagentPluginKanban.Demo` through the SAME chain as
# `Ezagent.Socialware.ManifestYaml.import/2`
# (parse → ManifestResolver.resolve → Conformance.check_candidate →
# publish_or_upgrade). Semantics are the judge: this file must resolve to the
# exact Definition the retired code attrs produced (conformance 13/13 green).
#
# Shape notes (the three data diffs vs hello, per the kanban handoff):
#   * roles — exactly TWO agent role-slots (kanban-assistant + dev-together,
#     both cc-headless). NOT a `kanban-manager` slot: that recipe is
#     `passive: true` and the RF-6 passive-join gate rejects it at materialize;
#     the board stays a workspace-level URI-dispatch actor (the S2 fix).
#   * routing_rules — ONLY the #1190 relay-back rule, #1212-hardened to
#     and(text_contains "__done__", from_role dev-together). NEVER hello's
#     `always → chat` rule (handoff red line). The "__done__" literal is the
#     spec §4.2 contract point — byte-identical to the marker in
#     `.claude/skills/kanban-assistant/references/*` (locked by
#     `relay-signal-check.sh` + `EzagentPluginKanban.Demo.relay_done_marker/0`).
#   * visibility_policy — public + supervised like hello, but
#     web_anon_access: false (a kanban board is not an anonymous public page).
name: kanban
version: "0.1.0"
title: "Kanban 看板团队"
description: "看板团队 socialware：kanban-assistant 协调 + dev-together 开发 + workspace 看板数据，__done__ 内容触发 relay-back。"
uses:
  - kanban
bases:
  - Ezagent.ActionSet.Session
views:
  - kanban_render
roles:
  - role_name: kanban-assistant
    fill: agent
    recipe: kanban-assistant
    flavor: cc-headless
  - role_name: dev-together
    fill: agent
    recipe: dev-together
    flavor: cc-headless
routing_rules:
  - matcher:
      type: and
      items:
        - type: text_contains
          arg: "__done__"
        - type: from_role
          arg: dev-together
    receivers:
      - kanban-assistant
    rule_set: relay-back
    position: 0
legends:
  kanban:
    member_set:
      - kanban-assistant
      - dev-together
    bound_rule_set: relay-back
    fold: false
visibility_policy:
  scope: public
  publish_policy: supervised
  web_anon_access: false
owner_policy:
  type: installer
