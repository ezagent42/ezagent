# kanban demo socialware — a deploy-seed package (mirrors autoservice / hello).
# Production carries this file in the release box; on a fresh stack
# `Ezagent.Home.SocialwareSeed` copies it into the deployment home
# (`$EZAGENT_HOME/<profile>/socialware/kanban/`) and the late boot scan
# `Ezagent.Socialware.ManifestSeed.scan_all!/1` resolves + publishes it through
# the governed import lane (parse → ManifestResolver.resolve →
# Conformance.check_candidate → publish_or_upgrade). There is ZERO self-publish
# from the kanban plugin's boot — and ZERO plugin-side socialware module at all
# (Decision #156: socialware carries zero code; tests drive this SAME file via
# Ezagent.Socialware.ShippedManifest). Semantics are the judge: this file must
# resolve to the exact Definition the retired code attrs produced (conformance
# 15/15 green).
#
# Shape notes (the three data diffs vs hello, per the kanban handoff):
#   * roles — two active cc-headless collaborators plus one passive native board
#     data role. Passive data roles are materialized without session.join and
#     are addressable only through the composition edge.
#   * routing_rules — ONLY the #1190 relay-back rule, #1212-hardened to
#     and(text_contains "__done__", from_role dev-together). NEVER hello's
#     `always → chat` rule (handoff red line). The "__done__" literal is the
#     spec §4.2 contract point — byte-identical to the marker in
#     `.claude/skills/kanban-assistant/references/*` (locked by
#     `relay-signal-check.sh` + `kanban_manifest_test.exs`, both reading THIS
#     file as the authoritative carrier).
#   * visibility_policy — public + supervised like hello, but
#     web_anon_access: false (a kanban board is not an anonymous public page).
name: kanban
version: "0.1.0"
title: "Kanban 看板团队"
description: "看板团队 socialware：kanban-assistant 协调 + dev-together 开发 + workspace 看板数据，__done__ 内容触发 relay-back。"
uses:
  - kanban
bases:
  - Ezagent.ActionSet.Session
views:
  - kanban_render
roles:
  - role_name: kanban-assistant
    fill: agent
    recipe: kanban-assistant
    flavor: cc-headless
    operates:
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: add_node}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: rename_node}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: move_node}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: remove_node}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: set_stage}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: claim_node}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: unclaim_node}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: set_status}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: attach_artifact}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: detach_artifact}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: set_metric}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: drop_subtree}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: get_tree}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: export_markmap}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: import_markmap}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: register_pr}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: attach_code_file}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: sync_miro}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: set_board_config}
      - {role: board, behavior: Ezagent.ActionSet.Kanban, action: save_miro_creds}
  - role_name: dev-together
    fill: agent
    recipe: dev-together
    flavor: cc-headless
  - role_name: board
    fill: agent
    recipe: kanban-manager
    flavor: native
routing_rules:
  - matcher:
      type: and
      items:
        - type: text_contains
          arg: "__done__"
        - type: from_role
          arg: dev-together
    receivers:
      - kanban-assistant
    rule_set: relay-back
    position: 0
legends:
  kanban:
    member_set:
      - kanban-assistant
      - dev-together
    bound_rule_set: relay-back
    fold: false
  collaboration:
    protocol: >-
      协作行话速查（进场必读，人类成员/新 agent 同样适用）：dev 只做开发不碰看板——
      接活后干完，在消息里发 "__done__" 并带上 PR 链接，路由会自动转给看板助手
      （只有 dev-together 槽的成员发才有效）。看板助手统一管卡：建卡、指派、收到
      "__done__" 后登记 PR、用 gh 验证 CI 绿再推进阶段。不知道怎么做时 @看板助手问。
    fold: false
visibility_policy:
  scope: public
  publish_policy: supervised
  web_anon_access: false
owner_policy:
  type: installer
