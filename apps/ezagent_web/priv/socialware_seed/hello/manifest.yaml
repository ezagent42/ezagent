name: hello
version: "0.1.0"
title: "Hello website builder"
description: "Build and publish a website through a two-agent Hello team."
uses:
  - hello
bases:
  - Ezagent.ActionSet.Session
  - Ezagent.ActionSet.Publisher.SessionImpl
shape:
  - Ezagent.ActionSet.Turn
  - Ezagent.ActionSet.Surface
  - Ezagent.ActionSet.HelloSessionActions
views:
  - hello_render
roles:
  - role_name: front-desk
    fill: agent
    recipe: hello.front-desk
    flavor: hello
  - role_name: llm
    fill: agent
    recipe: hello.llm
    flavor: curl
    credential_admission: before_session_join
    provider: deepseek
    config:
      provider: deepseek
      api_url: https://api.deepseek.com/chat/completions
      model: deepseek-v4-flash
routing_rules:
  - matcher:
      type: always
    receivers:
      - front-desk
    rule_set: default
    position: 0
visibility_policy:
  scope: public
  publish_policy: auto
  web_anon_access: true
prompt_templates: {}
legends: {}
