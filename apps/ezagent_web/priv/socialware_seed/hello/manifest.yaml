name: hello
version: "0.1.0"
title: "Hello website builder"
description: "Build and publish a website through a seven-role Hello team."
uses:
  - hello
bases:
  - Ezagent.ActionSet.Session
  - Ezagent.ActionSet.Publisher.SessionImpl
shape:
  - Ezagent.ActionSet.Turn
  - Ezagent.ActionSet.Surface
views:
  - hello_render
roles:
  - role_name: front-desk
    fill: agent
    recipe: hello.front-desk
    flavor: hello
  - role_name: builder
    fill: agent
    recipe: hello.builder
    flavor: native
  - role_name: concierge
    fill: agent
    recipe: hello.concierge
    flavor: native
  - role_name: llm
    fill: agent
    recipe: hello.llm
    flavor: curl
    config:
      provider: deepseek
      api_url: https://api.deepseek.com/chat/completions
      model: deepseek-v4-flash
  - role_name: sharer
    fill: agent
    recipe: hello.sharer
    flavor: native
  - role_name: publisher
    fill: agent
    recipe: hello.publisher
    flavor: native
  - role_name: dispatcher
    fill: agent
    recipe: hello.dispatcher
    flavor: native
routing_rules:
  - matcher:
      type: always
    receivers:
      - front-desk
    rule_set: default
    position: 0
visibility_policy:
  scope: public
  publish_policy: auto
  web_anon_access: true
prompt_templates: {}
legends: {}
