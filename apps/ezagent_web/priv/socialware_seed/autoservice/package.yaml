# AutoService Tier-1 — legacy socialware package.
#
# Canonical socialware manifest fields now live in ./manifest.yaml. This legacy
# package stays for persona/kb seed data until the assets pipeline lands.
#
# This package is the PRODUCT DEFINITION of the AutoService Tier-1 socialware
# app. The installer (scripts/autoservice_tier1_seed.exs — transitional; the
# boundary doc's target is a generic Socialware installer) reads this data and
# drives supported install/runtime paths. It is NOT runtime substrate and NOT
# the installer itself.
#
# Boundary spec: docs/together/contributing/socialware-data-deployment-boundary.md
name: autoservice-tier1
version: 0

# ── wired now (this slice): read from package data by the installer ─────────
persona:
  # Written to the orchestrator agent's project CLAUDE.md before PTY launch.
  # `{{kb_agent}}` is templated with the kb-agent name at install time.
  support-agent: persona/support-agent.md
kb:
  # Ingested as a workspace kb resource. `fact_token` is the soul anchor a
  # correct S3 answer must quote (only present in the corpus, never the model).
  tier1-corpus: kb/tier1-corpus.md
  fact_token: ZEPHYR-7731

# ── declared: still wired in installer code, later slices move these to data ─
session:
  name: autosvc-tier1
  public_view: true
  web_anon_access: true
routing:
  # customer's BARE message (no @mention) → the AutoService agent, session-scoped
  - match: in_session
    receiver: autoservice-agent
roles:
  autoservice:
    operates:
      - { role: kb, behavior: Ezagent.ActionSet.Kb, action: query }
  kb:
    recipe: kb
    flavor: native
surface:
  customer: /socialware/chat
