<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产品详情 · Product — Ezagent</title>
<meta name="description" content="一个 gallery 产品的详情：试用它，或 fork 成你自己的。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ezagent42/design-system@main/styles.css">
<style>
  body{background:var(--ground);color:var(--ink);margin:0;font-family:var(--font-cn-ui),var(--font-ui);font-weight:450;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:26px 28px 130px}
  .over{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  a{color:inherit;text-decoration:none}
  .back{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:12px;color:var(--ink-3);margin-top:20px}
  .back:hover{color:var(--ink)}
  .hero{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:30px 32px;margin-top:16px}
  .hero .hd{display:flex;align-items:center;gap:16px}
  .hero .av{width:60px;height:60px;border-radius:var(--r-md);flex:none;display:grid;place-items:center;font-family:var(--font-cn);font-weight:600;font-size:30px;color:#fff;background:var(--rc,var(--accent));box-shadow:0 12px 26px -10px var(--rc,var(--accent))}
  .hero h1{font-family:var(--font-cn);font-weight:600;font-size:clamp(22px,3.4vw,28px);line-height:1.28;margin:0}
  .hero .by{font-family:var(--font-cn-ui);font-size:13px;color:var(--ink-3);margin-top:6px}
  .hero .desc{font-size:15px;line-height:1.7;color:var(--ink-2);margin:20px 0 0}
  /* manifest strip */
  .manifest{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border-radius:var(--r-md);overflow:hidden;margin:22px 0 0}
  .mf{background:var(--card);padding:13px 15px}
  .mf .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .mf .v{font-family:var(--font-mono);font-size:13px;color:var(--ink);margin-top:4px}
  .mf .v.live{color:var(--success-text)}
  .actions{display:flex;gap:12px;margin:26px 0 0;flex-wrap:wrap}
  .btn{appearance:none;border:0;cursor:pointer;font-family:var(--font-cn-ui);font-weight:600;font-size:15px;padding:14px 26px;border-radius:var(--r-pill);transition:transform 150ms var(--ease-out),background 150ms;display:inline-flex;align-items:center;gap:8px}
  .btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-accent)}
  .btn.primary:hover{transform:translateY(-2px);background:var(--accent-hover)}
  .btn.ghost{background:var(--ground-2);color:var(--ink)}
  .btn.ghost:hover{background:var(--ground-hover)}
  /* 朴素 dev 说明框 —— 与 world 占位页同款：直接列出后端待建功能 */
  .backend-note{margin:26px 0 0;border:1px dashed var(--ink-4);border-radius:var(--r-md);padding:18px 20px;font-family:var(--font-mono)}
  .backend-note .bh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
  .backend-note ul{margin:0;padding:0;list-style:none}
  .backend-note li{font-size:13px;line-height:1.6;color:var(--ink-2);padding-left:18px;position:relative;margin-bottom:8px}
  .backend-note li:last-child{margin-bottom:0}
  .backend-note li:before{content:"+";position:absolute;left:0;top:0;color:var(--ink-4);font-weight:700}
  .backend-note li .w{color:var(--ink-4);font-size:11.5px;margin-left:6px}
</style>
</head>
<body data-fw-route="seller" data-fw-step="S1">
<div class="wrap">
  <span class="over">Gallery · 产品详情</span><br>
  <a class="back" href="gallery.html">← 返回探索 · Explore</a>

  <div class="hero ez-fade-up" id="hero"></div>

  <div class="backend-note">
    <div class="bh">world / 后端需要加的功能</div>
    <ul>
      <li>目录 API 提供这个产品的详情（标题 / 简介 / 作者 / 版本）<span class="w">W-G1</span></li>
      <li>点「Fork」从产品页触发 fork —— 复制 session 配置、建新 session、触发者成 owner<span class="w">W-G3</span></li>
      <li>展示 version，并支持 pin 到某版本 / 下架<span class="w">W-G4</span></li>
      <li>Definition 加 owner / 作者字段（卡片署名、回流归属要用）<span class="w">W-G5</span></li>
    </ul>
  </div>
</div>

<script src="../assets/js/demo-state.js"></script>
<script src="gallery-data.js"></script>
<script>
  var name = new URLSearchParams(location.search).get('sw') || 'expert-recruit';
  var p = FW.get(name) || FW.products()[0];
  document.title = p.title + ' · Ezagent';
  var catLabel = { hire: '招募 · Hire', match: '撮合 · Match', custom: '自定义 · Custom' }[p.category] || p.category || '—';
  document.getElementById('hero').innerHTML =
    '<div class="hd"><div class="av" style="--rc:' + (p.color || 'var(--accent)') + '">' + (p.glyph || 'A') + '</div>'
    + '<div><h1>' + p.title + '</h1><div class="by">' + p.owner + '</div></div></div>'
    + '<p class="desc">' + p.description + '</p>'
    + '<div class="manifest">'
    + '<div class="mf"><div class="k">name</div><div class="v">' + p.name + '</div></div>'
    + '<div class="mf" data-w="W-G4"><div class="k">version</div><div class="v">v' + p.version + '</div></div>'
    + '<div class="mf" data-w="W-G5"><div class="k">owner · 作者</div><div class="v">' + (p.owner.split(' · ')[0]) + '</div></div>'
    + '<div class="mf"><div class="k">visibility</div><div class="v live">public_view</div></div>'
    + '<div class="mf"><div class="k">category</div><div class="v">' + catLabel + '</div></div>'
    + '</div>'
    + '<div class="actions">'
    + '<a class="btn primary" data-w="W-G3" href="world-step.html?mode=fork&src=' + encodeURIComponent(p.name) + '">Fork 复制成我的 · Fork this</a>'
    + '<a class="btn ghost" href="' + (p.tryUrl || '../recruit/') + '" target="_blank" rel="noopener">试用 · Try →</a>'
    + '</div>';
  // ribbon 下一步指向 Fork
  document.body.setAttribute('data-fw-next', 'world-step.html?mode=fork&src=' + encodeURIComponent(p.name));
  document.body.setAttribute('data-fw-next-label', 'Fork 复制成我的');
</script>
<script src="flywheel-ribbon.js"></script>
</body>
</html>
