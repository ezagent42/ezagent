/* ── Cases 页特有构件 ── */
/* 两栏：左侧纵向目录 rail（主内容区内）+ 正文 */
.caselayout{display:grid;grid-template-columns:128px 1fr;gap:44px;align-items:start;margin-top:var(--gap-grid)}
.subnav{position:sticky;top:96px;display:flex;flex-direction:column;gap:2px}
.subnav a{font-family:var(--font-mono);font-size:12px;color:var(--ink-3);padding:9px 12px;border-radius:var(--r-sm);border-left:2px solid transparent;transition:all 150ms var(--ease-out)}
.subnav a:hover{color:var(--ink);background:var(--ground-2);border-left-color:var(--line)}
.subnav a.active{color:var(--accent-press);border-left-color:var(--accent);background:var(--accent-wash)}
/* 跳转到达:章节标题闪烁两次 */
@keyframes flash2{0%,100%{background-color:transparent;box-shadow:0 0 0 4px transparent}15%,55%{background-color:var(--accent-wash);box-shadow:0 0 0 4px var(--accent-wash)}35%,75%{background-color:transparent;box-shadow:0 0 0 4px transparent}}
h2.flashing{animation:flash2 1.1s ease-in-out;border-radius:8px}
/* hero 成果数字带 */
.herostats{display:flex;flex-wrap:wrap;gap:18px;padding:0 80px 40px}
.herostats .hs{flex:1;min-width:150px;background:var(--ground-2);border-radius:var(--r-md);padding:18px 20px}
.herostats .hs b{display:block;font-family:var(--font-ui);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.02em;color:var(--accent)}
.herostats .hs span{display:block;font-size:13px;color:var(--ink-2);margin-top:8px}
.herostats .hs .src{font-family:var(--font-mono);font-size:10px;color:var(--ink-4);margin-top:6px}
/* 客户简介行 */
.intro{display:flex;gap:30px;align-items:flex-start;padding:28px 32px;flex-wrap:wrap}
.intro .lead2{flex:1;min-width:260px;font-size:15px;line-height:1.75;color:var(--ink-2)}
.intro .facts{display:flex;flex-direction:column;gap:9px;min-width:200px}
.intro .facts div{display:flex;justify-content:space-between;gap:16px;font-size:13px;border-bottom:1px solid var(--line);padding-bottom:8px}
.intro .facts .k{color:var(--ink-3);font-family:var(--font-mono);font-size:11px}
.intro .facts .v{color:var(--ink);font-weight:600}
/* 解决方案：编号场景行 */
.scn{display:flex;gap:20px;padding:24px 30px;align-items:flex-start}
.scn+.scn{margin-top:12px}
.scn .no{flex:none;width:42px;height:42px;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:16px}
.scn .body{flex:1}
.scn h3{font-family:var(--font-cn);font-weight:600;font-size:18px}
.scn p{color:var(--ink-2);font-size:14.5px;line-height:1.65;margin-top:6px}
/* 成效补充行 */
.r-more{margin-top:16px;font-size:14px;line-height:1.8;color:var(--ink-2)}
.r-more b{color:var(--ink)}
/* pull-quote 证言 */
.quote{margin-top:50px;padding:46px 52px;text-align:center;background:#14131C;color:#F4F2EC;border-radius:var(--r-lg)}
:root[data-theme="dark"] .quote{background:#000}
.quote .q{font-family:var(--font-cn);font-weight:500;font-size:clamp(20px,2.6vw,27px);line-height:1.5;max-width:28ch;margin:0 auto}
.quote .by{font-family:var(--font-mono);font-size:12px;color:#85837B;margin-top:20px}
/* CTA */
.ctaband{margin-top:var(--gap-grid);padding:32px 38px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--accent-wash);border-radius:var(--r-lg)}
.ctaband .t{font-family:var(--font-cn);font-weight:600;font-size:19px;color:var(--accent-press)}
.ctaband .btn{margin-left:auto}
@media (max-width:860px){

  .herostats{padding:0 26px 26px}.scn{padding:22px 22px}.quote{padding:34px 24px}

<script>
document.getElementById('theme').addEventListener('click',()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';});
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);
  e.target.querySelectorAll('.fill[data-w]').forEach(f=>{if(reduce){f.style.width=f.dataset.w+'%';}else{requestAnimationFrame(()=>f.style.width=f.dataset.w+'%');}});
});},{threshold:.3});
document.querySelectorAll('.ba').forEach(s=>io.observe(s));
// 子导航点击:平滑滚动,让章节标题落在视口中央(不被顶栏遮挡)
document.querySelectorAll('.subnav a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{
  const t=document.getElementById(a.getAttribute('href').slice(1));
  if(t){e.preventDefault();t.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});history.replaceState(null,'','#'+t.id);
    const hd=t.querySelector('h2')||t;
    setTimeout(()=>{hd.classList.remove('flashing');void hd.offsetWidth;hd.classList.add('flashing');
      hd.addEventListener('animationend',()=>hd.classList.remove('flashing'),{once:true});}, reduce?0:360);
  }
}));
// 滚动时高亮当前章节(标题接近视口中央时激活)
const navlinks=[...document.querySelectorAll('.subnav a[href^="#"]')];
const spy=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)navlinks.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+en.target.id));}),{rootMargin:'-45% 0px -45% 0px'});
['overview','challenge','solution','results','method'].forEach(id=>{const el=document.getElementById(id);if(el)spy.observe(el);});
</script>
