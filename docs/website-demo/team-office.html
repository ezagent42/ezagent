<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>这支队伍怎么发布 · Team office · Ezagent</title>
<meta name="description" content="Ezagent contributors — 一间会动的办公室。每个真实成员一张桌，坐在屏前操作电脑，屏幕上是他正在做的项目。">
<!--
  team-office.html · contributors「办公室」demo（FP6 衍生）
  ─────────────────────────────────────────────────────────────────────
  复用 index.html 的设计系统 token + fu(FadeUpBlur) 入场 + reduced-motion 块。
  数据走同一个 mock-ezagent-api.js 的 EZ.contributors()（遵 #1072：业务数据只在数据层）。
  参考观感：office-loop.mp4（近俯视工位网格，每桌一个小人敲彩色键盘，屏幕放各自的活）。
  风格：扁平矢量 + De Stijl 原色键盘 + 几何小人（圆头+剩影肩），非像素、非渐变。
  v1：先把框架立起来（9 桌 = 9 真人 + 敲键微动 + 屏幕分角色）。细节后续迭代。
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{
  --ground:#E8E8EB;--ground-2:#EFEFF1;--ground-hover:#E4E4E8;--card:#FFFFFF;
  --ink:#17171B;--ink-2:#56565E;--ink-3:#8A8A92;--ink-4:#B6B6BC;--line:#E2E2E6;
  --red:#D81830;--blueink:#0048A8;--yellow:#FFD400;--jade:#0FA06E;
  --blue:#0B5CFF;--blue-deep:#0040C4;--blue-wash:#E7EEFF;--orange:#FF8A1E;
  --jade-wash:#DCF1E8;--red-wash:#FAE0E3;--yellow-wash:#FFF4CC;--orange-wash:#FFEBD6;
  --accent:var(--blue);--accent-hover:#1466FF;--accent-press:var(--blue-deep);
  --accent-wash:var(--blue-wash);--on-accent:#FFFFFF;--focus-ring:rgba(11,92,255,.45);
  --success:var(--jade);--danger:var(--red);--warning:var(--orange);
  --font-ui:'Inter',system-ui,-apple-system,sans-serif;
  --font-cn:'Noto Serif SC','Songti SC',serif;
  --font-cn-ui:'Noto Sans SC','PingFang SC',sans-serif;
  --font-mono:'Space Mono',ui-monospace,Menlo,monospace;
  --r-sm:10px;--r-md:16px;--r-lg:22px;--r-pill:999px;
  --shadow-sm:0 1px 2px rgba(15,15,15,.04),0 8px 24px -12px rgba(15,15,15,.14);
  --shadow-card:0 60px 80px rgba(15,15,15,.07),0 25px 33px rgba(15,15,15,.05),0 13.4px 17.9px rgba(15,15,15,.045),0 7.5px 10px rgba(15,15,15,.04),0 4px 5.3px rgba(15,15,15,.03),0 1.7px 2.2px rgba(15,15,15,.022);
  --ease-out:cubic-bezier(.16,1,.3,1);--dur-base:250ms;--dur-enter:500ms;
  --gap-grid:22px;--pad-page-x:44px;--container:1280px;
  /* desk surfaces */
  --desk:#FFFFFF;--desk-edge:#E9E9ED;--screen-dark:#14131C;--seat:#2A2832;
}
:root[data-theme="dark"]{
  --ground:#16151C;--ground-2:#211F2A;--ground-hover:#2A2834;--card:#1E1C26;
  --ink:#F4F2EC;--ink-2:#B6B4AC;--ink-3:#85837B;--ink-4:#56544D;--line:#332F3B;
  --red:#FF5A4D;--blueink:#4D8DF0;--yellow:#FFD84D;--jade:#34D6A0;
  --blue:#5AA2FF;--blue-deep:#A9CBFF;--blue-wash:#1E2A40;--orange:#FFA94D;
  --jade-wash:#173A2E;--red-wash:#3E211E;--yellow-wash:#3A3416;--orange-wash:#3A2A16;
  --accent-hover:#74B2FF;--on-accent:#0E1A2E;--focus-ring:rgba(90,162,255,.5);
  --shadow-card:inset 0 0 0 1px rgba(244,242,236,.07),0 26px 60px -20px rgba(0,0,0,.72);
  --shadow-sm:inset 0 0 0 1px rgba(244,242,236,.06),0 10px 26px -12px rgba(0,0,0,.6);
  --desk:#272531;--desk-edge:#332F3B;--screen-dark:#0C0B12;--seat:#0A0910;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-cn-ui),var(--font-ui);
  font-weight:450;-webkit-font-smoothing:antialiased;transition:background var(--dur-base) var(--ease-out)}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--font-mono);letter-spacing:.02em}
.over{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.wrap{max-width:var(--container);margin:0 auto;padding:0 var(--pad-page-x)}

/* slim header */
.bar{display:flex;align-items:center;gap:14px;padding:22px 0 6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-ui);font-weight:800;letter-spacing:-.01em;font-size:17px}
.brand .cube{width:22px;height:22px}
.bar .spacer{flex:1}
.iconbtn{appearance:none;border:0;cursor:pointer;width:38px;height:38px;border-radius:var(--r-pill);background:var(--ground-2);color:var(--ink-2);display:grid;place-items:center;transition:all 150ms var(--ease-out)}
.iconbtn:hover{background:var(--ground-hover);color:var(--ink)}
.backlink{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);padding:9px 16px;border-radius:var(--r-pill);background:var(--ground-2);transition:all 150ms var(--ease-out)}
.backlink:hover{background:var(--ink);color:var(--card)}
a{color:inherit;text-decoration:none}

/* section head */
.sec-head{margin:30px 0 26px}
.sec-head h2{font-family:var(--font-cn);font-weight:600;font-size:clamp(26px,3.4vw,34px);line-height:1.2;margin-top:8px}
.sec-head .sub{color:var(--ink-2);margin-top:8px;font-size:16px;max-width:62ch}

/* ── 办公室地板 ──────────────────────────────────────────────────────────── */
.office{display:grid;grid-template-columns:repeat(3,1fr);gap:46px 40px;padding:18px 0 10px}
.seat{display:flex;flex-direction:column;align-items:center;gap:14px;
  animation:fu var(--dur-enter) var(--ease-out) both}
.desk{position:relative;width:100%;max-width:240px;cursor:default;
  transition:transform 220ms var(--ease-out),filter 220ms var(--ease-out)}
.desk svg{display:block;width:100%;height:auto;overflow:visible}
.seat:hover .desk{transform:translateY(-6px)}
.seat:hover .desk svg{filter:drop-shadow(0 26px 28px rgba(15,15,15,.16))}
/* hover 暂停该桌动画 */
.seat:hover .anim{animation-play-state:paused}

/* 铭牌 */
.plate{text-align:center;line-height:1.35}
.plate .nm{font-family:var(--font-cn);font-weight:600;font-size:16px;color:var(--ink)}
.plate .gh{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-3);margin-top:1px}
.plate .badge{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-family:var(--font-mono);
  font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:var(--r-pill)}
.plate .badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.badge.lead{background:var(--orange-wash);color:var(--orange)}
.badge.dev{background:var(--blue-wash);color:var(--blue-deep)}
.badge.designer{background:var(--jade-wash);color:var(--jade)}
.badge.agent{background:var(--ground-2);color:var(--ink-3)}
.plate .track{font-size:12px;color:var(--ink-2);margin-top:8px;max-width:24ch;margin-left:auto;margin-right:auto}

footer{margin:54px 0 40px;color:var(--ink-3);font-size:13px;text-align:center;line-height:1.7}
footer .mono{font-size:11px}

/* ── 微动作 keyframes ─────────────────────────────────────────────────────── */
@keyframes fu{from{opacity:0;transform:translateY(20px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes headBob{0%,100%{transform:translateY(0)}50%{transform:translateY(1.3px)}}
@keyframes handL{0%,100%{transform:translateY(0)}40%{transform:translateY(-1.6px)}}
@keyframes handR{0%,100%{transform:translateY(-1.6px)}45%{transform:translateY(0)}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes codeline{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes cubeSpin{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-2px) rotate(4deg)}}
@keyframes think{0%,80%,100%{opacity:.2}40%{opacity:1}}
.anim{transform-box:fill-box;transform-origin:center}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:980px){.office{grid-template-columns:repeat(2,1fr);gap:40px 30px}}
@media (max-width:620px){.office{grid-template-columns:1fr}.wrap{padding:0 20px}}
</style>
</head>
<body>

<div class="wrap">
  <header class="bar">
    <div class="brand"><svg class="cube" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l9 5-9 5-9-5z" fill="#FFD400"/><path d="M3 7l9 5v10l-9-5z" fill="#D81830"/><path d="M21 7l-9 5v10l9-5z" fill="#0048A8"/></svg><span>EZAGENT</span></div>
    <span class="spacer"></span>
    <a class="backlink" href="index.html#contributors">← 返回官网 · Back</a>
    <button class="iconbtn" id="theme" title="切换主题 · Theme" aria-label="切换主题">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="sec-head">
    <span class="over">Contributors · 团队</span>
    <h2>这支队伍怎么发布</h2>
    <p class="sub">一间会动的办公室 — 每个真实成员一张桌，坐在屏前操作电脑，屏幕上是他正在做的项目。数据源 docs/together/team.md。</p>
  </div>

  <div class="office" id="office"></div>

  <footer>
    <div>组织的 IDE · Organization IDE — Ezagent</div>
    <div class="mono">contributors 办公室 demo · 数据走 EZ.contributors() · 参考 office-loop.mp4</div>
  </footer>
</div>

<script src="mock-ezagent-api.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const hashN=(s,m)=>[...(s||'')].reduce((a,c)=>a+c.charCodeAt(0),0)%m;

$('#theme').addEventListener('click',()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'});

/* role → 屏幕类型 / 键盘色 / badge 文案 ─────────────────────────────────────── */
const KBD=['var(--red)','var(--blue)','var(--yellow)','var(--jade)','var(--blueink)','var(--orange)'];
const ROLE_SCREEN={lead:'code','human-dev':'code',designer:'canvas',agent:'cube'};
const ROLE_BADGE={lead:'lead',
  'human-dev':'dev',designer:'designer',agent:'agent'};
const ROLE_CN={lead:'lead · 队长','human-dev':'dev · 开发',designer:'designer · 设计',agent:'agent · AI'};

/* ── 一张桌的 SVG（近俯视：后排显示器 / 中间键盘+手 / 近处小人）─────────────── */
function deskSVG(m){
  const kbd=KBD[hashN(m.gh,KBD.length)];
  const screen=ROLE_SCREEN[m.role]||'code';
  const delay=(hashN(m.gh,28)/10).toFixed(2);          // 错峰相位，整屋不同步
  let screenInner='';
  if(screen==='code'){
    screenInner=`
      <rect x="70" y="20" width="100" height="58" rx="4" fill="var(--screen-dark)"/>
      <g class="anim" style="animation:codeline 2.4s var(--ease-out) infinite;animation-delay:${delay}s">
        <rect x="78" y="28" width="40" height="3.4" rx="1.7" fill="var(--jade)"/>
        <rect x="78" y="36" width="64" height="3.4" rx="1.7" fill="var(--ink-4)"/>
        <rect x="78" y="44" width="52" height="3.4" rx="1.7" fill="var(--blue)"/>
        <rect x="78" y="52" width="70" height="3.4" rx="1.7" fill="var(--ink-4)"/>
        <rect x="78" y="60" width="34" height="3.4" rx="1.7" fill="var(--orange)"/>
      </g>
      <rect class="anim" x="116" y="60" width="6" height="3.4" fill="#fff" style="animation:caret 1s steps(1) infinite;animation-delay:${delay}s"/>`;
  }else if(screen==='canvas'){
    screenInner=`
      <rect x="70" y="20" width="100" height="58" rx="4" fill="#F4F4F6"/>
      <rect x="78" y="28" width="38" height="26" rx="3" fill="var(--blue)"/>
      <rect x="120" y="28" width="42" height="12" rx="3" fill="var(--yellow)"/>
      <rect x="120" y="44" width="42" height="10" rx="3" fill="var(--red)"/>
      <rect class="anim" x="78" y="60" width="84" height="10" rx="3" fill="var(--jade)" style="animation:codeline 2.8s var(--ease-out) infinite;animation-delay:${delay}s"/>`;
  }else{ // cube — agent
    screenInner=`
      <rect x="70" y="20" width="100" height="58" rx="4" fill="var(--screen-dark)"/>
      <g class="anim" style="transform-origin:120px 46px;animation:cubeSpin 2.8s var(--ease-out) infinite;animation-delay:${delay}s">
        <path d="M120 32l13 7-13 7-13-7z" fill="var(--yellow)"/>
        <path d="M107 39l13 7v14l-13-7z" fill="var(--red)"/>
        <path d="M133 39l-13 7v14l13-7z" fill="var(--blueink)"/>
      </g>
      <g fill="var(--blue)">
        <circle class="anim" cx="110" cy="70" r="2.4" style="animation:think 1.4s infinite;animation-delay:0s"/>
        <circle class="anim" cx="120" cy="70" r="2.4" style="animation:think 1.4s infinite;animation-delay:.2s"/>
        <circle class="anim" cx="130" cy="70" r="2.4" style="animation:think 1.4s infinite;animation-delay:.4s"/>
      </g>`;
  }
  return `<svg viewBox="0 0 240 200" role="img" aria-label="${m.cn} 的工位">
    <!-- 地面投影 -->
    <ellipse cx="120" cy="186" rx="92" ry="13" fill="rgba(15,15,15,.07)"/>
    <!-- 桌面（近俯视，略带前宽透视） -->
    <path d="M44 86 L196 86 L210 168 L30 168 Z" fill="var(--desk)" stroke="var(--desk-edge)" stroke-width="1.5"/>
    <!-- 显示器 -->
    <rect x="64" y="14" width="112" height="70" rx="7" fill="#0F0E16"/>
    ${screenInner}
    <rect x="112" y="84" width="16" height="8" fill="var(--desk-edge)"/>
    <!-- 键盘（De Stijl 原色） -->
    <rect x="86" y="120" width="68" height="20" rx="4" fill="${kbd}"/>
    <g opacity=".28" fill="#000">
      <rect x="92" y="125" width="8" height="4" rx="1"/><rect x="104" y="125" width="8" height="4" rx="1"/>
      <rect x="116" y="125" width="8" height="4" rx="1"/><rect x="128" y="125" width="8" height="4" rx="1"/>
      <rect x="140" y="125" width="8" height="4" rx="1"/>
      <rect x="98" y="132" width="44" height="4" rx="2"/>
    </g>
    <!-- 小人：圆头 + 剩影肩，近处压在桌前缘 -->
    <g class="anim" style="transform-origin:120px 168px;animation:headBob 2.8s var(--ease-out) infinite;animation-delay:${delay}s">
      <path d="M86 196 Q120 150 154 196 Z" fill="var(--seat)"/>
      <circle cx="120" cy="158" r="20" fill="var(--seat)"/>
    </g>
    <!-- 双手敲键 -->
    <rect class="anim" x="96" y="142" width="14" height="10" rx="5" fill="var(--seat)" style="transform-origin:center;animation:handL .82s var(--ease-out) infinite;animation-delay:${delay}s"/>
    <rect class="anim" x="130" y="142" width="14" height="10" rx="5" fill="var(--seat)" style="transform-origin:center;animation:handR .82s var(--ease-out) infinite;animation-delay:${delay}s"/>
  </svg>`;
}

/* ── 渲染整间办公室 ──────────────────────────────────────────────────────── */
(async()=>{
  const office=$('#office');
  const list=await EZ.contributors();
  list.forEach((m,i)=>{
    const seat=document.createElement('div');
    seat.className='seat';
    seat.style.animationDelay=(i*70)+'ms';   // 桌子错峰浮入
    seat.innerHTML=`
      <div class="desk">${deskSVG(m)}</div>
      <div class="plate">
        <div class="nm">${m.cn}</div>
        <div class="gh">@${m.gh}</div>
        <div class="badge ${ROLE_BADGE[m.role]||'agent'}"><span class="dot"></span>${ROLE_CN[m.role]||m.role}</div>
        <div class="track">${m.track}</div>
      </div>`;
    office.appendChild(seat);
  });
})();
</script>
</body>
</html>
