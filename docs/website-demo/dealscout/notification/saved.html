<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保存的搜索 · Saved searches · DealScout</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ezagent42/design-system@main/styles.css">
<style>
  body{max-width:720px;margin:40px auto;padding:0 24px 80px;background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-weight:450;-webkit-font-smoothing:antialiased}
  .back{display:inline-block;margin-bottom:20px;font-size:13px;color:var(--ink-3);text-decoration:none;transition:color .15s var(--ease-out)}
  .back:hover{color:var(--accent)}
  h1{font-family:var(--font-cn);font-size:28px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--ink-3);font-size:14px;margin-bottom:24px}

  .saved-card{padding:18px 20px;background:var(--card);border:2px solid transparent;border-radius:var(--r-lg);margin-bottom:10px;box-shadow:var(--shadow-sm);transition:all .15s var(--ease-out);display:flex;gap:16px;align-items:center}
  .saved-card.has-new{border-color:var(--accent);background:var(--accent-wash)}
  .saved-card .info{flex:1;min-width:0}
  .saved-card .type{font-family:var(--font-mono);font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.08em}
  .saved-card .query{font-weight:600;font-size:14px;color:var(--ink);margin:2px 0}
  .saved-card .meta{font-size:11px;color:var(--ink-4)}
  .saved-card .badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:600;flex-shrink:0}
  .badge.new{background:var(--accent);color:var(--on-accent)}
  .badge.waiting{background:var(--ground-2);color:var(--ink-3)}
  .btn{font-family:var(--font-ui);font-size:13px;font-weight:600;padding:8px 18px;border-radius:var(--r-pill);border:0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:all .15s var(--ease-out)}
  .btn.primary{background:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{transform:translateY(-1px)}
  .btn.ghost{background:var(--ground-2);color:var(--ink-2)}
  .btn.ghost:hover{background:var(--ground-hover);color:var(--ink)}

  .notice-bar{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--accent-wash);border:1px solid var(--accent);border-radius:var(--r-md);margin-bottom:20px;font-size:13px;color:var(--accent-press)}
  .notice-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>

<a class="back" href="../">← 返回 DealScout · Back</a>
<h1>保存的搜索 · Saved searches</h1>
<p class="sub">你保存的搜索条件。有新匹配时，这里会标记并通知你。</p>

<div class="notice-bar">
  <span class="dot"></span> 你有 <b>3 个新匹配</b> · 3 new matches across saved searches
</div>

<div id="savedList"></div>

<script>
var SEARCHES=[
  {type:'funding',query:'FinTech 跨境支付 A 轮基金',newMatches:2,lastCheck:'2 小时前',id:'s1'},
  {type:'cofounder',query:'AI 法务 SaaS 技术合伙人',newMatches:1,lastCheck:'1 天前',id:'s2'},
  {type:'exit',query:'跨境支付 M&A 买方',newMatches:0,lastCheck:'3 天前',id:'s3'},
];

function render(){
  document.getElementById('savedList').innerHTML=SEARCHES.map(function(s){
    var badge=s.newMatches>0
      ?'<span class="badge new">'+s.newMatches+' 个新匹配</span><a class="btn primary" href="../?q='+encodeURIComponent(s.query)+'">查看 · View →</a>'
      :'<span class="badge waiting">暂无新匹配</span>';
    return'<div class="saved-card'+(s.newMatches>0?' has-new':'')+'">'
      +'<div class="info"><div class="type">'+s.type+' · saved search</div>'
      +'<div class="query">'+s.query+'</div>'
      +'<div class="meta">最后检查：'+s.lastCheck+'</div></div>'
      +badge+'</div>';
  }).join('');
}
render();

// Demo: request notification permission hint
if(window.Notification&&Notification.permission==='default'){
  var bar=document.querySelector('.notice-bar');
  bar.innerHTML+=' · <a href="#" onclick="if(Notification.permission===\'default\'){Notification.requestPermission().then(function(p){if(p===\'granted\'){alert(\'通知已开启 · Notifications enabled（demo）\');}});}return false;" style="color:var(--accent-press);text-decoration:underline">开启浏览器通知 · Enable notifications</a>';
}
</script>
</body>
</html>
