<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牵线收件箱 · Inbox · DealScout</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ezagent42/design-system@main/styles.css">
<style>
  body{max-width:720px;margin:40px auto;padding:0 24px 80px;background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-weight:450;-webkit-font-smoothing:antialiased}
  .back{display:inline-block;margin-bottom:20px;font-size:13px;color:var(--ink-3);text-decoration:none;transition:color .15s var(--ease-out)}
  .back:hover{color:var(--accent)}
  h1{font-family:var(--font-cn);font-size:28px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--ink-3);font-size:14px;margin-bottom:24px}

  .req-card{display:flex;gap:16px;padding:18px 20px;background:var(--card);border:2px solid transparent;border-radius:var(--r-lg);margin-bottom:10px;box-shadow:var(--shadow-sm);transition:all .15s var(--ease-out)}
  .req-card:hover{border-color:var(--line)}
  .req-card .av{width:48px;height:48px;border-radius:var(--r-md);display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0}
  .req-card .info{flex:1;min-width:0}
  .req-card .name{font-weight:700;font-size:15px;color:var(--ink)}
  .req-card .brief{font-size:12px;color:var(--ink-3);margin:4px 0 8px;line-height:1.5}
  .req-card .tags{display:flex;gap:4px;flex-wrap:wrap}
  .req-card .tags span{font-size:10px;padding:2px 8px;border-radius:var(--r-pill);background:var(--ground-2);color:var(--ink-3)}
  .req-card .score{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
  .req-card .score .pct{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--jade)}
  .req-card .score .lbl{font-size:9px;color:var(--ink-4)}
  .req-card .actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .btn{font-family:var(--font-ui);font-size:13px;font-weight:600;padding:8px 18px;border-radius:var(--r-pill);border:0;cursor:pointer;transition:all .15s var(--ease-out);text-decoration:none;display:inline-block;text-align:center}
  .btn.accept{background:var(--jade);color:#fff}
  .btn.accept:hover{transform:translateY(-1px)}
  .btn.decline{background:var(--ground-2);color:var(--ink-3)}
  .btn.decline:hover{background:var(--red-wash);color:var(--red)}

  .outcome{display:none;padding:12px 16px;border-radius:var(--r-md);text-align:center;font-size:13px;font-weight:600;margin-top:8px}
  .outcome.show{display:block}
  .outcome.accepted{border:2px solid var(--jade);background:var(--jade-wash);color:var(--success)}
  .outcome.declined{border:2px solid var(--red);background:var(--red-wash);color:var(--red)}

  .empty{padding:40px;text-align:center;color:var(--ink-4);font-size:14px}
</style>
</head>
<body>

<a class="back" href="../">← 返回 DealScout · Back</a>
<h1>牵线收件箱 · Inbox</h1>
<p class="sub">收到的牵线请求。查看对方名片，决定接受或拒绝。</p>

<div id="inbox"></div>

<script>
var INBOX=[
  {name:'某跨境支付 SaaS 创始人',brief:'天使轮刚关，在找 A 轮 FinTech 基金。产品已上线，月活商户 200+。',tags:['FinTech','跨境','天使轮','创始人'],glyph:'创',color:'var(--blue)',score:91,have:'产品 + 200+商户 + 牌照',need:'A 轮融资 500 万-1000 万美元'},
  {name:'AI 法务 SaaS 技术合伙人',brief:'做过 200+ 合同审查系统，懂 NLP + 法律知识图谱，找技术合伙人。',tags:['AI','法务','SaaS','技术合伙人'],glyph:'智',color:'var(--blueink)',score:87,have:'NLP + 法律知识图谱 + 行业 know-how',need:'技术合伙人（全栈/后端）'},
];
var accepted={},declined={};

function render(){
  var h='';
  INBOX.forEach(function(r,i){
    if(accepted[i]||declined[i])return;
    h+='<div class="req-card" id="req'+i+'">'
      +'<div class="av" style="background:'+r.color+'">'+r.glyph+'</div>'
      +'<div class="info"><div class="name">'+r.name+'</div>'
      +'<div class="brief">'+r.brief+'<br><br><b style="color:var(--ink-2)">我有：</b>'+r.have+'<br><b style="color:var(--ink-2)">找：</b>'+r.need+'</div>'
      +'<div class="tags">'+r.tags.map(function(t){return'<span>'+t+'</span>';}).join('')+'</div></div>'
      +'<div class="score"><span class="pct">'+r.score+'%</span><span class="lbl">匹配度</span></div>'
      +'<div class="actions"><button class="btn accept" onclick="respond('+i+',true)">接受 · Accept</button>'
      +'<button class="btn decline" onclick="respond('+i+',false)">拒绝 · Decline</button></div></div>';
  });
  if(!h)h='<div class="empty">收件箱为空 · Inbox empty<br><span style="font-size:12px;color:var(--ink-4)">牵线请求会出现在这里</span></div>';
  document.getElementById('inbox').innerHTML=h;
}
function respond(i,ok){
  if(ok){accepted[i]=true;var el=document.getElementById('req'+i);el.style.borderColor='var(--jade)';el.style.background='var(--jade-wash)';
    el.innerHTML='<div style="text-align:center;width:100%;padding:8px"><b style="color:var(--success)">✓ 已接受 · Accepted</b> — 双方进入 workspace</div>';}
  else{declined[i]=true;var el=document.getElementById('req'+i);el.style.opacity='0.4';
    el.innerHTML='<div style="text-align:center;width:100%;padding:8px;color:var(--ink-4)">已拒绝 · Declined</div>';}
}
render();
</script>
</body>
</html>
