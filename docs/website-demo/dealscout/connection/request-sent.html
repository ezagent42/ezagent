<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牵线请求已发送 · Request sent · DealScout</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ezagent42/design-system@main/styles.css">
<style>
  body{max-width:620px;margin:60px auto;padding:0 24px 80px;background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-weight:450;-webkit-font-smoothing:antialiased;text-align:center}
  .card{padding:32px 28px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-card);text-align:left}
  .card .av{width:56px;height:56px;border-radius:var(--r-md);display:grid;place-items:center;font-size:24px;font-weight:700;color:#fff;margin-bottom:12px}
  .card .name{font-family:var(--font-cn);font-weight:700;font-size:18px;color:var(--ink)}
  .card .brief{font-size:13px;color:var(--ink-3);margin:6px 0 16px;line-height:1.5}
  .card .tags{margin-bottom:16px;display:flex;gap:4px;flex-wrap:wrap}
  .card .tags span{font-size:10px;padding:2px 8px;border-radius:var(--r-pill);background:var(--ground-2);color:var(--ink-3)}
  .status{padding:16px 18px;border:2px dashed var(--orange);border-radius:var(--r-md);background:var(--orange-wash);text-align:center;margin-top:20px}
  .status .tt{font-weight:700;font-size:14px;color:var(--orange)}
  .status p{font-size:12px;color:var(--ink-3);margin:4px 0 0}
  .btn{font-family:var(--font-ui);font-size:14px;font-weight:600;padding:10px 24px;border-radius:var(--r-pill);border:0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .15s var(--ease-out);min-height:44px}
  .btn.ghost{background:var(--ground-2);color:var(--ink-2)}
  .btn.ghost:hover{background:var(--ground-hover);color:var(--ink)}
  .actions{margin-top:24px;display:flex;gap:10px;justify-content:center}
</style>
</head>
<body>

<h1 style="font-family:var(--font-cn);font-size:24px;margin-bottom:6px">牵线请求已发送</h1>
<p class="sub" style="color:var(--ink-3);font-size:14px;margin-bottom:24px">Request sent · 等待对方确认中</p>

<div class="card" id="card"></div>

<div class="status">
  <div class="tt">等待确认中 · Awaiting response</div>
  <p>对方将在 DealScout 收件箱中看到你的牵线请求和名片。接受后双方进入 workspace。</p>
</div>

<div class="actions">
  <a class="btn ghost" href="../index.html">← 回 DealScout</a>
  <a class="btn ghost" href="inbox.html">查看我的收件箱 · Inbox →</a>
</div>

<script>
var params=new URLSearchParams(location.search);
var name=params.get('name')||'金沙江创投 · GSR Ventures';
var glyph=params.get('glyph')||'金';
var color=params.get('color')||'var(--jade)';
var tags=(params.get('tags')||'FinTech,A轮,跨境').split(',');
document.getElementById('card').innerHTML='<div class="av" style="background:'+color+'">'+glyph+'</div>'
  +'<div class="name">'+name+'</div>'
  +'<div class="brief">匹配度 <b style="color:var(--jade);font-family:var(--font-mono)">'+(params.get('score')||'94')+'%</b> · 牵线请求已发送</div>'
  +'<div class="tags">'+tags.map(function(t){return'<span>'+t+'</span>';}).join('')+'</div>';
</script>
</body>
</html>
