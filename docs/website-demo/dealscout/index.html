<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投融资撮合树洞 · DealScout · Ezagent</title>
<meta name="description" content="说出你找什么——钱、项目、联合创始人。AI 循着信号把对的那一方捞到你面前。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ezagent42/design-system@main/styles.css">
<style>
  body{max-width:1060px;margin:40px auto;padding:0 24px 80px;background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-weight:450;-webkit-font-smoothing:antialiased}
  .back{display:inline-block;margin-bottom:16px;font-size:13px;color:var(--ink-3);text-decoration:none;transition:color .15s var(--ease-out)}
  .back:hover{color:var(--accent)}

  .top-nav{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .top-nav a{font-size:12px;color:var(--ink-3);text-decoration:none;padding:5px 12px;border-radius:var(--r-pill);background:var(--ground-2);transition:all .15s var(--ease-out)}
  .top-nav a:hover{background:var(--ground-hover);color:var(--ink)}

  h1{font-family:var(--font-cn);font-size:28px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--ink-3);font-size:14px;margin-bottom:24px}

  /* Two-column: left=search+results, right=detail */
  .layout{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start}
  @media(max-width:800px){.layout{grid-template-columns:1fr}}

  /* Left panel */
  .left{}
  .search-box{display:flex;gap:10px;margin-bottom:16px;align-items:flex-start}
  .search-box textarea{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-lg);font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);resize:vertical;box-sizing:border-box;min-height:88px;transition:border-color .15s var(--ease-out),box-shadow .15s var(--ease-out)}
  .search-box textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
  .search-hint{font-size:12px;color:var(--ink-4);margin-bottom:16px}

  .results-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .results-head .count{font-size:12px;color:var(--ink-4);font-family:var(--font-mono)}

  .match-card{display:flex;gap:14px;padding:14px 16px;background:var(--card);border:2px solid transparent;border-radius:var(--r-lg);margin-bottom:8px;cursor:pointer;transition:all .15s var(--ease-out);box-shadow:var(--shadow-sm)}
  .match-card:hover{border-color:var(--line);transform:translateY(-1px)}
  .match-card.sel{border-color:var(--accent);background:var(--accent-wash)}
  .match-card .av{width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff;flex-shrink:0}
  .match-card .info{flex:1;min-width:0}
  .match-card .name{font-weight:700;font-size:14px;color:var(--ink)}
  .match-card .brief{font-size:12px;color:var(--ink-3);margin:3px 0 6px;line-height:1.4}
  .match-card .tags{display:flex;gap:4px;flex-wrap:wrap}
  .match-card .tags span{font-size:10px;padding:2px 8px;border-radius:var(--r-pill);background:var(--ground-2);color:var(--ink-3)}
  .match-card .score{font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--jade);flex-shrink:0;text-align:center}
  .match-card .score .lbl{font-size:9px;color:var(--ink-4);font-weight:400}
  .none-found{padding:32px;text-align:center;color:var(--ink-4);font-size:13px}

  /* Right: detail panel */
  .detail-panel{position:sticky;top:24px}
  .detail-card{padding:28px 24px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-card)}
  .detail-card .over{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:16px}
  .detail-empty{padding:48px 28px;text-align:center;color:var(--ink-4);font-size:13px;line-height:1.6}
  .detail-card .big-av{width:56px;height:56px;border-radius:var(--r-md);display:grid;place-items:center;font-size:26px;font-weight:700;color:#fff;margin-bottom:14px}
  .detail-card .dname{font-family:var(--font-cn);font-weight:700;font-size:18px;color:var(--ink);margin-bottom:4px}
  .detail-card .dbrief{font-size:13px;color:var(--ink-3);line-height:1.6;margin-bottom:12px}
  .detail-card .dtags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
  .detail-card .dtags span{font-size:10px;padding:3px 10px;border-radius:var(--r-pill);background:var(--ground-2);color:var(--ink-3)}
  .detail-card .dscore{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--jade);margin-bottom:4px}
  .detail-card .dscore .unit{font-size:12px;color:var(--ink-4);font-weight:400}
  .detail-card .dhave,.detail-card .dneed{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .detail-card .dhave b,.detail-card .dneed b{color:var(--ink-2);font-weight:600}

  /* Buttons */
  .btn{font-family:var(--font-ui);font-size:14px;font-weight:600;padding:10px 24px;border-radius:var(--r-pill);border:0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .15s var(--ease-out);min-height:44px}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn.primary{background:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(11,92,255,.4)}
  .btn.primary:active{transform:scale(.98)}
  .btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .btn.ghost{background:var(--ground-2);color:var(--ink-2)}
  .btn.ghost:hover{background:var(--ground-hover);color:var(--ink)}
  .btn.jade{background:var(--jade);color:#fff}
  .btn.jade:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(15,160,110,.35)}
  .actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}

  .empty-hint{padding:14px 18px;border:2px dashed var(--line);border-radius:var(--r-lg);text-align:center;color:var(--ink-4);font-size:12px;margin-top:24px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<a class="back" href="../flywheel/gallery.html">← 返回 Gallery · Back</a>
<div class="top-nav">
  <a href="../achievement-center.html">我的名片 · Profile</a>
  <a href="connection/inbox.html">牵线收件箱 · Inbox <span style="font-family:var(--font-mono);color:var(--accent);font-weight:600">2</span></a>

</div>

<h1>投融资撮合树洞 · DealScout</h1>
<p class="sub">说出你找什么——AI 帮你分析意图，循着信号把对的那一方捞到你面前。</p>

<div class="layout">

<!-- ══════════════ LEFT ══════════════ -->
<div class="left">
  <div class="search-box">
    <textarea id="needDesc" placeholder="描述你正在找什么……&#10;&#10;例：我在做一个跨境支付 SaaS，天使轮刚关，需要对接 A 轮 FinTech 基金。&#10;&#10;直接写就好，不用选类型——AI 会自己判断你在找钱、找项目、还是找合伙人。"></textarea>
  </div>
  <div class="search-hint">AI 自动分析你的意图（找钱 / 找项目 / 找联合创始人 / 找退出），无需手动选择类型。</div>
  <button class="btn primary" id="matchBtn" onclick="runMatch()">开始匹配 · Start matching →</button>

  <div id="resultsArea" style="display:none;margin-top:20px">
    <div class="results-head">
      <span class="count" id="count"></span>
      <button class="btn ghost" style="font-size:12px;padding:6px 14px;min-height:auto" onclick="saveSearch()">保存搜索 · Save</button>
    </div>
    <div id="matchList"></div>
  </div>
  <div class="empty-hint">后端待建：匹配信号池 API · 撮合算法 · DealScout workspace session</div>
</div>

<!-- ══════════════ RIGHT ══════════════ -->
<div class="detail-panel">
  <div class="detail-card" id="detailCard">
    <div class="over">选中匹配详情 · Match detail</div>
    <div class="detail-empty" id="detailEmpty">← 输入需求，点击匹配，然后选中一个结果查看详情</div>
    <div id="detailContent" style="display:none"></div>
  </div>
</div>

</div>

<script>
var DEALS = [
  {name:'金沙江创投 · GSR Ventures',type:'funding',brief:'早期科技投资，偏好 FinTech / SaaS / AI。目前正在看跨境支付和合规科技方向。',tags:['FinTech','A轮','跨境','人民币+美元'],glyph:'金',color:'var(--jade)',score:94,have:'资金：双币基金，A轮为主',need:'跨境支付 SaaS 标的'},
  {name:'红杉中国 · Sequoia China',type:'funding',brief:'全阶段科技基金。消费科技和企业服务团队都在看支付基础设施项目。',tags:['企业服务','B轮+','双币','支付'],glyph:'杉',color:'var(--blueink)',score:87,have:'资金：全阶段双币基金',need:'支付基础设施 + 企业服务'},
  {name:'高瓴资本 · Hillhouse',type:'funding',brief:'长期结构性价值投资。对全球化 SaaS 有深度布局，偏好有网络效应的平台型项目。',tags:['全球化','SaaS','成长期','平台型'],glyph:'瓴',color:'var(--accent)',score:82,have:'资金：成长期 + 全球化资源',need:'平台型 SaaS'},
  {name:'分布式实验室 · D-Labs',type:'project',brief:'Web3 基础设施早期孵化器。正在找支付/身份赛道团队合作，提供技术+资金+社区。',tags:['Web3','支付','孵化','技术社区'],glyph:'分',color:'var(--orange)',score:91,have:'技术+资金+社区资源',need:'支付/身份赛道团队'},
  {name:'跨境支付合规平台 · CrossPay',type:'project',brief:'已获牌照的跨境支付中间件。找有商户资源的团队联合推向东南亚市场。',tags:['跨境','牌照','东南亚','商户端'],glyph:'跨',color:'var(--jade)',score:88,have:'牌照 + 技术中间件',need:'商户资源 + 东南亚落地团队'},
  {name:'企业级 AI 助手 · EntBot',type:'project',brief:'为企业提供可私有化部署的 AI agent 平台。找懂合规场景的合伙人做行业垂直。',tags:['AI Agent','私有部署','合规','B2B'],glyph:'智',color:'var(--blue)',score:83,have:'AI agent 平台 + 私有部署能力',need:'合规行业合伙人'},
  {name:'苏珩 · 企业法务 9 年',type:'cofounder',brief:'做过 200+ 合同审查系统，懂 NLP + 法律知识图谱。想找技术合伙人做 AI 法务 SaaS。',tags:['法务','NLP','SaaS','技术合伙人'],glyph:'法',color:'var(--blueink)',score:96,have:'NLP + 法律知识图谱 + 行业 know-how',need:'技术合伙人（全栈/后端）'},
  {name:'马屿 · SaaS 客服负责人',type:'cofounder',brief:'在头部 SaaS 带过 40 人客服团队。想做 AI 客服分流产品，找技术合伙人 + 种子轮。',tags:['客服','AI','种子轮','技术合伙人'],glyph:'客',color:'var(--orange)',score:90,have:'客服行业经验 + 团队管理',need:'技术合伙人 + 种子轮资金'},
  {name:'跨境 M&A 顾问 · BridgeCap',type:'exit',brief:'专注 500 万–5000 万美元的跨境并购。目前有 3 个买方在找亚太支付标的。',tags:['M&A','跨境','支付','买方代表'],glyph:'桥',color:'var(--jade)',score:89,have:'买方资源 + M&A 执行能力',need:'亚太支付标的（500万-5000万美元）'},
  {name:'二级市场退出通道 · SecExit',type:'exit',brief:'为成长期 SaaS 公司提供二级市场流动性方案。已服务 12 家独角兽员工股权退出。',tags:['二级市场','SaaS','ESOP','流动性'],glyph:'退',color:'var(--blue)',score:78,have:'二级市场通道 + ESOP 方案',need:'成长期 SaaS 公司'},
];

var selMatch=null;

/* ── AI intent detection ── */
function detectIntent(text){
  var t=text.toLowerCase();
  var scores={funding:0,project:0,cofounder:0,exit:0};
  // funding signals
  if(t.match(/融资|funding|找钱|基金|投资|a轮|b轮|c轮|天使|种子|vc|pe|美元|人民币/))scores.funding+=3;
  if(t.match(/估值|term.?sheet|dd|尽调/))scores.funding+=2;
  // project signals
  if(t.match(/项目|project|标|收购|deal|机会|合作|对接|推|渠道/))scores.project+=3;
  if(t.match(/牌照|商户|市场|落地|资源/))scores.project+=2;
  // cofounder signals
  if(t.match(/合伙人|co.?founder|联合创始|技术合伙|找.*人|团队|搭档/))scores.cofounder+=3;
  if(t.match(/全栈|后端|前端|c.?t.?o|技术负责人/))scores.cofounder+=2;
  // exit signals
  if(t.match(/退出|exit|卖掉|m&a|并购|二级市场|流动性|esop|套现/))scores.exit+=3;
  if(t.match(/买方|卖方|标的|收购/))scores.exit+=1;
  // default: if nothing matched strongly, weight by general keywords
  var max=0,detected='funding';
  for(var k in scores){if(scores[k]>max){max=scores[k];detected=k;}}
  return detected;
}

function runMatch(){
  var desc=(document.getElementById('needDesc').value||'').trim();
  if(!desc){alert('请输入你正在找什么');return;}
  var intent=detectIntent(desc);
  // Score all deals by intent match + text relevance
  var scored=DEALS.map(function(d){
    var s=d.score; // base score
    if(d.type===intent)s+=15; // intent boost
    var q=desc.toLowerCase();
    if(d.brief.toLowerCase().indexOf(q.split(' ')[0])>-1)s+=5;
    d.tags.forEach(function(t){if(q.indexOf(t.toLowerCase())>-1)s+=3;});
    return {d:d,s:Math.min(99,s)};
  });
  scored.sort(function(a,b){return b.s-a.s;});
  var results=scored.slice(0,5);

  document.getElementById('count').textContent='为你找到 '+results.length+' 个匹配 · AI 判断意图：'+
    ({funding:'找钱',project:'找项目',cofounder:'找联合创始人',exit:'找退出'})[intent];
  document.getElementById('matchList').innerHTML=results.map(function(r,i){
    return'<div class="match-card" data-idx="'+i+'" onclick="showDetail('+i+')">'
      +'<div class="av" style="background:'+r.d.color+'">'+r.d.glyph+'</div>'
      +'<div class="info"><div class="name">'+r.d.name+'</div><div class="brief">'+r.d.brief+'</div>'
      +'<div class="tags">'+r.d.tags.map(function(t){return'<span>'+t+'</span>';}).join('')+'</div></div>'
      +'<div class="score">'+r.s+'%<div class="lbl">匹配</div></div></div>';
  }).join('');
  window._results=results; // store for detail lookup
  document.getElementById('resultsArea').style.display='block';
  // reset detail
  selMatch=null;
  document.querySelectorAll('.match-card').forEach(function(m){m.classList.remove('sel');});
  showEmptyDetail();
}

function showDetail(idx){
  document.querySelectorAll('.match-card').forEach(function(m){m.classList.remove('sel');});
  document.querySelectorAll('.match-card')[idx].classList.add('sel');
  var r=window._results[idx];selMatch=r;
  document.getElementById('detailEmpty').style.display='none';
  var dc=document.getElementById('detailContent');dc.style.display='block';
  dc.innerHTML='<div class="big-av" style="background:'+r.d.color+'">'+r.d.glyph+'</div>'
    +'<div class="dname">'+r.d.name+'</div>'
    +'<div class="dbrief">'+r.d.brief+'</div>'
    +'<div class="dtags">'+r.d.tags.map(function(t){return'<span>'+t+'</span>';}).join('')+'</div>'
    +'<div class="dscore">'+r.s+'% <span class="unit">匹配度</span></div>'
    +'<div class="dhave"><b>我有：</b>'+r.d.have+'</div>'
    +'<div class="dneed"><b>找：</b>'+r.d.need+'</div>'
    +'<div class="actions">'
    +'<a class="btn jade" href="connection/request-sent.html?name='+encodeURIComponent(r.d.name)+'&glyph='+encodeURIComponent(r.d.glyph)+'&color='+encodeURIComponent(r.d.color)+'&score='+r.s+'&tags='+encodeURIComponent(r.d.tags.join(','))+'">牵线 · Connect →</a>'
    +'</div>';
}
function showEmptyDetail(){
  document.getElementById('detailEmpty').style.display='block';
  document.getElementById('detailContent').style.display='none';
}
function saveSearch(){
  alert('搜索已保存 · Search saved（demo）');location.href='notification/saved.html';
}
</script>
</body>
</html>
