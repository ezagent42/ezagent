<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hello · 试玩 · Ezagent</title>
<!-- hello 真实试玩页：嵌真实 hello session 的 socialware 公开视图（与 backend 同源 10042，匿名只读）。token 自 tokens.css（单一来源）。 -->
<link rel="stylesheet" href="assets/css/tokens.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&family=Space+Mono:wght@400;700&display=swap');
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);font-family:var(--font-cn-ui),var(--font-ui);padding-bottom:64px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.head{margin:38px 0 22px;text-align:center}
.head .badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.06em;padding:5px 13px;border-radius:var(--r-pill);background:var(--orange-wash);color:var(--orange)}
.head .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.head h1{font-family:var(--font-cn);font-weight:600;font-size:clamp(30px,4.6vw,46px);line-height:1.15;margin:16px 0 0}
.head p{color:var(--ink-2);line-height:1.65;font-size:16px;max-width:60ch;margin:16px auto 0}
.head .em{color:var(--ink);font-weight:600}
.stage{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden;margin-top:6px}
.stage-bar{display:flex;align-items:center;gap:9px;padding:13px 22px;font-family:var(--font-mono);font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--jade);animation:livep 1.8s ease-in-out infinite;flex:none}
@keyframes livep{0%,100%{box-shadow:0 0 0 0 rgba(15,160,110,.55)}50%{box-shadow:0 0 0 7px rgba(15,160,110,0)}}
.stage-bar .uri{color:var(--ink-3)}
.stage-bar .spacer{flex:1}
.stage-bar .tag{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line);padding:2px 9px;border-radius:var(--r-pill)}
.hello-frame{width:100%;height:660px;border:0;display:block;background:var(--ground-2)}
.note{margin-top:16px;font-family:var(--font-mono);font-size:12px;color:var(--ink-3);text-align:center;line-height:1.6}
a.back{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-family:var(--font-mono);font-size:13px;color:var(--accent);text-decoration:none}
a.back:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){.live-dot{animation:none}}
@media (max-width:560px){.hello-frame{height:560px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="badge"><span class="dot"></span>hello · 生成层 · generation · LIVE</span>
    <h1>hello 试玩 · Try hello</h1>
    <p>下面是一个<span class="em">真实运行</span>的 hello session —— 由 hello builder 当场生成的 <span class="em">@json-render</span> 页面，匿名只读、实时渲染。不是截图、不是 mock。</p>
  </div>
  <div class="stage">
    <div class="stage-bar">
      <span class="live-dot"></span>真实渲染 · live
      <span class="uri">session://system/hello/main</span>
      <span class="spacer"></span>
      <span class="tag">匿名只读 · anon</span>
    </div>
    <iframe class="hello-frame" src="/socialware/chat?session_uri=session://system/hello/main" title="hello live render" loading="lazy"></iframe>
  </div>
  <p class="note">官网与 backend 同源（同一 10042），hello 页面经 socialware 公开视图嵌入 —— 这就是「官网连通真实产品」的证明点。</p>
  <a class="back" href="mainsite.html">← 返回官网 · Back</a>
</div>
<script src="assets/js/demo-state.js"></script>
<script src="assets/js/site-nav.js"></script>
</body>
</html>
