<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carousel + Bottom Sheet · Micro-interaction</title>
<style>
:root {
  --bg:#1E1E1E;
  --window-bg:#F5F3F0;
  --card-pink:#FF5C8A;
  --dark-red:#B22234;
  --nav-gray:#3A3A3A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}

/* ═══ App Window ═══ */
.window{
  width:620px;height:500px;background:var(--window-bg);
  border-radius:14px;overflow:hidden;position:relative;
  box-shadow:0 0 0 1px rgba(255,255,255,.06),0 24px 60px rgba(0,0,0,.4);
}

/* ═══ Title bar ═══ */
.titlebar{
  height:38px;background:var(--nav-gray);
  display:flex;align-items:center;padding:0 14px;gap:12px;
  flex-shrink:0;
}
.tb-dots{display:flex;gap:6px}
.tb-dot{width:10px;height:10px;border-radius:50%}
.tb-dot.red{background:#FF5F57}.tb-dot.yellow{background:#FFBD2E}.tb-dot.green{background:#28CA41}
.tb-spacer{flex:1}
.tb-icon{width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,.15)}

/* ═══ Body ═══ */
.body{flex:1;position:relative;overflow:hidden;height:462px} /* 500 - 38 */
.body-inner{position:absolute;inset:0}

/* ═══ CAROUSEL ═══ */
.carousel-track{
  position:absolute;top:24px;left:0;display:flex;gap:24px;
  padding-left:calc((620px - 270px) / 2); /* center first card */
  transition:transform .6s ease-in-out;
}

/* ═══ CARD ═══ */
.card{
  width:270px;height:370px;border-radius:20px;background:var(--card-pink);
  flex-shrink:0;position:relative;overflow:hidden;
  cursor:pointer;
}

/* Dark-red circle avatar (top-right) */
.card-avatar{
  position:absolute;top:24px;right:24px;
  width:52px;height:52px;border-radius:50%;
  background:var(--dark-red);
}

/* Bottom page indicator */
.page-indicator{
  position:absolute;bottom:36px;left:50%;transform:translateX(-50%);
  width:40px;height:4px;border-radius:4px;
  background:rgba(255,255,255,.35);
}

/* ═══ BOTTOM SHEET ═══ */
.sheet{
  position:absolute;bottom:0;left:0;right:0;
  height:42%;
  background:#FFF;
  border-radius:20px 20px 0 0;
  transform:translateY(100%);
  transition:transform .4s cubic-bezier(.25,.8,.25,1);
  z-index:5;
  padding:28px 24px 0;
  box-shadow:0 -4px 30px rgba(0,0,0,.12);
}
.sheet.open{transform:translateY(0)}

/* Skeleton elements in sheet */
.skeleton{display:flex;align-items:center;gap:16px}
.skel-avatar{
  width:48px;height:48px;border-radius:50%;
  background:#E8E8EC;flex-shrink:0;
}
.skel-text{display:flex;flex-direction:column;gap:10px;flex:1}
.skel-title{height:16px;border-radius:6px;background:#E8E8EC;width:60%}
.skel-subtitle{height:14px;border-radius:6px;background:#F0F0F3;width:40%}

/* ═══ HEADER PILL (appears when sheet is open) ═══ */
.header-pill{
  position:absolute;top:24px;
  width:40px;height:6px;border-radius:6px;
  background:rgba(255,255,255,.7);
  opacity:0;transition:opacity .3s .1s;
  z-index:4;
}
.header-pill.visible{opacity:1}

/* ═══ CAROUSEL STATE ═══ */
/* When sheet is open, cards fade slightly */
.carousel-track.dimmed .card{opacity:.15;transition:opacity .3s}
</style>
</head>
<body>

<div class="window">
  <!-- Title bar -->
  <div class="titlebar">
    <div class="tb-dots">
      <div class="tb-dot red"></div>
      <div class="tb-dot yellow"></div>
      <div class="tb-dot green"></div>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-icon"></div>
    <div class="tb-icon"></div>
  </div>

  <!-- Body -->
  <div class="body" id="body">
    <div class="body-inner" id="bodyInner">

      <!-- Carousel -->
      <div class="carousel-track" id="carouselTrack">
        <!-- Cards generated by JS -->
      </div>

      <!-- Header pill (appears on sheet open) -->
      <div class="header-pill" id="headerPill" style="left:48px"></div>

      <!-- Bottom Sheet -->
      <div class="sheet" id="sheet">
        <div class="skeleton">
          <div class="skel-avatar"></div>
          <div class="skel-text">
            <div class="skel-title"></div>
            <div class="skel-subtitle"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
// ═══════════════ Build cards ═══════════════
const CARD_COUNT = 5;
const track = document.getElementById('carouselTrack');
for(let i = 0; i < CARD_COUNT; i++){
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card' + i;
  card.innerHTML = `
    <div class="card-avatar"></div>
    <div class="page-indicator"></div>
  `;
  track.appendChild(card);
}

// ═══════════════ Animation sequence ═══════════════
const sheet = document.getElementById('sheet');
const pill = document.getElementById('headerPill');
let currentCard = 0;

function loop(){
  // Phase 1: Carousel scroll left (0 → 0.6s)
  currentCard = (currentCard + 1) % (CARD_COUNT - 2);
  track.style.transform = `translateX(${currentCard * -(270 + 24)}px)`;
  track.classList.remove('dimmed');

  // Phase 2+3: Bottom sheet rises (at 1.3s)
  setTimeout(() => {
    sheet.classList.add('open');
    pill.classList.add('visible');
    track.classList.add('dimmed');
  }, 1300);

  // Phase 4+5: Bottom sheet dismisses (at 2.3s →)
  setTimeout(() => {
    sheet.classList.remove('open');
    pill.classList.remove('visible');
  }, 2300);

  // Phase 6: Loop (at 3.1s)
  setTimeout(() => loop(), 3100);
}

// Start after a brief delay
setTimeout(() => loop(), 300);
</script>
</body>
</html>
