prd_structure:
  source_files:
  - docs/superpowers/specs/2026-06-10-autoservice-v2-design.md
  source_type: ingested
  source_role: design-spec
  extracted_at: '2026-06-11'
  extraction:
    regex_fields:
    - modules
    - nfrs
    - constraints
    - external_deps
    llm_fields: []
  modules:
  - id: MOD-01
    name: ezagent_plugin_content
    description: soul/skill/KB CRUD (4-layer loading, {{slot}} rendering, skill index, kb.db rebuild, MCP provider) + tenant
      provision (skeleton→sandbox, kb init, first CR)
    prd_sections:
    - §2.1
    - §3.2-3.5
    - §8.2-8.4
    - §9
  - id: MOD-02
    name: ezagent_plugin_cr
    description: CR-driven full publish (one CR per tenant, no selective scope). create/cancel/publish, lint R01-R05, snapshot
      (cp sandbox→release), rollback (ln -sf _current)
    prd_sections:
    - §2.2
    - §5
  - id: MOD-03
    name: ezagent_plugin_autoservice
    description: 'Container shell: assembly coordinator, TurnAdapter (%Invocation format), operator takeover (Turn.claim→RuleStore.disable→settle→enable),
      customer session, roles (master_admin/tenant_admin/operator/customer), preview_provision/preview_teardown'
    prd_sections:
    - §2.3
    - §6.6
    - §7
    - §8
  - id: MOD-04
    name: ezagent_plugin_liveview
    description: 'Admin UI: master dashboard, tenant onboard, platform content, tenant dashboard, skill editor (4-layer),
      KB manager (URL fetch + file upload), CR dashboard, operators manager'
    prd_sections:
    - §2.4
    - §8
  - id: MOD-05
    name: ezagent_plugin_loom
    description: Customer frontend (Next.js SPA). Turn+CustoerFeed integration (Phase B uses CustomerLive first, loom deferred).
      FillerLoop (Phase D)
    prd_sections:
    - §2.5
    - §6
  nfrs:
  - id: NFR-01
    category: architecture
    requirement: Zero core/domain changes
    metric: 0 files changed in ezagent_core and ezagent_domain_*
    target: '0'
  - id: NFR-02
    category: architecture
    requirement: 'Sandbox/release isolation: production agent reads release, admin preview reads sandbox, fast agent prompt
      from release'
    metric: no sandbox leak to production
    target: 0 leaks
  - id: NFR-03
    category: architecture
    requirement: 'CustomerFeed real API: topic/1 + snapshot/2 + history/2 + {:customer_delivery}, P14 compliant (no cross-Kind
      broadcast)'
    metric: P14 CI gate pass
    target: 0 violations
  - id: NFR-04
    category: security
    requirement: 'CapBAC 4-role model: master_admin (global), tenant_admin (workspace-scoped), operator (session join+turn
      claim/settle), customer (send/receive)'
    metric: all actions gated by CapBAC check
    target: 0 unauthorized access
  - id: NFR-05
    category: performance
    requirement: Fast agent ACK <2s (deepseek-v4-flash, no thinking, max_tokens=256)
    metric: response time
    target: <2000ms
  constraints:
  - id: CON-01
    type: technology
    description: Elixir/OTP plugin architecture (use Ezagent.Lifecycle, %Invocation dispatch, CapBAC)
    rationale: ezagent ecosystem
  - id: CON-02
    type: technology
    description: slow=cc harness (Claude CLI), model configurable (Claude/DeepSeek). provider=deepseek requires ANTHROPIC_BASE_URL+ANTHROPIC_API_KEY
      env vars
    rationale: production validated
  - id: CON-03
    type: deployment
    description: Linux only deployment (no macOS Keychain)
    rationale: master manages all keys, tenants share credentials
  - id: CON-04
    type: process
    description: agents.yaml master-only at priv/skeleton/config/ (not in sandbox). Tenants edit prompts only (fast_ack_prompt.md,
      cc_preamble.md) via CR
    rationale: security boundary
  external_deps:
  - id: DEP-01
    name: socialware Turn/CustomerFeed/ConfigStore/PublisherRead/render_soul
    type: internal
    status: available
    description: Turn state machine, CustomerFeed topic+snapshot+{:customer_delivery}, ConfigStore for CR metadata, PublisherRead
      for operator, render_soul soul_md branch (#716)
  - id: DEP-02
    name: identity WorkspaceUserAdmin/Users
    type: internal
    status: available
  - id: DEP-03
    name: DeepSeek API
    type: api
    status: available
    description: Fast agent (curl agent), slow agent when provider=deepseek
  - id: DEP-04
    name: Claude Code SDK
    type: api
    status: available
    description: Slow agent via cc bridge (default provider)
  - id: DEP-05
    name: ezagent_plugin_loom
    type: internal
    status: partial
    description: On separate branch (feat/loom). Phase B uses CustomerLive as validation
