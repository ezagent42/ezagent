name: Dev Together Return Advisory

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

jobs:
  return-file-advisory:
    name: Return file advisory
    # Moved off ubuntu-latest to the self-hosted macOS runner (Actions billing
    # exhausted 2026-07-20). Uses only gh + bash, both present on the runner; the
    # advisory script always exits 0 (non-blocking by design).
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Check out scripts
        uses: actions/checkout@v4

      - name: Check dev-together return file
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Enumerate changed files via the paginated files API (no 300-file cap;
          # `gh pr diff --name-only` 406'd on PRs > 300 files — same bug as the
          # protect-dev-together-skill guard). Capture into a variable and feed
          # the script via a here-string rather than piping `--paginate` straight
          # in: the advisory script exits early (label / out-of-scope / first
          # return-file match) without draining stdin, so a direct pipe would let
          # gh hit a closed pipe mid-pagination → SIGPIPE (141) → red check under
          # Actions' default `-o pipefail`, on exactly the large PRs this fixes.
          changed="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
          bash .github/scripts/dev-together-return-advisory.sh <<< "$changed"
