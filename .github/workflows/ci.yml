name: CI

# LAYERED merge gate (design C1). Two jobs, cheap-first:
#
#   job `gate`       — ubuntu-latest, ~2-3 min. The DETERMINISTIC required
#                      gate: compile --warnings-as-errors, format, the two
#                      static invariant tasks, and the arch/invariant ExUnit
#                      subset (never-flake tests that catch real regressions
#                      fast — e.g. NoBehaviorModuleReferenceTest caught a
#                      retired-module ref that flake noise had hidden). Does
#                      NOT run the full suite, so it is fast and stable.
#
#   job `full-suite` — self-hosted macOS (the lead's dev machine), needs:
#                      [gate]. The EXACT `mix ci.local` end-to-end flow (pnpm
#                      + ecto + `precommit` full ~1856-test suite +
#                      check_invariants + socialware.check). Runs ONLY after
#                      `gate` passes, so a broken branch never burns the
#                      expensive dev-machine run. Darwin is the green-reliable
#                      OS for the concurrent suite (ubuntu is the flake-prone
#                      loaded runner — see #108).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (deterministic)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      POSTGRES_USER: ezagent_pg_compat
      POSTGRES_PASSWORD: ezagent_pg_compat
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ezagent_pg_compat
          POSTGRES_PASSWORD: ezagent_pg_compat
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ezagent_pg_compat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Cache deps + _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-

      - name: Fetch Elixir deps
        run: mix deps.get

      # No pnpm/node here on purpose: the gate never runs the web app's tests,
      # and esbuild is not a Mix compiler, so `mix compile` + the core/domain
      # arch/invariant suite need only BEAM + Postgres.
      - name: Compile (warnings-as-errors)
        run: mix compile --warnings-as-errors --force

      - name: Check formatting
        run: mix format --check-formatted

      # DB before the app-booting steps below (check_invariants /
      # socialware.check / some invariant tests boot the app).
      - name: Create + migrate test DB
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: check_invariants
        run: mix ezagent.check_invariants

      - name: socialware.check
        run: mix ezagent.socialware.check

      # Deterministic arch/invariant ExUnit subset only (NOT the full suite).
      # Path-scoped from the umbrella root: each child app runs `mix test` with
      # these paths and silently skips the dirs it does not own, so this runs
      # exactly the arch/invariant tests across all apps (locally: 439 tests,
      # 0 failures, exit 0). Includes NoBehaviorModuleReferenceTest,
      # OversizedModules, the view-authorize / predicate-A gate tests, etc.
      - name: Arch/invariant ExUnit subset
        run: >-
          mix test
          apps/ezagent_core/test/architecture
          apps/ezagent_core/test/invariants
          apps/ezagent_domain_external_mirror/test/invariants
          apps/ezagent_domain_identity/test/invariants
          apps/ezagent_domain_session/test/invariants

      # Reflow-rehearsal gate: seed definitions/recipes with SIMULATED OLD bodies
      # (what a reflow-carried DB holds), then boot the CURRENT seed paths and
      # assert zero raises + the third-state UPGRADE applied. Deterministic (no
      # docker / external services), so it belongs in the ubuntu gate. Catches the
      # #1235/#1240 third-state seed regression class the three deploys hit.
      - name: Reflow-rehearsal (third-state seed contract)
        run: >-
          mix test --include reflow_rehearsal
          apps/ezagent_domain_identity/test/ezagent/socialware/config_store_seed_upsert_test.exs
          apps/ezagent_domain_session/test/integration/reflow_rehearsal_test.exs

  full-suite:
    name: full-suite (self-hosted macOS)
    needs: [gate]
    # Same self-hosted macOS runner label as deploy.yml. Runs the full
    # concurrent suite on the green-reliable OS, gated behind `gate`.
    runs-on: [self-hosted, macOS, ARM64]
    # Hard ceiling so a hung test (e.g. an outbound network call that stalls
    # with no proxy — the BEAM's inet_gethost blocks forever) fails the job in
    # minutes instead of pinning the runner for hours. The full suite finishes
    # well under this even under load.
    timeout-minutes: 40
    env:
      MIX_ENV: test
      # Private per-run test DB (`ezagent_pg_compat_test<run_id>`) so a CI run
      # never collides with another concurrent run on this machine.
      MIX_TEST_PARTITION: ${{ github.run_id }}
      POSTGRES_USER: ezagent_pg_compat
      POSTGRES_PASSWORD: ezagent_pg_compat
      POSTGRES_HOST: 127.0.0.1
      # CI-DEDICATED port, deliberately NOT the dev/dogfood 55432. The
      # self-hosted runner IS the lead's dev machine, where a native dev
      # Postgres may be listening on 55432 — CI runs its OWN ephemeral Postgres
      # on 55440 so the two never fight over the port or share data.
      POSTGRES_PORT: "55440"
      # cc-deepseek orchestrator credential (#1324): a clearly-FAKE dummy so the
      # `Provider.ensure_api_key/1` pre-check at `instantiate/3` passes and the
      # orchestrator materializes in tests. In `:test` the real `claude`
      # subprocess is short-circuited (SpawnPlan `test_mode` — no `build_claude_cmd`,
      # no `:exec.run`), so this key NEVER reaches the network. Belt for the runner
      # env; `config/test.exs` sets the same fallback for a local `mix ci.local`.
      DEEPSEEK_API_KEY: sk-test-dummy-deepseek-not-a-real-key
    steps:
      - uses: actions/checkout@v4

      # Ephemeral native Postgres, provisioned + torn down entirely within this
      # job. No container runtime (OrbStack/Docker) dependency — `services:`
      # containers need a daemon that is not reliably up on a self-hosted mac.
      - name: Start ephemeral Postgres (native, 55440)
        run: |
          set -euo pipefail
          PG_BIN="$(brew --prefix postgresql@18)/bin"
          # Fresh per-run data dir under the job-scoped RUNNER_TEMP (GitHub wipes
          # it per job): every run initdb's a clean cluster, so NO data ever
          # carries over between runs. With the CI-dedicated port + the
          # always-run teardown below, the cluster is fully hermetic — no shared
          # or persistent state (the concern that retired the hand-kept instance).
          PGDATA_CI="$RUNNER_TEMP/ezagent-ci-pg"
          # Free the CI-dedicated port from any crashed prior run. Safe: 55440 is
          # CI-exclusive, so this never touches the dev 55432 cluster.
          lsof -ti tcp:"$POSTGRES_PORT" | xargs -r kill -9 2>/dev/null || true
          rm -rf "$PGDATA_CI"
          # Bootstrap superuser == the app role (trust auth on loopback only).
          "$PG_BIN/initdb" -D "$PGDATA_CI" -U "$POSTGRES_USER" \
            --auth-local=trust --auth-host=trust -E UTF8 >/dev/null
          "$PG_BIN/pg_ctl" -D "$PGDATA_CI" \
            -o "-p $POSTGRES_PORT -k /tmp -c listen_addresses=127.0.0.1" \
            -w -l "$PGDATA_CI/server.log" start
          "$PG_BIN/psql" -h 127.0.0.1 -p "$POSTGRES_PORT" -U "$POSTGRES_USER" \
            -d postgres -c "ALTER ROLE $POSTGRES_USER WITH PASSWORD '$POSTGRES_PASSWORD' SUPERUSER LOGIN;"

      # `mix ci.local` chains the whole gate end-to-end: deps.get, the three
      # pnpm installs (node_modules before compile so esbuild resolves
      # react/zod), ecto create/migrate, `precommit` (compile
      # --warnings-as-errors --force + deps.unlock --unused + format + full
      # test suite), ezagent.check_invariants, ezagent.socialware.check.
      - name: mix ci.local (full precommit + invariants + socialware)
        run: mix ci.local

      # Always stop + delete the cluster, even on failure/cancel, so nothing
      # lingers on the port or on disk between runs.
      - name: Stop + remove ephemeral Postgres
        if: always()
        run: |
          PG_BIN="$(brew --prefix postgresql@18)/bin"
          PGDATA_CI="$RUNNER_TEMP/ezagent-ci-pg"
          "$PG_BIN/pg_ctl" -D "$PGDATA_CI" -m immediate stop 2>/dev/null || true
          lsof -ti tcp:"$POSTGRES_PORT" | xargs -r kill -9 2>/dev/null || true
          rm -rf "$PGDATA_CI"

  # DEPLOY-FIDELITY gate. The full-suite runs `mix test` on the self-hosted dev
  # Mac, which carries ambient dev conditions the clean deploy container never has
  # (mihomo proxy, a populated ~/.claude with tengu_harbor/creds, installed
  # uv/node/claude, a dev Postgres, a full PATH). So CI can be green while the
  # container is missing a file / env / OTP dep → runtime failure only in deploy —
  # the class that caused the #1325 week-long orchestrator outage (esr-bridge
  # sidecar resolved from a build-tree path that `mix release` never packaged).
  #
  # This builds the prod OTP release EXACTLY as docker/Dockerfile.prod's builder
  # stage does (the deploy Dockerfile itself lives in the separate deploy repo per
  # #1214 — we mirror its steps, we do NOT vendor it back), then boots that real
  # artifact in a CLEAN, minimal env (env -i + a fresh blank HOME/EZAGENT_HOME) and
  # health-probes it. On ubuntu (a clean OS + the linux/debian deploy target), with
  # the ambient dev state stripped, it catches:
  #   * a runtime asset resolved from a build-tree path absent in the release
  #     (the #1325 esr-bridge sidecar packaging half — the resolution half is also
  #     caught statically by DirRelativeRuntimeAssetTest in the `gate` job),
  #   * a required runtime env var / OTP dep / native lib absent in a clean env,
  #   * a :permanent app that silently fails to start on a clean boot,
  #   * a boot/seed step that quietly depended on dev-Mac ambient state.
  # It does NOT run tests — it only builds + boots — so it stays cheap, and it is
  # gated behind `gate` so a broken branch never reaches it.
  release-boot-smoke:
    name: release-boot smoke (clean-env prod release)
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: prod
      POSTGRES_USER: ezagent_pg_compat
      POSTGRES_PASSWORD: ezagent_pg_compat
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ezagent_pg_compat
          POSTGRES_PASSWORD: ezagent_pg_compat
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ezagent_pg_compat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      # Node for the web asset build (Dockerfile.prod's builder installs node 22).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache prod deps + _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-prod-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-prod-

      # --- build the release, mirroring docker/Dockerfile.prod's builder stage ---
      - name: Fetch prod deps
        run: mix deps.get --only prod

      - name: Build web assets (setup + deploy)
        run: |
          cd apps/ezagent_web
          mix assets.setup
          mix assets.deploy

      # Match Dockerfile.prod exactly (it uses npm here, not pnpm) so the release's
      # feishu sidecar priv/ is packaged the same way deploy builds it.
      - name: Feishu WS sidecar deps
        run: cd apps/ezagent_plugin_feishu/priv/ws_sidecar && npm install --omit=dev

      - name: Compile (prod)
        run: mix compile

      - name: Assemble release
        run: mix release ezagent

      # Packaging check — the #1325 half a static gate structurally cannot see:
      # `mix release` packages only priv/, so a sidecar left in a source dir (or
      # whose app was dropped from releases/0) is simply absent from the artifact.
      # Assert the load-bearing agent sidecars actually shipped. Add a line when a
      # new sidecar the runtime shells out to is introduced.
      - name: Assert agent sidecars packaged in the release
        run: |
          set -euo pipefail
          REL=_build/prod/rel/ezagent
          missing=0
          for f in \
            "lib/ezagent_plugin_cc-*/priv/python/ezagent_mcp_bridge.py" \
            "lib/ezagent_plugin_cc-*/priv/python/ezagent_cc_sdk_worker.py" \
            "lib/ezagent_plugin_cc-*/priv/orchestrator_bridge.py" \
            "lib/ezagent_plugin_codex-*/priv/python/ezagent_codex_bridge.py" \
            "lib/ezagent_plugin_feishu-*/priv/ws_sidecar/main.js" \
            "lib/ezagent_domain_python-*/priv/python" ; do
            if compgen -G "$REL/$f" > /dev/null; then
              echo "  ok: $f"
            else
              echo "  MISSING FROM RELEASE: $f" >&2; missing=1
            fi
          done
          [ "$missing" = 0 ] || { echo "release is missing runtime sidecar assets (the #1325 class)"; exit 1; }

      # Boot the real artifact in a scrubbed, minimal env + health-probe. All the
      # clean-env logic lives in the script so it is runnable/debuggable locally.
      - name: Boot release in a clean env + health check
        run: bash .github/scripts/release-boot-smoke.sh

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      # Bare gitleaks CLI (MIT), not gitleaks-action: the action demands a paid
      # license for org repos. Working-tree scan (--no-git) by design — this
      # gate guards NEW additions; history is handled separately (rewrite +
      # rotation). Allowlist rationale lives in .gitleaks.toml.
      - name: Scan working tree for secrets
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --no-git --config /repo/.gitleaks.toml --redact

  # main-merge → nightly 自动部署(2026-07-08 plan, allenwoods)。
  # 需要 secret DEPLOY_DISPATCH_TOKEN:fine-grained PAT,Hyprial/ezagent-deploy
  # 的 contents:read + actions:write(或 classic repo scope)。secret 缺失时
  # 静默跳过(dispatch job 是 best-effort,不 gate 任何合并)。
  # 部署仓库侧只进 nightly;beta/stable 仍人工晋级。
  dispatch-nightly:
    name: dispatch nightly deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - name: Fire repository_dispatch (main-merged)
        env:
          TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DEPLOY_DISPATCH_TOKEN not set — skipping auto-deploy dispatch."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Hyprial/ezagent-deploy/dispatches \
            -d "{\"event_type\":\"main-merged\",\"client_payload\":{\"sha\":\"${{ github.sha }}\"}}" \
            && echo "dispatched main-merged sha=${{ github.sha }}"
