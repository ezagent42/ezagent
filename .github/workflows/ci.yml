name: CI

# LAYERED merge gate (design C1). ALL jobs run on the self-hosted macOS runner —
# ZERO GitHub-hosted (ubuntu) dependency (billing exhausted 2026-07-20). The
# backend jobs (`gate`, `gitleaks`) run DOCKERIZED via OrbStack; `full-suite`
# stays native mix (see its own note); `frontend` stays native (setup-node — it
# needs a different Node/pnpm/Playwright pin than the backend image). Cheap-first:
#
#   job `frontend`   runs lint, TypeScript, unit tests and Tier-1 Chromium via
#                    the reusable frontend workflow (native setup-node on the mac).
#
#   job `gate`       — DOCKERIZED on the self-hosted mac, ~3-5 min. The
#                      DETERMINISTIC required backend gate: generated-fixture
#                      drift, compile --warnings-as-errors, format, the two static
#                      invariant tasks, and the arch/invariant ExUnit subset
#                      (never-flake tests that catch real regressions fast — e.g.
#                      NoBehaviorModuleReferenceTest caught a retired-module ref
#                      that flake noise had hidden). Runs the SAME chain as before,
#                      now inside a pinned linux container (docker/Dockerfile.ci)
#                      against a postgres:16 service on a per-run compose network.
#                      Does NOT run the full suite, so it is fast and stable.
#
#   job `full-suite` — self-hosted macOS (the lead's dev machine), NATIVE mix,
#                      needs: [gate]. SHARDED (ci-shard-full-suite): the EXACT
#                      `mix ci.local` end-to-end flow (pnpm + ecto + `precommit`
#                      full suite + check_invariants + socialware.check) is SPLIT
#                      into a `max-parallel: 1` matrix — a deterministic `static`
#                      gate leg + per-app-group test legs (e2e/core/session/web/
#                      plugin/domain), each `mix ci.shard.<shard>`. The union of
#                      legs reproduces `mix ci.local` EXACTLY (proven by the
#                      `static` leg's `mix ci.shard.verify` + the `ci_shard_parity`
#                      arch gate — no test ever silently dropped). WHY: a red now
#                      isolates to ONE leg, re-runnable ALONE, instead of re-running
#                      the whole ~500-580s suite to chase one failure/flake. PHASE 1
#                      is SEQUENTIAL (same wall-clock, just isolated + re-runnable);
#                      PHASE 2 (parallel) is left OFF — see the job's `strategy`
#                      + env notes for the one-line flip + its per-shard partition/
#                      port prerequisites. Runs ONLY after `gate` passes; NOT on
#                      pull_request (job-level `if`) — push-to-main (pre-deploy,
#                      BLOCKING via dispatch-canary) + the nightly `schedule` cron;
#                      every PR still gets the cheap `gate` (a 100% subset). Kept
#                      NATIVE deliberately (see #108 for why darwin is the green-
#                      reliable OS for the concurrent suite).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly full-suite run (08:00 UTC ≈ 17:00 GMT+9). full-suite is gated off
    # pull_request (see its job-level `if`), so this cron is the only path that
    # keeps the expensive self-hosted macOS suite exercised on green days when
    # nothing merges to main.
    - cron: "0 8 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend regression gate
    uses: ./.github/workflows/frontend-ci.yml

  gate:
    name: gate (deterministic)
    needs: [frontend]
    # DOCKERIZED on the self-hosted macOS runner (OrbStack). GitHub-hosted ubuntu
    # billing is exhausted (2026-07-20), so no GitHub-hosted runner is available.
    # NOTE on mechanism: GitHub Actions job-level `container:` / `services:` YAML is
    # LINUX-runner ONLY — it is NOT honored on a macOS runner even with Docker
    # present. So this job dockerizes by having its `run:` steps shell out to
    # `docker compose` explicitly: a pinned linux image (Elixir 1.19.5 / OTP
    # 28.4.2 / Node 25 / pnpm 10.33.0 — docker/Dockerfile.ci{,-base}) runs the
    # exact gate chain against a `postgres:16` service on an isolated per-run
    # compose network. The expensive `ezagent-ci-base` (deps + node_modules, keyed
    # on lockfiles) is rebuilt ONLY when a lockfile changes, so per-PR builds are a
    # fast COPY-only source layer. Each run uses a UNIQUE `-p ci-gate-<run_id>`
    # compose project (own postgres + own thin image) → a 2nd/3rd self-hosted
    # runner is safe to add (no shared-port / shared-DB contention). The step chain
    # is byte-identical to the previous native gate (docker/ci-runner.sh `gate`).
    # Rollback: revert this commit → the native-mix gate in git history is restored.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      # Fail fast with a clear message if OrbStack/Docker is down (the native-mix
      # gate remains the documented fallback — revert this commit).
      - name: Preflight — Docker/OrbStack up
        run: docker version >/dev/null || { echo "::error::OrbStack/Docker is not running on the self-hosted runner"; exit 1; }

      # Builds ezagent-ci-base:latest ONLY when mix.lock / an asset pnpm-lock.yaml
      # changed (lock-hash tag); otherwise a no-op. The thin per-PR source image is
      # built by the `run --build` below (COPY-only on the cached base → seconds).
      - name: Build CI base image (cached on lock change)
        run: docker/build-ci-image.sh

      # Run the deterministic gate INSIDE the linux container against a postgres:16
      # service, in a per-run compose project so concurrent runs never collide. The
      # `trap … EXIT` tears the project down (containers, network, tmpfs volumes)
      # even on cancel/failure. `run --build` builds this run's thin source image;
      # `--rm` removes the one-shot container; the container exit code propagates,
      # so a red gate step fails the job. NO cpuset pin: the deterministic gate needs no
      # core affinity (that is only the `repro` flake-hunt's race engine), and pinning is
      # actively harmful under concurrency — every self-hosted runner receives the SAME
      # CPUSET, so 2-3 concurrent gates would stack their BEAM + `mix compile --force` onto
      # the identical fixed cores (e.g. 0-9) while the other 18 of the 28 sit idle → CPU
      # starvation → slow/flaky DB-invariant suites. Unpinned, the host scheduler spreads
      # each gate across all cores, so concurrent runners coexist. SCHEDULERS=8 still bounds
      # each gate's scheduler count (+ its max_cases = 2×8) so 3-5 concurrent gates fit the
      # 28-core box with headroom. (Root cause was scheduling contention, NOT postgres
      # max_connections — per-run pool is 40 « the 100 default — nor VM memory.)
      - name: Gate (dockerized — mix chain + postgres:16)
        env:
          SCHEDULERS: "8"
        run: |
          set -euo pipefail
          P="ci-gate-${{ github.run_id }}-${{ github.run_attempt }}"
          trap 'docker compose -p "$P" -f docker/docker-compose.ci.yml down -v --remove-orphans || true' EXIT
          docker compose -p "$P" -f docker/docker-compose.ci.yml run --build --rm ci gate

  # full-suite is SHARDED (ci-shard-full-suite). Instead of ONE ~500-580s
  # monolith `mix ci.local`, its work is split into named shards — a deterministic
  # `static` gate shard + per-app-group test shards (e2e / core / session / web /
  # plugin / domain) — each a separate matrix leg running `mix ci.shard.<shard>`.
  # WHY: when the suite is red, the failure isolates to ONE shard and GitHub's
  # "re-run failed jobs" re-runs ONLY that leg — no more re-running the whole
  # suite to chase one flake/failure (e.g. the known EzagentPluginKb.E2E red
  # lands in `e2e` alone). The union of shards reproduces `mix ci.local` EXACTLY;
  # `mix ci.shard.verify` (a `static`-shard step) + the `ci_shard_parity_test`
  # arch gate PROVE parity (every test file assigned to exactly one shard; the
  # shard step-set == ci.local's) so no test is ever silently dropped.
  #
  # PHASE 1 (this change) is SEQUENTIAL: `max-parallel: 1`, so the legs run one
  # after another on the single self-hosted mac — same total wall-clock as the
  # monolith, but with per-shard failure isolation + re-run. PHASE 2 (parallel)
  # is DELIBERATELY LEFT OFF; to enable it, flip `max-parallel` up AND give each
  # leg its OWN DB partition + Postgres port (see the phase-2 note on the env
  # block below) — otherwise concurrent legs corrupt the shared 55440 Postgres.
  full-suite:
    name: full-suite (${{ matrix.shard }})
    needs: [gate]
    # NOT on pull_request: the full suite is 500-580s on the lead's own dev
    # machine (self-hosted macOS) and `gate` is already a 100% subset of it —
    # so every PR gets the cheap ubuntu `gate` while the expensive run happens
    # only on push-to-main (pre-deploy, BLOCKING via dispatch-canary's needs)
    # and on the nightly `schedule` cron. This keeps the dev machine free while
    # codex pushes many PRs, without ever deploying an untested main.
    if: github.event_name != 'pull_request'
    strategy:
      # Run EVERY shard even when one is red, so a single failure never masks the
      # rest and each leg is independently re-runnable ("re-run failed jobs").
      fail-fast: false
      # PHASE 1 — SEQUENTIAL on the single self-hosted mac. The legs QUEUE onto
      # the one runner regardless; pinning to 1 makes that explicit and keeps the
      # shared ephemeral Postgres (port 55440, DB partition = run_id) collision-
      # free. PHASE 2: raise this ONLY together with per-shard partition+port
      # (see env note) and enough runners, or concurrent legs corrupt the DB.
      max-parallel: 1
      matrix:
        # Keep in sync with the shard names in `ci_shards.exs` + the `static`
        # gate shard; `mix ci.shard.verify` fails if the aliases and manifest
        # drift, and each name here maps 1:1 to a `mix ci.shard.<name>` alias.
        shard: [static, e2e, actor, core, session, web, plugin_world, plugin, domain_provider_connection_lifecycle, domain_git_lifecycle, domain_workspace_lifecycle, domain]
    # Same self-hosted macOS runner label as deploy.yml. Runs the full
    # concurrent suite on the green-reliable OS, gated behind `gate`.
    runs-on: [self-hosted, macOS, ARM64]
    # Hard ceiling so a hung test (e.g. an outbound network call that stalls
    # with no proxy — the BEAM's inet_gethost blocks forever) fails the leg in
    # minutes instead of pinning the runner for hours. Per-shard the run is well
    # under this; the ceiling is per-leg.
    timeout-minutes: 40
    env:
      MIX_ENV: test
      # Private per-run test DB (`ezagent_pg_compat_test<run_id>`) so a CI run
      # never collides with another concurrent run on this machine. SAFE across
      # the shard legs because they are SEQUENTIAL (max-parallel: 1) and each leg
      # boots its OWN fresh ephemeral Postgres — so the shared partition never
      # sees two live writers.
      # PHASE-2 (parallel) PREREQUISITE: make this per-shard, e.g.
      #   MIX_TEST_PARTITION: ${{ github.run_id }}-${{ matrix.shard }}
      # AND give each leg its own POSTGRES_PORT (or its own cluster), or
      # concurrent legs corrupt the shared 55440 Postgres + the ci-local sentinel.
      MIX_TEST_PARTITION: ${{ github.run_id }}
      POSTGRES_USER: ezagent_pg_compat
      POSTGRES_PASSWORD: ezagent_pg_compat
      POSTGRES_HOST: 127.0.0.1
      # CI-DEDICATED port, deliberately NOT the dev/dogfood 55432. The
      # self-hosted runner IS the lead's dev machine, where a native dev
      # Postgres may be listening on 55432 — CI runs its OWN ephemeral Postgres
      # on 55440 so the two never fight over the port or share data.
      POSTGRES_PORT: "55440"
      # cc-custom orchestrator credential (#1324; cc-custom-backends PR-5): a
      # clearly-FAKE dummy so the `Provider.ensure_api_key/2` pre-check at
      # `instantiate/3` passes and the orchestrator materializes in tests. In
      # `:test` the real `claude` subprocess is short-circuited (SpawnPlan
      # `test_mode` — no `build_claude_cmd`, no `:exec.run`), so this key NEVER
      # reaches the network. Belt for the runner env; `config/test.exs` sets
      # the same fallbacks for a local `mix ci.local`. MOONSHOT_API_KEY is the
      # catalog's "kimi" profile twin.
      DEEPSEEK_API_KEY: sk-test-dummy-deepseek-not-a-real-key
      MOONSHOT_API_KEY: sk-test-dummy-moonshot-not-a-real-key
    steps:
      - uses: actions/checkout@v4

      # Ephemeral native Postgres, provisioned + torn down entirely within this
      # job. No container runtime (OrbStack/Docker) dependency — `services:`
      # containers need a daemon that is not reliably up on a self-hosted mac.
      - name: Start ephemeral Postgres (native, 55440)
        run: |
          set -euo pipefail
          PG_BIN="$(brew --prefix postgresql@18)/bin"
          # Fresh per-run data dir under the job-scoped RUNNER_TEMP (GitHub wipes
          # it per job): every run initdb's a clean cluster, so NO data ever
          # carries over between runs. With the CI-dedicated port + the
          # always-run teardown below, the cluster is fully hermetic — no shared
          # or persistent state (the concern that retired the hand-kept instance).
          PGDATA_CI="$RUNNER_TEMP/ezagent-ci-pg"
          # Free the CI-dedicated port from any crashed prior run. Safe: 55440 is
          # CI-exclusive, so this never touches the dev 55432 cluster.
          lsof -ti tcp:"$POSTGRES_PORT" | xargs -r kill -9 2>/dev/null || true
          rm -rf "$PGDATA_CI"
          # Bootstrap superuser == the app role (trust auth on loopback only).
          "$PG_BIN/initdb" -D "$PGDATA_CI" -U "$POSTGRES_USER" \
            --auth-local=trust --auth-host=trust -E UTF8 >/dev/null
          "$PG_BIN/pg_ctl" -D "$PGDATA_CI" \
            -o "-p $POSTGRES_PORT -k /tmp -c listen_addresses=127.0.0.1" \
            -w -l "$PGDATA_CI/server.log" start
          "$PG_BIN/psql" -h 127.0.0.1 -p "$POSTGRES_PORT" -U "$POSTGRES_USER" \
            -d postgres -c "ALTER ROLE $POSTGRES_USER WITH PASSWORD '$POSTGRES_PASSWORD' SUPERUSER LOGIN;"

      # This leg's shard. `mix ci.shard.<shard>` reuses the EXACT ci.local chain
      # (deps.get + pnpm + ecto + the honest arm/finalize exit) but scoped:
      #   * `static`                — every ci.local step that is NOT `mix test`
      #                               (compile --warnings-as-errors --force, the
      #                               ci.shard.verify parity gate, deps.unlock,
      #                               format, check_invariants, uri_query.scan,
      #                               world.e2e.fixtures, cc-sdk python, socialware)
      #                               run ONCE here.
      #   * e2e/core/session/web/…  — ONLY that shard's assigned test files
      #                               (first-match manifest in ci_shards.exs).
      # Union of the 7 legs == the old monolith `mix ci.local`, EXACTLY (proven by
      # the `static` leg's `mix ci.shard.verify` step + the ci_shard_parity arch
      # gate). A red leg fails only itself; `dispatch-canary` needs ALL legs green.
      - name: mix ci.shard.${{ matrix.shard }}
        run: mix ci.shard.${{ matrix.shard }}

      # Always stop + delete the cluster, even on failure/cancel, so nothing
      # lingers on the port or on disk between runs.
      - name: Stop + remove ephemeral Postgres
        if: always()
        run: |
          PG_BIN="$(brew --prefix postgresql@18)/bin"
          PGDATA_CI="$RUNNER_TEMP/ezagent-ci-pg"
          "$PG_BIN/pg_ctl" -D "$PGDATA_CI" -m immediate stop 2>/dev/null || true
          lsof -ti tcp:"$POSTGRES_PORT" | xargs -r kill -9 2>/dev/null || true
          rm -rf "$PGDATA_CI"

  gitleaks:
    name: gitleaks secret scan
    # DOCKERIZED on the self-hosted macOS runner (OrbStack) — no GitHub-hosted
    # runner (ubuntu billing exhausted 2026-07-20). The gitleaks binary runs from
    # the official ghcr.io/gitleaks/gitleaks image with the working tree bind-
    # mounted read-only-in-effect at /repo, keeping ZERO host toolchain
    # dependency (no `brew install`). Semantics are IDENTICAL to the native
    # `gitleaks dir . --config .gitleaks.toml --redact --no-banner`.
    runs-on: [self-hosted, macOS, ARM64]
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Preflight — Docker/OrbStack up
        run: docker version >/dev/null || { echo "::error::OrbStack/Docker is not running on the self-hosted runner"; exit 1; }
      # Bare gitleaks CLI (MIT), not gitleaks-action: the action demands a paid
      # license for org repos. Directory (no-git) scan by design — this gate
      # guards NEW additions; history is handled separately (rewrite + rotation).
      # Allowlist rationale lives in .gitleaks.toml. `gitleaks dir` exits non-zero
      # when a leak is found, failing the gate.
      - name: Scan working tree for secrets (dockerized gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner

  # main-merge → nightly 自动部署(2026-07-08 plan, allenwoods)。
  # 需要 secret DEPLOY_DISPATCH_TOKEN:fine-grained PAT,Hyprial/ezagent-deploy
  # 的 contents:read + actions:write(或 classic repo scope)。secret 缺失时
  # 静默跳过(dispatch job 是 best-effort,不 gate 任何合并)。
  # 部署仓库侧只进 nightly;beta/stable 仍人工晋级。
  dispatch-canary:
    name: dispatch canary deploy
    # BLOCKING on full-suite: only fire the deploy dispatch after the full
    # suite passes on main (previously this job had no `needs:` and fired on
    # any push-to-main regardless of test outcome — a real gap).
    needs: [full-suite]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Moved off ubuntu-latest to the self-hosted macOS runner (Actions billing
    # exhausted 2026-07-20). Pure curl/jq dispatch — no platform-specific tools.
    runs-on: [self-hosted, macOS, ARM64]
    permissions: { contents: read }
    steps:
      - name: Fire repository_dispatch (main-merged)
        env:
          TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DEPLOY_DISPATCH_TOKEN not set — skipping auto-deploy dispatch."
            exit 0
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Hyprial/ezagent-deploy/dispatches \
            -d "{\"event_type\":\"main-merged\",\"client_payload\":{\"sha\":\"${{ github.sha }}\"}}" \
            && echo "dispatched main-merged sha=${{ github.sha }}"
