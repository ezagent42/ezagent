name: Protect dev-together skill

# Only authorized skill owners may modify the shared dev-together workflow
# skill (.claude/skills/dev-together/**). It is team-wide glue: an unreviewed
# edit by any member changes how everyone ships. This check fails when a PR (or
# a direct push to main) touches that path and the author is not in OWNERS
# (space-separated allowlist; 2026-07-10 jjkysy added as skill co-owner per
# dev-together method-writeback role — the daily plan's "skill 单一写者" seat).
#
# NOTE: CI runs AFTER a push, so for *direct pushes* this only surfaces a red
# check — it cannot block the push itself. Real enforcement needs branch
# protection on `main` (require this check + disallow direct pushes / require PR
# review). See the PR/commit that introduced this file for the rationale.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  owner-only:
    name: Only repo owner may edit dev-together skill
    # Moved off ubuntu-latest to the self-hosted macOS runner (Actions billing
    # exhausted 2026-07-20). Uses only gh + git + POSIX grep/tr/sed, all present
    # on the runner (BSD grep supports -qE and the {40} interval used above).
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard .claude/skills/dev-together
        env:
          GH_TOKEN: ${{ github.token }}
          OWNERS: allenwoods jjkysy
          GUARDED_PATH: .claude/skills/dev-together/
          EVENT_NAME: ${{ github.event_name }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PUSH_ACTOR: ${{ github.actor }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Enumerate changed files via the paginated "list pull request files"
            # API. The previous `gh pr diff --name-only` fetched the raw unified
            # diff (Accept: application/vnd.github.v3.diff), which GitHub caps at
            # 300 files and answers with HTTP 406 for larger PRs — falsely failing
            # this REQUIRED check on any PR > 300 files (e.g. #1445, 419 files)
            # even when it does not touch the guarded path. The files API has no
            # such cap. We enumerate both the new path and the rename-source
            # (previous_filename) so a guarded file *renamed out* of the dir is
            # still caught. Fail closed: any enumeration error fails the check
            # (never silently pass), independent of the shell's set -e nuances.
            changed="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --paginate --jq '.[] | .filename, (.previous_filename // empty)')" \
              || { echo "::error::Could not enumerate changed files for PR #${PR_NUMBER} — failing closed."; exit 1; }
            actor="$PR_AUTHOR"
          else
            if printf '%s' "$BEFORE_SHA" | grep -qE '^0{40}$'; then
              # New branch / no parent recorded — inspect the pushed commit alone.
              changed="$(git show --name-only --pretty=format: "$AFTER_SHA")"
            else
              changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
            fi
            actor="$PUSH_ACTOR"
          fi

          if ! printf '%s\n' "$changed" | grep -q "^$GUARDED_PATH"; then
            echo "No changes under $GUARDED_PATH — nothing to guard."
            exit 0
          fi

          actor_lc="$(printf '%s' "$actor" | tr '[:upper:]' '[:lower:]')"
          echo "Detected changes under $GUARDED_PATH by '$actor' (event: $EVENT_NAME)."
          printf '%s\n' "$changed" | grep "^$GUARDED_PATH" | sed 's/^/  • /'

          authorized=0
          for owner in $OWNERS; do
            owner_lc="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
            if [ "$actor_lc" = "$owner_lc" ]; then
              authorized=1
              break
            fi
          done

          if [ "$authorized" != "1" ]; then
            echo "::error::Only one of [$OWNERS] may modify $GUARDED_PATH — author '$actor' is not authorized. Revert these files, or have a skill owner make the change."
            exit 1
          fi
          echo "✓ Authorized: '$actor' is a dev-together skill owner."
