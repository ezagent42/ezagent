name: Frontend CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend (lint, types, unit, Tier-1 E2E)
    # Moved off ubuntu-latest to the self-hosted macOS runner (GitHub Actions
    # billing exhausted 2026-07-20). Unlike the backend gate, this job KEEPS
    # `actions/setup-node` + `corepack`: they pin the exact Node 22 / pnpm
    # 10.23.0 the frontend + Playwright 1.55 were validated on (the runner's
    # native Node is 26 — newer than Playwright 1.55's tested range — and
    # Homebrew Node ships no corepack). setup-node is reliable cross-platform and
    # Node 22 bundles corepack, so the toolchain is unchanged from the ubuntu
    # run; only the OS changes.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Frontend lint, typecheck and unit tests
        run: |
          for assets_dir in \
            apps/ezagent_web/assets \
            apps/ezagent_plugin_world/assets \
            apps/ezagent_plugin_hello/assets
          do
            pnpm --dir "$assets_dir" install --frozen-lockfile
            pnpm --dir "$assets_dir" lint
            pnpm --dir "$assets_dir" typecheck
            pnpm --dir "$assets_dir" test
          done

      # `--with-deps` is Linux/apt-only (it shells out to apt-get to install OS
      # libraries); on macOS the browser's system deps ship with the OS, so the
      # flag is dropped. Plain `playwright install chromium` is cross-platform.
      - name: Install Tier-1 Chromium
        run: pnpm --dir apps/ezagent_plugin_world/assets exec playwright install chromium

      # Frontend-only harness: built main.js + generated backend-contract
      # projection + mocked pushEvent/onServerEvent. No Phoenix or DB.
      - name: Frontend Tier-1 Playwright
        run: pnpm --dir apps/ezagent_plugin_world/assets test:e2e
