<body>
  <main id="app" class="app-shell">
    <header class="topbar paper"><div class="brand"><b>🦄 MFU · 首个猎人教学订单</b><small>面对一个任务，编排你和 AI，完成真实交付</small></div><span class="act-label" id="actLabel">教学关卡 · 不限时</span><div class="spacer"></div><button class="btn small" type="button" onclick="resetDemo()">↺ 重新开始</button></header>

  </main>

    const cards={player:{id:"player",kind:"本人",emoji:"🏹",skills:"客户理解 · 最终判断"},agent:{id:"agent",name:"小角",kind:"Agent",emoji:"🤖",skills:"快速制作 · 版本整理"}};
    const meta={welcome:["🦄","欢迎来到 MFU","先告诉我们怎样称呼你。","开始"],briefing:["📜","第一关：旧书店的开学难题","先看懂完整订单，以及你负责的那一步。","关卡背景"],build:["🃏","为自己的步骤组成小阵列","把本人和 Agent 放到合适的任务位置。","编排"],firstRun:["⚙️","小角正在执行","Agent 会根据现有信息制作第一版成果。","首次执行"],inspect:["🔎","检查 Agent 的成果","真实交付中，问题通常是在看到成果后才暴露。","检查成果"],tune:["🛠️","调教 Agent","花现金安装工具，花本人时间写下工作守则。","调教"],clarify:["📋","小角调用了 Form","新工具和守则正在真实工作。","确认信息"],secondRun:["⚙️","小角重新执行","这一次，小角已经获得了必要信息。","重新执行"],stepDelivered:["📦","你的成果已交付","你的步骤已经完成，但完整订单仍在进行。","步骤完成"],settlement:["🎉","完整订单已完成","现在查看你的成果怎样进入最终交付。","订单结算"]};

    function configurePrimary(){const b=document.querySelector("#primary-action"),row=document.querySelector("#primaryRow"),hint=document.querySelector("#primaryHint");row.classList.toggle("centered",state.scene==="briefing");const config={briefing:["准备好了，开始闯关",()=>setScene("build"),false,""],build:["确认编排，让小角开始执行",startFirstRun,Object.keys(state.assignments).length<3,"填满三个位置后即可开始。"],stepDelivered:["查看完整订单结果",completeWholeOrder,false,"完整订单的其他步骤将完成并进入统一结算。"],settlement:["领取第一份自由订单",()=>alert("下一阶段：第一份自由订单"),false,"教学完成。你也可以点击右上角重新体验。"]}[state.scene];if(!config){row.style.display="none";return}row.style.display="flex";b.textContent=config[0];b.onclick=config[1];b.disabled=config[2];hint.textContent=config[3]}
    function render(){clearTimeout(timer);const m=meta[state.scene];document.querySelector("#sceneIcon").textContent=m[0];document.querySelector("#scene-title").textContent=m[1];document.querySelector("#sceneSubtitle").textContent=m[2];document.querySelector("#sceneCount").textContent=m[3];const views={welcome:renderWelcome,briefing:renderBriefing,build:boardMarkup,firstRun:()=>renderRun(false),inspect:renderInspect,tune:renderTune,clarify:renderClarify,secondRun:()=>renderRun(true),stepDelivered:renderStepDelivered,settlement:renderSettlement};document.querySelector("#scene-content").innerHTML=views[state.scene]();renderProgress();configurePrimary();if(state.scene==="build")bindBoard()}
    restoreState();render();
  </script>
