    function normalizeState(raw){
      const next=structuredClone(raw);
      next.ledger ||= [];
      next.orderFilter ||= "unassigned";
      next.activeMainTab ||= "workspace";
      next.marketOrders ||= structuredClone(initial.marketOrders);
      next.worldFeed ||= structuredClone(initial.worldFeed);
      if(next.resourceTab==="other")next.resourceTab="compute";
      next.tasks=(next.tasks||[]).map(order=>({
        status:"unassigned",
        orgId:null,
        quotedAmount:Number(String(order.reward||"0").replace(/[^\d]/g,"")),
        invoiceStatus:"not_issued",
        paymentStatus:"not_due",
        cost:0,
        income:0,
        ...order
      }));
      for(const resource of [...(next.people||[]),...(next.agents||[]),...(next.assets||[])]){
        const namedOrg=(next.orgs||[]).find(org=>org.name===resource.status);
        resource.assignedOrgId ??= namedOrg?.id||null;
        resource.acquisition ??="自有";
        resource.cost ??=0;
        resource.expiresAt ??=null;
        resource.busyOrderId ??=namedOrg&&["working","review","settlement","risk"].includes(namedOrg.status)?`current-${namedOrg.id}`:null;
        if(namedOrg)resource.status=["working","review","settlement","risk"].includes(namedOrg.status)?"忙碌":"空闲";
      }
      for(const org of next.orgs||[])org.resourceIds ||= [...(next.people||[]),...(next.agents||[]),...(next.assets||[])].filter(resource=>resource.assignedOrgId===org.id).map(resource=>resource.id);
      return next
    }
    let state=normalizeState(initial);
    function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

    function restore(){try{const value=JSON.parse(localStorage.getItem(STORAGE_ID)||"null");if(value&&value.orgs)state=normalizeState(value)}catch{}}
    function resetGame(){localStorage.removeItem(STORAGE_ID);state=normalizeState(initial);closeOverlay();render()}

    function normalizeNodeStates(org){if(org.nodeStates?.length===org.steps.length)return org.nodeStates;const activeIndex=org.status==="idle"?-1:Math.min(org.steps.length-1,Math.floor(org.progress/Math.max(1,100/org.steps.length)));org.nodeStates=org.steps.map((label,index)=>({id:`${org.id}-node-${index}`,label,resource:org.gems[index],status:index<activeIndex?"completed":index===activeIndex?"running":"pending",externalOrderId:null,result:index<activeIndex?"阶段成果已保存":null}));return org.nodeStates}

    function assignTask(orgId,taskId){const org=state.orgs.find(o=>o.id===orgId),task=state.tasks.find(t=>t.id===taskId);org.status="working";org.task=task.name;org.progress=12;org.eta="预计 4 天";task.status="running";task.orgId=orgId;task.cost=800;assignResourcesToOrg(orgId,org.resourceIds||[]);state.selectedTask=null;state.orderFilter="running";state.compute-=8;state.logs.unshift(`W${state.day} · ${org.name} 接下《${task.name}》`);save();closeOverlay();render();toast(`${org.name} 已开始执行《${task.name}》`)}
    function advanceWork(){state.day++;completeExternalNodeOrders();const reviews=[];state.orgs=state.orgs.map(org=>{if(org.status!=="working")return org;if(normalizeNodeStates(org).some(node=>node.status==="outsourced"))return {...org,eta:"等待外部协作者"};const progress=Math.min(100,org.progress+35),next={...org,progress,eta:progress>70?"预计 1 天":"预计 2 天"};if(progress===100){reviews.push({id:`review-${org.id}-${state.day}`,type:"review",orgId:org.id,title:`${org.name} 完成交付`,detail:`《${org.task}》等待你的验收。`});state.logs.unshift(`W${state.day} · ${org.name} 完成《${org.task}》，等待验收`);next.status="review";next.eta="等待验收"}syncNodeProgress(next);return next});state.actions.push(...reviews);save();render();toast(reviews.length?`${reviews.length} 个组织完成工作，等待验收。`:"组织们继续运行了一天。")}
    function openAction(id){const action=state.actions.find(a=>a.id===id),org=state.orgs.find(o=>o.id===action.orgId);if(action.type==="review"){document.querySelector("#overlay-root").innerHTML=`<div class="overlay"><section class="modal"><h2>✅ 验收组织交付</h2><p>查看客户可用的成果，再决定通过或打回重做。</p><div class="modal-box"><h3>${org.name}</h3><p>${esc(org.task)}<br>完成度 100% · 预估质量 A<br>成果：一份可直接交给客户使用的方案与素材包。</p></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">稍后处理</button><button class="btn" onclick="rejectDelivery('${action.id}')">打回重做</button><button id="accept-delivery" class="btn green" onclick="acceptDelivery('${action.id}')">验收通过</button></div></section></div>`}else if(action.type==="risk"){document.querySelector("#overlay-root").innerHTML=`<div class="overlay"><section class="modal"><h2>⚠️ 运行风险</h2><p>${esc(action.detail)}</p><div class="modal-box"><h3>运营 Agent 建议</h3><p>追加 12 点算力完成数据清洗，可以解除当前阻塞。</p></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">稍后处理</button><button class="btn primary" onclick="resolveRisk('${action.id}')">投入算力并继续</button></div></section></div>`}else if(action.type==="receivable"){const order=state.tasks.find(item=>item.id===action.orderId);document.querySelector("#overlay-root").innerHTML=`<div class="overlay"><section class="modal"><h2>💰 确认订单收款</h2><p>${esc(action.detail)}</p><div class="modal-box"><h3>《${esc(order?.name||"订单")}》</h3><p>应收金额：¥${(order?.quotedAmount||0).toLocaleString()}<br>确认到账后，订单完成并生成组织成长记录。</p></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">稍后处理</button><button id="action-receive-payment" class="btn green" onclick="resolvePendingAction('${action.id}','received')">确认已收款</button></div></section></div>`}else document.querySelector("#overlay-root").innerHTML=`<div class="overlay"><section class="modal"><h2>🌟 组织可以升级</h2><p>${esc(action.detail)}</p><div class="modal-box"><h3>获得 1 个组织优化点</h3><p>具体成长树仍待决策。本 Demo 先记录优化点，不自动选择升级方向。</p></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">保留优化点</button><button class="btn primary" onclick="closeOverlay();openOrganization('${org.id}')">查看组织</button></div></section></div>`}
    function rejectDelivery(actionId){const action=state.actions.find(a=>a.id===actionId),org=state.orgs.find(o=>o.id===action.orgId);org.status="working";org.progress=78;org.eta="返工 1 天";state.actions=state.actions.filter(a=>a.id!==actionId);state.actions.push({id:`replay-${org.id}-${state.day}`,type:"upgrade",orgId:org.id,title:`${org.name} 获得复盘素材`,detail:"本次打回已经形成一份复盘素材，可用于调教 Agent。"});state.logs.unshift(`W${state.day} · 《${org.task}》被打回重做，获得复盘素材`);save();closeOverlay();render();toast("任务已回到组织，开始返工。")}
    function acceptDelivery(actionId){const action=state.actions.find(a=>a.id===actionId),org=state.orgs.find(o=>o.id===action.orgId),order=state.tasks.find(item=>item.orgId===org.id&&item.status==="running");org.status="settlement";org.progress=100;org.eta="等待结算";if(order){order.status="settlement";order.invoiceStatus="not_issued";order.paymentStatus="not_due"}state.actions=state.actions.filter(a=>a.id!==actionId);state.orderFilter="settlement";state.logs.unshift(`W${state.day} · ${org.name} 的《${org.task}》验收通过，进入结算`);save();closeOverlay();render();toast(`${org.name} 的成果已验收，订单进入待结算。`)}
    function issueInvoice(orderId){const order=state.tasks.find(item=>item.id===orderId);if(!order||order.status!=="settlement")return;order.invoiceStatus="issued";order.paymentStatus="receivable";addPendingAction({id:`receivable-${order.id}`,type:"receivable",orderId:order.id,orgId:order.orgId,title:`《${order.name}》等待收款`,detail:`已向 ${order.client} 开票 ¥${order.quotedAmount.toLocaleString()}。`});state.logs.unshift(`W${state.day} · 《${order.name}》已开票，进入待收款`);save();render();openOrder(orderId);toast("发票已开出，待收款事项已进入右侧。")}
    function receivePayment(orderId){const order=state.tasks.find(item=>item.id===orderId);if(!order||order.paymentStatus!=="receivable")return;completeSettlement(orderId)}
    function completeSettlement(orderId){const order=state.tasks.find(item=>item.id===orderId),org=state.orgs.find(item=>item.id===order.orgId);order.paymentStatus="paid";order.status="completed";order.income=order.quotedAmount;state.cash+=order.income;recordLedger({type:"income",amount:order.income,label:`${order.client} · ${order.name}`,orderId:order.id});releaseOrderResources(order.id);if(org){state.archive.push({orgId:org.id,task:order.name,client:order.client,quality:"A",income:order.income});org.status="idle";org.level++;org.optimizationPoints=(org.optimizationPoints||0)+1;org.task=null;org.progress=0;org.eta="";addPendingAction({id:`upgrade-${org.id}-${state.day}`,type:"upgrade",orgId:org.id,title:`${org.name} 完成一次真实交付`,detail:"组织与主理人积累了经验，并获得 1 个组织优化点。"})}state.actions=state.actions.filter(action=>!(action.type==="receivable"&&action.orderId===order.id));state.orderFilter="completed";state.logs.unshift(`W${state.day} · 《${order.name}》收款 ¥${order.income.toLocaleString()}，订单完成`);save();closeOverlay();render();toast(`已收款 ¥${order.income.toLocaleString()}，组织获得成长。`)}
    function resolveRisk(actionId){const action=state.actions.find(a=>a.id===actionId),org=state.orgs.find(o=>o.id===action.orgId);state.compute=Math.max(0,state.compute-12);org.status="working";org.eta="预计 2 天";state.actions=state.actions.filter(a=>a.id!==actionId);state.logs.unshift(`W${state.day} · 为 ${org.name} 追加 12 点算力并解除风险`);save();closeOverlay();render();toast("风险已解除，组织恢复运行。")}
    function toggleInventory(){state.inventoryOpen=!state.inventoryOpen;save();renderInventory()}
    function toast(message){document.querySelector("#toast-root").innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>document.querySelector("#toast-root").innerHTML="",2200)}
    restore();render();
  </script>
</body>
</html>
