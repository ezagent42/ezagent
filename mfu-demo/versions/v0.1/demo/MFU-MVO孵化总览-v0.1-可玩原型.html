<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MFU · MVO 组织孵化总览 v0.1</title>
  <style>
    :root{--ink:#5b4632;--dark:#3d2e1f;--cream:#fdf6e0;--bg:#e9d6a4;--gold:#f5b301;--school:#3f9e4d;--school-bg:#e2f3e4;--incu:#e07b1f;--incu-bg:#fdeeda;--assoc:#2f6fc4;--assoc-bg:#e3edfb;--red:#d94f3d;--teal:#1d9e75;--purple:#7a4fc9;--muted:#8a765a}
    *{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;padding:12px;color:var(--dark);font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background-color:var(--bg);background-image:linear-gradient(45deg,rgba(255,255,255,.14) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.14) 75%),linear-gradient(45deg,rgba(255,255,255,.14) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.14) 75%);background-size:28px 28px;background-position:0 0,14px 14px}
    button{font:inherit;color:inherit}.shell{width:min(1320px,100%);margin:auto}.paper,.panel{background:var(--cream);border:3px solid var(--ink);border-radius:11px;box-shadow:0 4px 0 rgba(91,70,50,.45),inset 0 0 0 2px #fff}.topbar{display:flex;align-items:center;gap:12px;padding:9px 12px;margin-bottom:9px;background:linear-gradient(#fff9e8,#f5e7bd)}.brand b{font-size:16px;letter-spacing:2px}.brand small{display:block;margin-top:3px;color:var(--muted);font-size:9.5px;font-weight:700}.spacer{flex:1}.tag{display:inline-block;padding:2px 7px;border:2px solid;border-radius:6px;font-size:10px;font-weight:800}.tag.incu{color:var(--incu);background:var(--incu-bg)}.tag.done{color:var(--teal);background:#e5f6ef}.tag.assoc{color:var(--assoc);background:var(--assoc-bg)}.tag.gold{color:#8b6100;background:#fff0ad}.tag.gray{color:#786a56;background:#f2ead6}.btn{padding:7px 12px;border:3px solid var(--ink);border-radius:8px;background:#fff2cf;box-shadow:0 3px 0 var(--ink);font-size:11.5px;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.05)}.btn:active{transform:translateY(3px);box-shadow:none}.btn.primary{background:var(--gold);font-size:13px}.btn.good{background:#8fd694}.btn.small{padding:4px 8px;font-size:10px;box-shadow:0 2px 0 var(--ink)}button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--assoc);outline-offset:3px}
    .hero{position:relative;overflow:hidden;padding:17px 18px;margin-bottom:9px;background:linear-gradient(120deg,#fff8dc 0 55%,var(--incu-bg) 55%)}.hero-grid{display:grid;grid-template-columns:1.18fr .82fr;gap:18px;align-items:center}.hero h1{font-size:27px;line-height:1.18}.hero h1 em{color:var(--incu);font-style:normal}.hero p{margin-top:7px;max-width:720px;font-size:11px;font-weight:700;line-height:1.65;color:var(--muted)}.hero-outcome{padding:13px;border:4px solid var(--ink);border-radius:12px;background:#fff;box-shadow:0 5px 0 rgba(91,70,50,.35);text-align:center}.hero-outcome strong{display:block;font-size:25px;color:var(--incu)}.hero-outcome span{font-size:11px;font-weight:900}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.summary-item{padding:7px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:9px;font-weight:800;text-align:center}.summary-item b{display:block;margin-top:2px;font-size:15px}.summary-item.cert{background:var(--assoc-bg);border-color:var(--assoc)}
    .dashboard{display:grid;grid-template-columns:.86fr 1.14fr;gap:9px}.column{display:flex;flex-direction:column;gap:9px}.panel{padding:11px}.panel-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px}.panel-head h2{font-size:14px}.panel-head p{margin-top:2px;color:var(--muted);font-size:9.5px;font-weight:700;line-height:1.45}.panel-head .spacer+*{flex:none}
    .resource-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.resource-stat{padding:7px 4px;border:2px solid var(--ink);border-radius:8px;background:#fff;text-align:center}.resource-stat span{font-size:18px}.resource-stat b{display:block;font-size:11px}.resource-stat small{display:block;margin-top:2px;color:var(--muted);font-size:8px;font-weight:800}.inventory-strip{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:2px dotted #d8c69a}.mini-card{position:relative;min-width:78px;padding:6px;border:2px solid var(--ink);border-radius:7px;background:#fff;font-size:8.5px;font-weight:800}.mini-card i{font-style:normal;font-size:19px}.mini-card b{display:block;margin-top:2px}.mini-card small{color:var(--muted)}.mini-card.busy:after{content:"已投入";position:absolute;right:3px;top:3px;padding:1px 3px;border-radius:4px;background:var(--incu-bg);color:var(--incu);font-size:7px}
    .opportunity-list{display:grid;gap:6px}.opportunity{display:grid;grid-template-columns:34px 1fr auto;gap:7px;align-items:center;padding:7px;border:2px solid var(--ink);border-radius:8px;background:#fff}.opportunity .ico{font-size:23px}.opportunity h3{font-size:11px}.opportunity p{margin-top:2px;color:var(--muted);font-size:8.5px;font-weight:700}.ready{padding:3px 6px;border:2px solid var(--teal);border-radius:6px;background:#e5f6ef;color:var(--teal);font-size:8px;font-weight:900}.create-cta{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px;border:2px dashed var(--incu);border-radius:8px;background:var(--incu-bg)}.create-cta p{flex:1;font-size:9px;font-weight:800;line-height:1.5}
    .mvo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mvo-card{padding:8px;border:3px solid var(--ink);border-radius:9px;background:#fff;box-shadow:0 3px 0 rgba(91,70,50,.35);cursor:pointer}.mvo-card:hover{transform:translateY(-1px)}.mvo-card.new{animation:pop .35s ease-out;background:#fff8d7}.mvo-title{display:flex;align-items:center;gap:5px}.mvo-title h3{font-size:10.5px}.mvo-title .tag{margin-left:auto;font-size:7.5px;padding:1px 4px}.org-graph{position:relative;height:82px;margin-top:7px;border:1px dashed #d8c69a;border-radius:6px;background:#fffdf6;overflow:hidden}.org-graph svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.org-line{stroke:#9b805f;stroke-width:1.6;fill:none;marker-end:url(#mini-arrow)}.org-node{position:absolute;width:27%;min-height:28px;padding:3px 2px;border:2px solid var(--ink);border-radius:6px;background:#f6e9c5;text-align:center;font-size:7px;font-weight:900;display:grid;place-items:center;transform:translate(-50%,-50%);z-index:2}.org-node span{display:block;font-size:11px}.mvo-foot{display:flex;justify-content:space-between;gap:4px;margin-top:6px;color:var(--muted);font-size:7.5px;font-weight:800}
    .run-list{display:grid;gap:6px}.run-item{display:grid;grid-template-columns:160px 1fr 62px;gap:8px;align-items:center;padding:7px;border:2px solid var(--ink);border-radius:8px;background:#fff}.run-item h3{font-size:10.5px}.run-item p{margin-top:2px;color:var(--muted);font-size:8px;font-weight:700}.bar{height:17px;border:2px solid var(--ink);border-radius:6px;background:#efe3c2;overflow:hidden;position:relative}.bar i{display:block;height:100%;background:var(--incu);transition:width .6s ease-out}.bar.done i{background:var(--teal)}.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:8px;font-weight:900}.run-status{text-align:right;font-size:8.5px;font-weight:900}.run-status.done{color:var(--teal)}.run-actions{display:flex;justify-content:flex-end;margin-top:8px}
    .overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(61,46,31,.58)}.modal{width:min(850px,96vw);max-height:90vh;overflow:auto;padding:16px;border:4px solid var(--ink);border-radius:14px;background:var(--cream);box-shadow:0 8px 0 rgba(0,0,0,.35);animation:pop .18s ease-out}.modal.builder-modal{width:min(1180px,97vw)}.modal-head{display:flex;align-items:flex-start;gap:9px}.modal-head h2{font-size:18px}.modal-head p{margin-top:3px;color:var(--muted);font-size:10px;font-weight:700}.recommendations{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.recommendation{padding:10px;border:3px solid var(--ink);border-radius:10px;background:#fff}.recommendation h3{font-size:12px}.recommendation p{margin-top:5px;color:var(--muted);font-size:9px;font-weight:700;line-height:1.5}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.detail-box{padding:10px;border:2px solid var(--ink);border-radius:8px;background:#fff}.detail-box h3{font-size:11px}.detail-box p{margin-top:5px;font-size:9px;font-weight:700;line-height:1.6}.incubation-stage{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.forming{position:relative;padding:10px;border:3px solid var(--incu);border-radius:10px;background:var(--incu-bg);text-align:center}.forming .flow{height:38px;margin:8px 0;position:relative;overflow:hidden}.gem{position:absolute;top:4px;font-size:21px;animation:flow-in .75s ease-out forwards}.gem:nth-child(1){left:5%;animation-delay:.05s}.gem:nth-child(2){left:38%;animation-delay:.18s}.gem:nth-child(3){left:70%;animation-delay:.3s}.forming b{font-size:11px}.toast{position:fixed;right:20px;bottom:20px;z-index:60;width:300px;padding:12px;border:4px solid var(--ink);border-radius:10px;background:#fff8d7;box-shadow:0 6px 0 rgba(91,70,50,.45);font-size:10px;font-weight:800;line-height:1.55;animation:pop .2s ease-out}.stamp{display:inline-block;margin-left:5px;padding:4px 8px;border:4px double var(--assoc);border-radius:8px;color:var(--assoc);font-size:12px;font-weight:900;transform:rotate(-5deg);animation:stamp .32s ease-out}
    .builder-name{width:220px;padding:6px 8px;border:2px solid var(--ink);border-radius:7px;background:#fff;font-weight:800}.builder-tools{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:11px 0;padding:8px;border:2px dashed var(--incu);border-radius:9px;background:var(--incu-bg)}.builder-tools .hint{flex:1;min-width:230px;color:var(--muted);font-size:9px;font-weight:800}.builder-layout{display:grid;grid-template-columns:1fr 250px;gap:10px}.builder-canvas{position:relative;height:440px;border:3px solid var(--ink);border-radius:10px;background-color:#fffdf6;background-image:radial-gradient(#d8c69a 1px,transparent 1px);background-size:18px 18px;overflow:hidden;touch-action:none}.builder-canvas svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.builder-edge{stroke:var(--assoc);stroke-width:1.8;fill:none;marker-end:url(#builder-arrow)}.builder-node{position:absolute;width:126px;min-height:68px;padding:8px;border:3px solid var(--ink);border-radius:9px;background:#fff2cf;box-shadow:0 3px 0 var(--ink);font-size:10px;font-weight:900;text-align:center;transform:translate(-50%,-50%);cursor:grab;user-select:none;z-index:2}.builder-node.selected{outline:4px solid var(--gold)}.builder-node.linking{outline:4px solid var(--assoc);animation:bob .7s infinite}.builder-node small{display:block;margin-top:5px;color:var(--muted);font-size:16px}.builder-side{padding:10px;border:3px solid var(--ink);border-radius:10px;background:#fff}.builder-side h3{font-size:12px}.builder-side label{display:block;margin-top:8px;font-size:9px;font-weight:900}.builder-side input[type=text]{width:100%;margin-top:4px;padding:6px;border:2px solid var(--ink);border-radius:6px}.resource-choice{display:flex;align-items:center;gap:6px;margin-top:5px;padding:6px;border:2px solid #d4c29c;border-radius:7px;background:#fff;font-size:9px;font-weight:800}.builder-empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:10px;font-weight:800;text-align:center}.validation{margin-top:10px;padding:9px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:9px;font-weight:800;line-height:1.6}.validation.ok{border-color:var(--teal);background:#e5f6ef}.validation.bad{border-color:var(--red);background:#fdeaea}
    @keyframes bob{50%{transform:translate(-50%,calc(-50% - 4px))}}
    @keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}@keyframes flow-in{from{transform:translateY(36px) scale(.7);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}@keyframes stamp{from{transform:rotate(-5deg) scale(2.2);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
    @media(max-width:1050px){.dashboard,.hero-grid{grid-template-columns:1fr}.mvo-grid{grid-template-columns:repeat(2,1fr)}.resource-stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){body{padding:7px}.summary,.recommendations,.incubation-stage,.mvo-grid{grid-template-columns:1fr 1fr}.run-item{grid-template-columns:1fr}.run-status{text-align:left}.detail-grid,.builder-layout{grid-template-columns:1fr}.builder-canvas{height:360px}}@media(max-width:520px){.summary,.recommendations,.incubation-stage,.mvo-grid,.resource-stats{grid-template-columns:1fr}.topbar .tag{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main id="incubator-dashboard" class="shell">
    <header class="topbar paper">
      <div class="brand"><b>🦄 MFU · MVO 组织孵化总览</b><small>DHS 青年创新孵化器 · 把零散资源持续转化为有效组织</small></div>
      <span class="tag incu">孵化器视角</span><div class="spacer"></div>
      <button id="reset-demo" class="btn small" type="button" onclick="resetDemo()">↺ 重新演示</button>
    </header>
    <section class="hero paper">
      <div class="hero-grid">
        <div>
          <h1>让零散资源，变成更多<br><em>能够持续工作的组织</em></h1>
          <p>ToDo List 提供任务，物品栏提供人才、Agent 与 IP，组织图把它们组合成最小有效组织。具体操作可以下钻查看，但价值在这里已经发生。</p>
        </div>
        <div id="hero-outcome" class="hero-outcome"><strong>12 名学生 → 6 个可运行的 MVO</strong><span>不是只培训个人，而是在持续产出组织</span></div>
      </div>
      <div id="mvo-summary" class="summary"></div>
    </section>
    <section class="dashboard">
      <div class="column">
        <section id="resource-inventory" class="panel"></section>
        <section id="opportunity-board" class="panel"></section>
      </div>
      <div class="column">
        <section id="mvo-portfolio" class="panel"></section>
        <section id="mvo-running" class="panel"></section>
      </div>
    </section>
  </main>
  <div id="overlay-root"></div>
  <div id="toast-root"></div>
  <script>
    const STORAGE_ID="mfu-mvo-incubator-v01";
    const baseMvos=[
      {id:"growth",name:"校园增长 MVO",icon:"📈",graphType:"fork",steps:["用户洞察","图文素材","社群活动","效果验证"],gems:["👩‍🎓","🤖","🧑‍🎓","📊"],rep:58,status:"running",progress:72,task:"旧书店新生增长方案",certified:false},
      {id:"video",name:"短视频交付 MVO",icon:"🎬",graphType:"linear",steps:["策划","生产","发布"],gems:["🧑‍🎓","🤖","🎞️"],rep:66,status:"review",progress:91,task:"本地品牌短视频计划",certified:true},
      {id:"research",name:"用户研究 MVO",icon:"🔎",graphType:"merge",steps:["用户招募","行为数据","访谈分析","需求结论"],gems:["👩‍🎓","📊","🤖","🧑‍🎓"],rep:43,status:"running",progress:46,task:"创业团队用户需求验证",certified:false},
      {id:"brand",name:"品牌设计 MVO",icon:"🎨",graphType:"linear",steps:["定位","设计","检验"],gems:["🧑‍🎓","🤖","®️"],rep:52,status:"idle",progress:0,task:"等待新任务",certified:false},
      {id:"ops",name:"社群运营 MVO",icon:"💬",graphType:"hub",steps:["社群运营","内容","用户","活动","复盘"],gems:["👩‍🎓","🤖","📚","🎪","📊"],rep:39,status:"idle",progress:0,task:"等待新任务",certified:false},
      {id:"data",name:"数据实验 MVO",icon:"🧪",graphType:"loop",steps:["提出假设","运行实验","分析结果","调整方案"],gems:["🧑‍🎓","🤖","🗃️","📏"],rep:47,status:"running",progress:31,task:"渠道转化实验",certified:false}
    ];
    const recommended=[
      {id:"content-new",name:"校园内容 MVO",icon:"✍️",graphType:"linear",steps:["选题","创作","分发"],gems:["👩‍🎓","🤖","📚"],task:"校园内容增长"},
      {id:"market-new",name:"市场验证 MVO",icon:"🧭",graphType:"fork",steps:["假设","用户测试","数据测试","判断"],gems:["🧑‍🎓","🤖","📊","👩‍🎓"],task:"新产品市场验证"},
      {id:"user-new",name:"用户研究 MVO",icon:"🗣️",graphType:"merge",steps:["招募","行为数据","访谈","洞察"],gems:["👩‍🎓","📊","🤖","🗃️"],task:"目标用户需求研究"}
    ];
    const initialState={incubated:false,completed:false,resources:{talent:12,agent:6,ip:4,compute:240,cash:20000},mvos:baseMvos};
    const state=structuredClone(initialState);
    function esc(v=""){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
    function persist(){localStorage.setItem(STORAGE_ID,JSON.stringify(state))}
    function restore(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_ID)||"null");if(saved&&Array.isArray(saved.mvos))Object.assign(state,initialState,saved,{resources:{...initialState.resources,...saved.resources}})}catch{}}
    function resetDemo(){localStorage.removeItem(STORAGE_ID);Object.assign(state,structuredClone(initialState));closeOverlay();renderDashboard()}
    function graphData(mvo){
      if(mvo.nodes&&mvo.edges)return {nodes:mvo.nodes,edges:mvo.edges};
      const layouts={
        linear:[[14,50],[50,50],[86,50]],
        fork:[[12,50],[48,25],[48,75],[86,50]],
        merge:[[12,28],[12,72],[52,50],[87,50]],
        hub:[[50,50],[15,22],[85,22],[15,78],[85,78]],
        loop:[[16,30],[50,18],[84,42],[50,78]]
      };
      const type=mvo.graphType||"linear",points=layouts[type]||layouts.linear;
      const nodes=mvo.steps.map((label,i)=>({id:`${mvo.id}-n${i}`,label,x:points[i]?.[0]||50,y:points[i]?.[1]||50,resources:[mvo.gems[i]||"◇"]}));
      const edgeIndexes=type==="fork"?[[0,1],[0,2],[1,3],[2,3]]:type==="merge"?[[0,2],[1,2],[2,3]]:type==="hub"?[[0,1],[0,2],[0,3],[0,4]]:type==="loop"?[[0,1],[1,2],[2,3],[3,0]]:nodes.slice(1).map((_,i)=>[i,i+1]);
      return {nodes,edges:edgeIndexes.map(([a,b])=>({from:nodes[a].id,to:nodes[b].id}))};
    }
    function visibleEdge(a,b,padding=11){const dx=b.x-a.x,dy=b.y-a.y,distance=Math.hypot(dx,dy)||1,ratio=Math.max(0,(distance-padding)/distance);return {x1:a.x,y1:a.y,x2:a.x+dx*ratio,y2:a.y+dy*ratio}}
    function graphMarkup(mvo){const g=graphData(mvo),byId=Object.fromEntries(g.nodes.map(n=>[n.id,n]));return `<div class="org-graph" data-graph-type="${mvo.graphType||"custom"}"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><marker id="mini-arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#9b805f"/></marker></defs>${g.edges.map(e=>{const a=byId[e.from],b=byId[e.to];if(!a||!b)return "";const p=visibleEdge(a,b,13);return `<line class="org-line" x1="${p.x1}" y1="${p.y1}" x2="${p.x2}" y2="${p.y2}"/>`}).join("")}</svg>${g.nodes.map(n=>`<div class="org-node" style="left:${n.x}%;top:${n.y}%"><span>${n.resources?.map(resourceIcon).join("")||"◇"}</span>${esc(n.label)}</div>`).join("")}</div>`}
    function resourceIcon(id){return ({humanGrowth:"🧑‍🎓",humanResearch:"👩‍🎓",agentInsight:"🤖",ipData:"📊","human-growth":"🧑‍🎓","human-research":"👩‍🎓","agent-insight":"🤖","ip-data":"📊"})[id]||id}
    function mvoCard(mvo,isNew=false){return `<article class="mvo-card ${isNew?"new":""}" tabindex="0" data-mvo-id="${mvo.id}" ${isNew?'data-new-mvo="true"':""} onclick="openMvoDetail('${mvo.id}')" onkeydown="if(event.key==='Enter')openMvoDetail('${mvo.id}')"><div class="mvo-title"><span>${mvo.icon}</span><h3>${mvo.name}</h3>${mvo.certified?'<span class="tag assoc">认证</span>':""}</div>${graphMarkup(mvo)}<div class="mvo-foot"><span>声望 ${mvo.rep}</span><span>${mvo.status==="done"?"Done":mvo.status==="running"?"Doing":mvo.status==="review"?"待验收":"待机"}</span></div></article>`}
    function renderSummary(){const total=state.mvos.length,running=state.mvos.filter(m=>m.status==="running").length,cert=state.mvos.filter(m=>m.certified).length;document.querySelector("#mvo-summary").innerHTML=`<div class="summary-item"><span>已孵化</span><b>${total} MVO</b></div><div class="summary-item"><span>正在运行</span><b>${running}</b></div><div class="summary-item cert"><span>已认证 MVO</span><b>${cert}</b></div><div class="summary-item"><span>还可创建</span><b>${state.incubated?0:3}</b></div>`}
    function renderResources(){const r=state.resources,used=state.incubated?9:6;document.querySelector("#resource-inventory").innerHTML=`<header class="panel-head"><div><h2>🎒 物品栏 · 我拥有的资源</h2><p>${used} 名人才已投入组织，${r.talent-used} 名人才仍可参与新孵化。</p></div></header><div class="resource-stats">${[["👩‍🎓","人才",r.talent,`${used} 已投入`],["🤖","Agent",r.agent,"2 个可租用"],["🧰","IP / 工具",r.ip,"方法 · 数据 · 渠道"],["⚡","可用算力",r.compute,"装入后占用"],["💰","可用资金",`¥${r.cash.toLocaleString()}`,"装入后占用"]].map(x=>`<div class="resource-stat"><span>${x[0]}</span><b>${x[2]}</b><small>${x[1]} · ${x[3]}</small></div>`).join("")}</div><div class="inventory-strip"><div class="mini-card busy"><i>👩‍🎓</i><b>林晓 · 研究</b><small>能力 72 · 已认证</small></div><div class="mini-card"><i>🧑‍🎓</i><b>阿禾 · 增长</b><small>能力 64 · 空闲</small></div><div class="mini-card"><i>🤖</i><b>洞察 Agent</b><small>8 算力 / 次</small></div><div class="mini-card"><i>📊</i><b>校园数据包</b><small>IP · 可复用</small></div></div>`}
    function renderOpportunities(){document.querySelector("#opportunity-board").innerHTML=`<header class="panel-head"><div><h2>📮 ToDo List · 可以创造什么</h2><p>平台根据任务和空闲资源，已经准备好 3 个组织推荐。</p></div></header><div class="opportunity-list">${[["📚","校园内容增长","已有学生、Agent 与校园内容 IP"],["🧭","新产品市场验证","已有增长人才与数据 Agent"],["🗣️","目标用户需求研究","已有研究人才、访谈 Agent 与数据工具"]].map(x=>`<div class="opportunity"><div class="ico">${x[0]}</div><div><h3>${x[1]}</h3><p>${x[2]}</p></div><span class="ready">可以立即创建</span></div>`).join("")}</div><div class="create-cta"><p><b>空闲资源足以再形成 3 个 MVO。</b><br>平台已自动推荐组织图和资源组合，你只需要确认。</p><button id="incubate-three" class="btn primary" type="button" onclick="incubateRecommendedMvos()" ${state.incubated?"disabled":""}>${state.incubated?"✓ 已完成孵化":"再孵化 3 个 MVO"}</button></div>`}
    function renderMvos(){const visible=state.mvos.slice(0,state.incubated?state.mvos.length:Math.max(6,state.mvos.length));document.querySelector("#mvo-portfolio").innerHTML=`<header class="panel-head"><div><h2>🧩 已经产出的组织</h2><p>组织图是结构，人才、Agent 与 IP 装入后形成 MVO。点击任意组织查看详情。</p></div><div class="spacer"></div><button id="create-mvo" class="btn small" type="button" onclick="openMvoBuilder()">＋ 自己设计 MVO</button><span class="tag incu">${visible.length} 个 MVO</span></header><div class="mvo-grid">${visible.map(m=>mvoCard(m,m.id.endsWith("-new")||m.id.startsWith("custom-"))).join("")}</div>`}
    function renderRunning(){const active=state.mvos.filter(m=>["running","review","done"].includes(m.status));document.querySelector("#mvo-running").innerHTML=`<header class="panel-head"><div><h2>⚙️ 正在运行的组织</h2><p>任务进入 ToDo 后，由匹配的 MVO 自动执行；这里只展示进度和结果。</p></div></header><div class="run-list">${active.map(m=>`<div class="run-item" ${m.id.endsWith("-new")?'data-new-mvo="true"':""}><div><h3>${m.icon} ${m.name}</h3><p>${m.task}</p></div><div class="bar ${m.status==="done"?"done":""}"><i style="width:${m.progress}%"></i><span>${m.status==="done"?"交付已完成":`${m.progress}% · 自动执行中`}</span></div><div class="run-status ${m.status==="done"?"done":""}">${m.status==="done"?"Done ✓":m.status==="review"?"等待验收":"Doing"}</div></div>`).join("")}</div>${state.incubated&&!state.completed?'<div class="run-actions"><button id="advance-mvos" class="btn good" onclick="advanceMvos()">▶ 查看本轮执行结果</button></div>':""}`;if(!state.incubated)document.querySelector("#mvo-running").innerHTML+=`<div class="run-actions"><span class="tag gray">另有 3 个 MVO 待机，可随时接新任务</span></div>`}
    function renderDashboard(){renderSummary();renderResources();renderOpportunities();renderMvos();renderRunning()}
    function closeOverlay(){document.querySelector("#overlay-root").innerHTML=""}
    function incubateRecommendedMvos(){document.querySelector("#overlay-root").innerHTML=`<div id="incubation-overlay" class="overlay"><section class="modal"><header class="modal-head"><div><span class="tag incu">平台自动推荐</span><h2>用空闲资源，再孵化 3 个 MVO</h2><p>推荐已经满足最小成立条件。你可以直接确认，或以后再下钻调整组织图。</p></div></header><div class="recommendations">${recommended.map(m=>`<article class="recommendation" data-recommendation="${m.id}"><h3>${m.icon} ${m.name}</h3>${graphMarkup(m)}<p>任务：${m.task}<br>资源：${m.gems.join(" + ")}<br>验证：结构完整 · 输入输出可衔接</p></article>`).join("")}</div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">稍后再说</button><button id="confirm-incubation" class="btn primary" onclick="confirmIncubation()">确认组合，开始孵化</button></div></section></div>`}
    function confirmIncubation(){document.querySelector("#overlay-root").innerHTML=`<div id="incubation-overlay" class="overlay"><section class="modal"><header class="modal-head"><div><span class="tag incu">MVO FOUNDRY</span><h2>零散资源正在形成组织</h2><p>人才、Agent 和 IP 正在进入三个组织图。</p></div></header><div class="incubation-stage">${recommended.map(m=>`<div class="forming"><b>${m.icon} ${m.name}</b><div class="flow"><span class="gem">${m.gems[0]}</span><span class="gem">${m.gems[1]}</span><span class="gem">${m.gems[2]}</span></div>${graphMarkup(m)}</div>`).join("")}</div></section></div>`;setTimeout(()=>{state.incubated=true;state.resources.compute=204;state.resources.cash=17600;state.mvos.push(...recommended.map((m,i)=>({...m,rep:[46,41,38][i],status:"running",progress:[18,12,9][i],certified:false})));persist();closeOverlay();renderDashboard();document.querySelector("#toast-root").innerHTML=`<div id="incubation-complete" class="toast">✨ <b>3 个新 MVO 已经开始运行</b><br>12 名零散学生已经进入 9 个可持续工作的组织。</div>`},900)}
    function advanceMvos(){state.completed=true;state.mvos=state.mvos.map(m=>{if(m.id==="growth")return {...m,status:"done",progress:100,rep:60,certified:true};if(m.id.endsWith("-new"))return {...m,status:"done",progress:100,rep:m.rep+12};return m});persist();renderDashboard();document.querySelector("#toast-root").innerHTML=`<div id="completion-toast" class="toast">🎉 《旧书店新生增长方案》已完成<br><b>校园增长 MVO</b> 声望达到 60 <span class="stamp">认证 MVO</span><br>人才经验 +8 · Agent 能力 +3 · 组织图验证记录 +1</div>`}
    const builderResources=[
      {id:"human-growth",icon:"🧑‍🎓",name:"阿禾 · 增长人才",executor:true},
      {id:"human-research",icon:"👩‍🎓",name:"林晓 · 研究人才",executor:true},
      {id:"agent-insight",icon:"🤖",name:"洞察 Agent",executor:true},
      {id:"ip-data",icon:"📊",name:"校园数据包",executor:false}
    ];
    window.builderDraft=null;
    function openMvoBuilder(){
      window.builderDraft={name:"我的新 MVO",selected:"start",connectMode:false,linkFrom:null,validated:false,nodes:[
        {id:"start",label:"接收任务",x:15,y:50,resources:[]},
        {id:"end",label:"交付结果",x:85,y:50,resources:[]}
      ],edges:[]};
      document.querySelector("#overlay-root").innerHTML=`<div id="mvo-builder-overlay" class="overlay"><section class="modal builder-modal"><header class="modal-head"><div><span class="tag incu">组织图工坊</span><h2>画出一个最小有效组织</h2><p>添加任务步骤，拖动它们的位置，再连接任务流并装入资源。</p></div><div class="spacer"></div><button class="btn small" onclick="closeOverlay()">关闭</button></header><div class="builder-tools"><label><b>MVO 名称　</b><input id="builder-name" class="builder-name" value="我的新 MVO" oninput="builderDraft.name=this.value"></label><button id="builder-add-node" class="btn small" onclick="addBuilderNode()">＋ 添加步骤</button><button id="builder-connect" class="btn small" onclick="toggleBuilderConnect()">⌁ 连接步骤</button><span id="builder-hint" class="hint">拖动步骤改变位置；连接时先点起点，再点终点。</span></div><div class="builder-layout"><div id="org-builder-canvas" class="builder-canvas"></div><aside id="builder-inspector" class="builder-side"></aside></div><div id="builder-validation" class="validation">尚未验证 · 每次验证消耗 12 点算力 · 验证通过后即可保存</div><div class="modal-actions"><button id="builder-validate" class="btn good" onclick="validateBuilder()">⚡ 验证组织图</button><button id="builder-save" class="btn primary" onclick="saveBuilderMvo()" disabled>验证后保存</button></div></section></div>`;
      renderBuilderCanvas();
    }
    function addBuilderNode(){const id=`step-${Date.now()}`;builderDraft.nodes.push({id,label:`任务步骤 ${builderDraft.nodes.length-1}`,x:50,y:30+Math.random()*40,resources:[]});builderDraft.selected=id;invalidateBuilder();renderBuilderCanvas()}
    function toggleBuilderConnect(){builderDraft.connectMode=true;builderDraft.linkFrom=null;document.querySelector("#builder-hint").textContent="连接模式：请点击任务流的起点。";document.querySelector("#builder-connect").classList.add("good")}
    function startBuilderLink(id){builderDraft.connectMode=true;builderDraft.linkFrom=id;document.querySelector("#builder-hint").textContent="起点已选中，请点击要连接到的终点。";renderBuilderCanvas()}
    function finishBuilderLink(id){if(!builderDraft.linkFrom||builderDraft.linkFrom===id)return;const edge={from:builderDraft.linkFrom,to:id};if(!builderDraft.edges.some(e=>e.from===edge.from&&e.to===edge.to))builderDraft.edges.push(edge);builderDraft.connectMode=false;builderDraft.linkFrom=null;document.querySelector("#builder-hint").textContent="连接完成。需要继续连线时，再点击“连接步骤”。";document.querySelector("#builder-connect").classList.remove("good");invalidateBuilder();renderBuilderCanvas()}
    function selectBuilderNode(id){if(builderDraft.connectMode){if(builderDraft.linkFrom)finishBuilderLink(id);else startBuilderLink(id)}else{builderDraft.selected=id;renderBuilderCanvas()}}
    function invalidateBuilder(){builderDraft.validated=false;const save=document.querySelector("#builder-save");if(save)save.disabled=true;const result=document.querySelector("#builder-validation");if(result){result.className="validation";result.textContent="组织图已修改，请重新验证 · 消耗 12 点算力"}}
    function updateBuilderNodeName(value){const node=builderDraft.nodes.find(n=>n.id===builderDraft.selected);if(node){node.label=value;invalidateBuilder();renderBuilderCanvas()}}
    function toggleBuilderResource(resourceId,checked){const node=builderDraft.nodes.find(n=>n.id===builderDraft.selected);if(!node)return;node.resources=checked?[...new Set([...node.resources,resourceId])]:node.resources.filter(id=>id!==resourceId);invalidateBuilder();renderBuilderCanvas()}
    function deleteBuilderNode(){if(["start","end"].includes(builderDraft.selected))return;builderDraft.nodes=builderDraft.nodes.filter(n=>n.id!==builderDraft.selected);builderDraft.edges=builderDraft.edges.filter(e=>e.from!==builderDraft.selected&&e.to!==builderDraft.selected);builderDraft.selected="start";invalidateBuilder();renderBuilderCanvas()}
    function renderBuilderCanvas(){
      const canvas=document.querySelector("#org-builder-canvas");if(!canvas)return;
      const byId=Object.fromEntries(builderDraft.nodes.map(n=>[n.id,n]));
      canvas.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><marker id="builder-arrow" markerWidth="4.5" markerHeight="4.5" refX="4" refY="2.25" orient="auto"><path d="M0,0 L4.5,2.25 L0,4.5 Z" fill="#2f6fc4"/></marker></defs>${builderDraft.edges.map(e=>{const a=byId[e.from],b=byId[e.to];if(!a||!b)return "";const p=visibleEdge(a,b,10);return `<line class="builder-edge" x1="${p.x1}" y1="${p.y1}" x2="${p.x2}" y2="${p.y2}"/>`}).join("")}</svg>${builderDraft.nodes.map(n=>`<button type="button" class="builder-node ${builderDraft.selected===n.id?"selected":""} ${builderDraft.linkFrom===n.id?"linking":""}" data-builder-node="${n.id}" style="left:${n.x}%;top:${n.y}%" onclick="selectBuilderNode('${n.id}')" onpointerdown="beginBuilderDrag(event,'${n.id}')">${esc(n.label)}<small>${n.resources.length?n.resources.map(resourceIcon).join(" "):"空孔 ◇"}</small></button>`).join("")}`;
      renderBuilderInspector();
    }
    function beginBuilderDrag(event,id){
      if(event.button!==0)return;const canvas=document.querySelector("#org-builder-canvas"),node=builderDraft.nodes.find(n=>n.id===id),rect=canvas.getBoundingClientRect(),startX=event.clientX,startY=event.clientY,originalX=node.x,originalY=node.y;let moved=false;
      const move=e=>{if(Math.abs(e.clientX-startX)+Math.abs(e.clientY-startY)>4)moved=true;node.x=Math.max(8,Math.min(92,originalX+(e.clientX-startX)/rect.width*100));node.y=Math.max(10,Math.min(90,originalY+(e.clientY-startY)/rect.height*100));renderBuilderCanvas()};
      const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);if(moved){invalidateBuilder();renderBuilderCanvas()}};
      window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
    }
    function renderBuilderInspector(){
      const side=document.querySelector("#builder-inspector"),node=builderDraft.nodes.find(n=>n.id===builderDraft.selected);if(!side)return;
      if(!node){side.innerHTML='<div class="builder-empty">点击一个步骤<br>为它命名并装入资源</div>';return}
      side.innerHTML=`<h3>🧩 当前步骤</h3><label>步骤名称<input id="builder-node-name" type="text" value="${esc(node.label)}" onchange="updateBuilderNodeName(this.value)"></label><label>装入资源</label><div id="builder-resource-list">${builderResources.map(r=>`<label class="resource-choice"><input type="checkbox" value="${r.id}" ${node.resources.includes(r.id)?"checked":""} onchange="toggleBuilderResource(this.value,this.checked)"><span>${r.icon}</span><span>${r.name}</span></label>`).join("")}</div>${["start","end"].includes(node.id)?'<p style="margin-top:9px;font-size:8px;font-weight:800;color:var(--muted)">起点和终点不能删除。</p>':'<button class="btn small" style="margin-top:9px" onclick="deleteBuilderNode()">删除此步骤</button>'}`;
    }
    function builderHasPath(){const seen=new Set(),visit=id=>{if(id==="end")return true;if(seen.has(id))return false;seen.add(id);return builderDraft.edges.filter(e=>e.from===id).some(e=>visit(e.to))};return visit("start")}
    function validateBuilder(){
      state.resources.compute=Math.max(0,state.resources.compute-12);
      const executorIds=new Set(builderResources.filter(r=>r.executor).map(r=>r.id));
      const taskNodes=builderDraft.nodes.filter(n=>!["start","end"].includes(n.id));
      const failures=[];if(builderDraft.nodes.length<3)failures.push("至少需要 1 个实际任务步骤");if(!builderHasPath())failures.push("接收任务与交付结果之间还没有完整连接");if(taskNodes.some(n=>!n.resources.some(r=>executorIds.has(r))))failures.push("每个实际任务步骤都要装入人才或 Agent");
      const result=document.querySelector("#builder-validation");
      if(failures.length){builderDraft.validated=false;result.className="validation bad";result.innerHTML=`<b>验证未通过</b> · 已消耗 12 点算力<br>${failures.join("；")}<br>创业教练：先补齐红色风险，再判断是否继续投入。`}
      else{builderDraft.validated=true;result.className="validation ok";result.innerHTML="<b>✓ 验证通过，可以保存 MVO</b> · 已消耗 12 点算力<br>预计 3 天 · 成本 ¥1,200 · 质量 82% · 主要风险：人工验收可能等待<br>AI 建议：保留研究人才负责最终判断。";const save=document.querySelector("#builder-save");save.disabled=false;save.textContent="保存为 MVO"}
      persist();renderResources()
    }
    function saveBuilderMvo(){
      if(!builderDraft.validated)return;
      const id=`custom-${Date.now()}`,nodes=structuredClone(builderDraft.nodes),edges=structuredClone(builderDraft.edges);
      state.mvos.push({id,name:builderDraft.name.trim()||"我的新 MVO",icon:"🛠️",graphType:"custom",nodes,edges,steps:nodes.map(n=>n.label),gems:nodes.map(n=>n.resources.map(resourceIcon).join("")||"◇"),rep:0,status:"idle",progress:0,task:"等待新任务",certified:false});
      persist();closeOverlay();renderDashboard();document.querySelector("#toast-root").innerHTML='<div class="toast">🛠️ <b>新的 MVO 已保存</b><br>它已进入组织库，等待合适的任务。</div>'
    }
    function openMvoDetail(id){const m=state.mvos.find(x=>x.id===id);if(!m)return;document.querySelector("#overlay-root").innerHTML=`<div id="mvo-detail-overlay" class="overlay"><section class="modal"><header class="modal-head"><div><span class="tag ${m.certified?"assoc":"incu"}">${m.certified?"认证 MVO":"可运行 MVO"}</span><h2>${m.icon} ${m.name}</h2><p>这是一张组织图装入真实资源后的最小有效组织。</p></div><div class="spacer"></div><button id="close-detail" class="btn small" onclick="closeOverlay()">关闭</button></header><div class="detail-grid"><div class="detail-box"><h3>组织图</h3>${graphMarkup(m)}<p>输入：任务目标与可用资源<br>输出：${esc(m.task)}的可交付结果<br>流程：${m.steps.join(" → ")}</p></div><div class="detail-box"><h3>装入的资源</h3><p>${m.gems.join("　")}<br>人才负责关键判断，Agent 提供可重复执行能力，IP 加速交付。</p></div><div class="detail-box"><h3>验证摘要</h3><p>结构完整 ✓<br>输入输出可衔接 ✓<br>预计成本可控 ✓<br>主要风险：等待人工确认</p></div><div class="detail-box"><h3>运行与成长</h3><p>任务：${esc(m.task)}<br>声望：${m.rep}<br>状态：${m.status==="done"?"Done":m.status==="running"?"Doing":m.status}<br>${m.certified?"已获得认证 MVO 身份":"继续完成任务可积累声望"}</p></div></div></section></div>`}
    restore();renderDashboard();
  </script>
</body>
</html>
