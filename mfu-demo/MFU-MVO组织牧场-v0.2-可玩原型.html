    function actionMarkup(action){const labels={review:"待验收",upgrade:"可升级",risk:"风险提醒"};return `<button class="action ${action.type}" data-action-type="${action.type}" onclick="openAction('${action.id}')"><h3>${labels[action.type]} · ${esc(action.title)}</h3><p>${esc(action.detail)}</p><small>点击处理 →</small></button>`}

    function closeOverlay(){document.querySelector("#overlay-root").innerHTML=""}
    window.builderDraft=null;
    function openWorkshop(){

    function addBuilderNode(){const id=`step-${Date.now()}`;builderDraft.nodes.push({id,label:`任务步骤 ${builderDraft.nodes.length-1}`,x:50,y:28+Math.random()*44,resources:[]});builderDraft.selected=id;renderBuilderCanvas()}

    function selectBuilderNode(id){if(builderDraft.connectMode){if(!builderDraft.linkFrom){builderDraft.linkFrom=id;document.querySelector("#builder-hint").textContent="起点已选择，请点击终点。"}else if(builderDraft.linkFrom!==id){const edge={from:builderDraft.linkFrom,to:id};if(!builderDraft.edges.some(e=>e.from===edge.from&&e.to===edge.to))builderDraft.edges.push(edge);builderDraft.connectMode=false;builderDraft.linkFrom=null;document.querySelector("#builder-hint").textContent="连接完成。继续连线时再次点击“连接步骤”。"}}else builderDraft.selected=id;renderBuilderCanvas()}
    function toggleWorkshopResource(button,id){const node=builderDraft.nodes.find(n=>n.id===builderDraft.selected);if(!node)return;button.classList.toggle("on");node.resources=button.classList.contains("on")?[...new Set([...node.resources,id])]:node.resources.filter(x=>x!==id);renderBuilderCanvas()}
    function updateBuilderName(value){const node=builderDraft.nodes.find(n=>n.id===builderDraft.selected);if(node){node.label=value;renderBuilderCanvas()}}
    function deleteBuilderNode(){if(["start","end"].includes(builderDraft.selected))return;builderDraft.nodes=builderDraft.nodes.filter(n=>n.id!==builderDraft.selected);builderDraft.edges=builderDraft.edges.filter(e=>e.from!==builderDraft.selected&&e.to!==builderDraft.selected);builderDraft.selected="start";renderBuilderCanvas()}
    function builderVisibleEdge(a,b,padding=10){const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,r=Math.max(0,(d-padding)/d);return{x1:a.x,y1:a.y,x2:a.x+dx*r,y2:a.y+dy*r}}
    function renderBuilderCanvas(){const canvas=document.querySelector("#org-builder-canvas");if(!canvas)return;const byId=Object.fromEntries(builderDraft.nodes.map(n=>[n.id,n]));canvas.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><marker id="builder-arrow" markerWidth="4.5" markerHeight="4.5" refX="4" refY="2.25" orient="auto"><path d="M0,0 L4.5,2.25 L0,4.5 Z" fill="#2f6fc4"/></marker></defs>${builderDraft.edges.map(e=>{const a=byId[e.from],b=byId[e.to];if(!a||!b)return"";const p=builderVisibleEdge(a,b);return`<line class="builder-edge" x1="${p.x1}" y1="${p.y1}" x2="${p.x2}" y2="${p.y2}"/>`}).join("")}</svg>${builderDraft.nodes.map(n=>`<button class="builder-node ${builderDraft.selected===n.id?"selected":""} ${builderDraft.linkFrom===n.id?"linking":""}" data-builder-node="${n.id}" style="left:${n.x}%;top:${n.y}%" onclick="selectBuilderNode('${n.id}')" onpointerdown="beginBuilderDrag(event,'${n.id}')">${esc(n.label)}<small>${n.resources.length?n.resources.map(resourceEmoji).join(" "):"空孔 ◇"}</small></button>`).join("")}`;renderBuilderInspector()}
    function renderBuilderInspector(){const node=builderDraft.nodes.find(n=>n.id===builderDraft.selected),side=document.querySelector("#builder-inspector");if(!node){side.innerHTML="请选择一个步骤";return}const choices=[{id:"person-ahe",icon:"🧑‍🎓",name:"阿禾 · 增长人才"},{id:"agent-data",icon:"🤖",name:"数据 Agent"},{id:"ip-campus",icon:"📊",name:"校园数据包"},{id:"tool-form",icon:"📝",name:"Form 工具"}];side.innerHTML=`<h3>当前步骤</h3><label>步骤名称<input value="${esc(node.label)}" onchange="updateBuilderName(this.value)"></label><label>装入资源</label>${choices.map(r=>`<button class="workshop-resource ${node.resources.includes(r.id)?"on":""}" data-workshop-resource="${r.id}" onclick="toggleWorkshopResource(this,'${r.id}')"><span>${r.icon}</span>${r.name}</button>`).join("")}${["start","end"].includes(node.id)?'<p style="margin-top:7px;font-size:8px;color:var(--muted);font-weight:800">流程边界无需配置资源。</p>':'<button class="btn small" style="margin-top:8px" onclick="deleteBuilderNode()">删除此步骤</button>'}`}
    function resourceEmoji(id){return({"person-ahe":"🧑‍🎓","agent-data":"🤖","ip-campus":"📊","tool-form":"📝"})[id]||"◇"}
    function beginBuilderDrag(event,id){if(event.button!==0)return;const canvas=document.querySelector("#org-builder-canvas"),node=builderDraft.nodes.find(n=>n.id===id),rect=canvas.getBoundingClientRect(),sx=event.clientX,sy=event.clientY,ox=node.x,oy=node.y;let moved=false;const move=e=>{if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>4)moved=true;node.x=Math.max(8,Math.min(92,ox+(e.clientX-sx)/rect.width*100));node.y=Math.max(10,Math.min(90,oy+(e.clientY-sy)/rect.height*100));renderBuilderCanvas()};const up=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);if(moved)renderBuilderCanvas()};window.addEventListener("pointermove",move);window.addEventListener("pointerup",up)}
    function builderHasPath(){const seen=new Set(),visit=id=>{if(id==="end")return true;if(seen.has(id))return false;seen.add(id);return builderDraft.edges.filter(e=>e.from===id).some(e=>visit(e.to))};return visit("start")}

    function trainAgent(id,method){const agent=state.agents.find(a=>a.id===id),label={example:"喂范例",rule:"写守则",review:"复盘"}[method],gain={example:.3,rule:.2,review:.5}[method];agent.ability=Number((agent.ability+gain).toFixed(1));agent.assets++;agent.history.unshift(`${label}：W${state.day} 新训练资产`);if(method==="example")state.cash-=200;state.logs.unshift(`W${state.day} · ${agent.name} 通过${label}提升至 ${agent.ability.toFixed(1)}`);save();document.querySelector("#agent-ability").textContent=agent.ability.toFixed(1);document.querySelector("#cash-stat").textContent=`¥${state.cash.toLocaleString()}`;renderInventory();toast(`${agent.name} 能力提升 +${gain.toFixed(1)}`)}
    function openResourceMarket(){document.querySelector("#overlay-root").innerHTML=`<div class="overlay"><section class="modal"><h2>🛒 资源市场</h2><p>获取新人才、Agent、工具与 IP。租用和交易权限规则待决策，本轮只提供直接接入。</p>${[{id:"market-agent",icon:"🤖",name:"调研 Agent",desc:"能力 5.5 · 接入费 ¥1,800"},{id:"market-person",icon:"🧑‍🎓",name:"小舟 · 运营人才",desc:"能力 61 · 招募成本 ¥800"},{id:"market-tool",icon:"🧰",name:"公开数据检索工具",desc:"一次性接入 ¥1,200"}].map(r=>`<div class="modal-box" style="display:flex;align-items:center;gap:8px"><span style="font-size:22px">${r.icon}</span><div style="flex:1"><h3>${r.name}</h3><p>${r.desc}</p></div><button class="btn green" onclick="buyResource('${r.id}')">接入</button></div>`).join("")}<div class="modal-actions"><button class="btn" onclick="closeOverlay()">关闭</button></div></section></div>`}
    function buyResource(id){const prices={"market-agent":1800,"market-person":800,"market-tool":1200},price=prices[id];if(state.cash<price){toast("资金不足。");return}state.cash-=price;if(id==="market-agent")state.agents.push({id:`agent-${Date.now()}`,icon:"🤖",name:"调研 Agent",ability:5.5,assets:0,status:"空闲",history:[]});if(id==="market-person")state.people.push({id:`person-${Date.now()}`,icon:"🧑‍🎓",name:"小舟 · 运营",ability:61,experience:4,cert:"未认证",portfolio:1,status:"空闲"});if(id==="market-tool")state.assets.push({id:`tool-${Date.now()}`,icon:"🧰",name:"公开数据检索工具",kind:"工具",meta:"公共设施 · 已接入"});state.logs.unshift(`W${state.day} · 资源市场接入新资源，支出 ¥${price}`);save();closeOverlay();render();toast("新资源已进入资源栏。")}
    function buyCoachTime(){if(state.cash<400){toast("资金不足。");return}state.cash-=400;state.coachHours++;state.logs.unshift(`W${state.day} · 加购创业教练时长 1`);save();render();toast("创业教练时长 +1")}
    function openEcosystem(){document.querySelector("#overlay-root").innerHTML=`<div class="overlay"><section class="modal"><h2>🤝 生态合作</h2><p>这里展示孵化器获得任务、评审、算力、教练和认证支持的来源。加入退出规则待决策。</p>${[["🏫 城南学院","人才、课程任务、教练与校园算力"],["🤝 行业协会","真实订单、案例库、评审与认证"],["☁️ 云算力伙伴","组织图验证与 Agent 运行算力"],["🏢 星谷企业联盟","客户任务、行业数据与验收反馈"]].map(x=>`<div class="modal-box"><h3>${x[0]}</h3><p>${x[1]} · 当前合作中</p></div>`).join("")}<div class="modal-actions"><button class="btn" onclick="closeOverlay()">关闭</button></div></section></div>`}
    function openWorld(){document.querySelector("#overlay-root").innerHTML=`<div class="overlay"><section class="modal"><h2>🌍 组织黄页</h2><p>客户可以通过官网发现适合的组织。</p>${state.orgs.slice(0,6).map(o=>`<div class="modal-box" style="display:flex;align-items:center;gap:8px"><span style="font-size:22px">${o.icon}</span><div style="flex:1"><h3>${o.name}</h3><p>Lv.${o.level} · ${o.steps.join("、")} · ${o.status==="idle"?"可接单":"运行中"}</p></div><button class="btn small" onclick="closeOverlay();openOrganization('${o.id}')">访问官网</button></div>`).join("")}<div class="modal-actions"><button class="btn" onclick="closeOverlay()">关闭</button></div></section></div>`}
    const erpTabs=[["overview","概览"],["tasks","订单"],["organizations","组织"],["resources","资产"],["finance","财务"],["logs","日志"]];
    function openErp(){document.querySelector("#overlay-root").innerHTML=`<div id="erp-overlay" class="overlay"><section class="modal"><h2>📊 孵化器 ERP</h2><p>办公室、任务、组织和资源使用同一套真实游戏数据。</p><nav class="erp-nav">${erpTabs.map(([id,name])=>`<button class="btn small" data-erp-tab="${id}" onclick="setErpTab('${id}')">${name}</button>`).join("")}</nav><div id="erp-body" class="modal-box"></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">关闭</button></div></section></div>`;setErpTab("overview")}
    function setErpTab(tab){
      const body=document.querySelector("#erp-body");if(!body)return;document.querySelectorAll("[data-erp-tab]").forEach(b=>b.classList.toggle("primary",b.dataset.erpTab===tab));
      if(tab==="overview")body.innerHTML=`<h3>经营概览</h3><p>资金 ¥${state.cash.toLocaleString()} · 算力 ${state.compute}<br>MVO ${state.orgs.length} · 运行中 ${state.orgs.filter(o=>o.status==="working").length} · 待处理 ${state.actions.length}</p>`;
      if(tab==="tasks")body.innerHTML=`<div style="display:flex;align-items:center"><h3>订单</h3><div class="spacer"></div><button class="btn small green" onclick="postTask()">＋ 发布订单</button></div><table class="erp-table">${state.tasks.map(t=>`<tr><td>${t.name}</td><td>待分配</td></tr>`).join("")}${state.orgs.filter(o=>o.task).map(o=>`<tr><td>${o.task}</td><td>${o.status==="review"?"待验收":"运行中"}</td></tr>`).join("")}</table>`;
      if(tab==="organizations")body.innerHTML=`<h3>组织</h3><table class="erp-table">${state.orgs.map(o=>`<tr><td>${o.name}</td><td>Lv.${o.level}</td><td>${o.status}</td></tr>`).join("")}</table>`;
      if(tab==="resources")body.innerHTML=`<h3>资源占用</h3><p>人才 12 · Agent ${state.agents.length} · 工具 / IP 4<br>${state.agents.map(a=>`${a.name}：${a.status}`).join("<br>")}</p>`;
      if(tab==="finance")body.innerHTML=`<h3>财务</h3><table class="erp-table"><tr><td>可用资金</td><td>¥${state.cash.toLocaleString()}</td></tr><tr><td>本周任务收入</td><td>¥8,400</td></tr><tr><td>运营与训练成本</td><td>¥${(23200-state.cash).toLocaleString()}</td></tr></table>`;
      if(tab==="logs")body.innerHTML=`<h3>运营日志</h3><p>${state.logs.join("<br>")}</p>`
    }
    function postTask(){document.querySelector("#overlay-root").innerHTML=`<div class="overlay"><section class="modal"><h2>📢 发布并拆解订单</h2><p>孵化器可以把内部培养任务或企业真实订单拆成可执行步骤，再放入订单板。</p><div class="modal-box"><label style="display:block;font-size:9px;font-weight:900">订单名称<input id="post-task-name" value="校园创业周传播方案" style="width:100%;margin-top:4px;padding:6px;border:2px solid var(--ink);border-radius:6px"></label><label style="display:block;margin-top:7px;font-size:9px;font-weight:900">订单来源<input id="post-task-client" value="DHS 孵化器" style="width:100%;margin-top:4px;padding:6px;border:2px solid var(--ink);border-radius:6px"></label><label style="display:block;margin-top:7px;font-size:9px;font-weight:900">预算<input id="post-task-reward" value="4000" type="number" style="width:100%;margin-top:4px;padding:6px;border:2px solid var(--ink);border-radius:6px"></label><h3 style="margin-top:9px">拆成三个步骤</h3>${["理解目标","制作方案","检查交付"].map((value,i)=>`<input class="post-task-step" value="${value}" style="width:30%;margin:5px 1%;padding:6px;border:2px solid var(--ink);border-radius:6px">`).join("")}<p>保存后，这些步骤会作为创建 MVO 时的组织图参考。</p></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">取消</button><button class="btn primary" onclick="confirmPostTask()">发布到订单板</button></div></section></div>`}
    function confirmPostTask(){const name=document.querySelector("#post-task-name").value.trim(),client=document.querySelector("#post-task-client").value.trim(),reward=Number(document.querySelector("#post-task-reward").value)||0,steps=[...document.querySelectorAll(".post-task-step")].map(input=>input.value.trim()).filter(Boolean);if(!name)return;state.tasks.push({id:`posted-${Date.now()}`,icon:"📢",name,client,reward:`¥${reward.toLocaleString()}`,difficulty:"内部",steps});state.logs.unshift(`W${state.day} · 发布并拆解订单《${name}》：${steps.join(" → ")}`);save();closeOverlay();render();toast("新订单已进入左侧订单板。")}
    const orgTabs=[["overview","概览"],["task","进行中的项目"],["assets","资产"],["records","客户与订单"],["finance","财务"],["logs","日志"],["site","官网"]];
    function openOrganization(id){const org=state.orgs.find(o=>o.id===id);if(!org)return;if(org.status==="idle"&&state.selectedTask){openAssignment(org);return}document.querySelector("#overlay-root").innerHTML=`<div id="organization-overlay" class="overlay"><section class="modal" style="width:min(820px,96vw)"><h2>${org.icon} ${org.name}</h2><p>组织的结构、执行、资产和履约证据都保存在同一个档案中。</p><nav class="erp-nav">${orgTabs.map(([tab,name])=>`<button class="btn small" data-org-tab="${tab}" onclick="openOrgTab('${id}','${tab}')">${name}</button>`).join("")}</nav><div id="organization-body" class="modal-box"></div><div class="modal-actions"><button id="close-organization" class="btn" onclick="closeOverlay()">关闭</button></div></section></div>`;openOrgTab(id,"overview")}
    function openOrgTab(id,tab){const org=state.orgs.find(o=>o.id===id),body=document.querySelector("#organization-body");if(!org||!body)return;document.querySelectorAll("[data-org-tab]").forEach(b=>b.classList.toggle("primary",b.dataset.orgTab===tab));if(tab==="overview")body.innerHTML=`<h3>概览</h3><p>等级 Lv.${org.level} · 状态 ${org.status}<br>${org.task?`当前执行：《${esc(org.task)}》 · ${org.progress}%`:"当前空闲，等待新任务。"}</p>${graphMarkup(org)}`;if(tab==="task"){const messages=state.chats[id]||[];body.innerHTML=`<h3>${org.task?`进行中的项目《${esc(org.task)}》`:"当前没有进行中的项目"}</h3>${org.task?`<p>预计完成：${org.eta}<br>步骤：${org.steps.join(" → ")}</p><div class="bar"><i style="width:${org.progress}%"></i><span>${org.progress}%</span></div><div style="margin-top:8px">${messages.map(m=>`<p><b>${esc(m.who)}：</b>${esc(m.text)}</p>`).join("")||"<p>订单聊天室还没有消息。</p>"}</div><div style="display:flex;gap:5px;margin-top:7px"><input id="org-chat-input" style="flex:1;padding:5px;border:2px solid var(--ink);border-radius:6px" placeholder="和客户及协作者沟通"><button id="send-org-chat" class="btn small" onclick="sendOrgChat('${id}')">发送</button><button class="btn small" onclick="subcontractTask('${id}')">📮 外包子任务</button></div>`:"<p>从订单板选择订单，再点击这个组织即可分配。</p>"}`};if(tab==="assets")body.innerHTML=`<h3>资产</h3><p>${org.gems.join("　")}<br>人才负责关键判断，Agent 提供可重复执行能力，工具与 IP 加速交付。<br>当前组织图已验证，可继续用于同类任务。</p>${graphMarkup(org)}`;if(tab==="records"){const records=state.archive.filter(r=>r.orgId===id);body.innerHTML=`<h3>客户与订单</h3>${records.length?`<table class="erp-table">${records.map(r=>`<tr><td>${r.client}</td><td>${r.task}</td><td>${r.quality}</td><td>¥${r.income.toLocaleString()}</td></tr>`).join("")}</table>`:"<p>还没有已完成订单。每次交付都会形成可举证的履约记录。</p>"}`};if(tab==="finance"){const income=state.archive.filter(r=>r.orgId===id).reduce((sum,r)=>sum+r.income,0);body.innerHTML=`<h3>财务</h3><table class="erp-table"><tr><td>累计任务收入</td><td>¥${income.toLocaleString()}</td></tr><tr><td>本轮资源成本</td><td>¥${org.status==="working"?800:0}</td></tr><tr><td>孵化器分成</td><td>20%</td></tr></table>`};if(tab==="logs")body.innerHTML=`<h3>日志</h3><p>${state.logs.filter(line=>line.includes(org.name)||line.includes(org.task||"___")).join("<br>")||"暂无组织事件。"}</p>`;if(tab==="site")body.innerHTML=`<h3>官网</h3><p><b>${org.icon} ${org.name}</b><br>等级 Lv.${org.level} · 已完成 ${state.archive.filter(r=>r.orgId===id).length} 个真实任务<br>擅长：${org.steps.join("、")}<br>当前状态：${org.status==="idle"?"可承接新任务":"正在执行任务"}</p>`}
    function sendOrgChat(id){const input=document.querySelector("#org-chat-input"),text=input.value.trim();if(!text)return;state.chats[id]=state.chats[id]||[];state.chats[id].push({who:"孵化器运营者",text});save();openOrgTab(id,"task")}
    function subcontractTask(id){const org=state.orgs.find(o=>o.id===id);if(!org?.task)return;state.cash-=400;org.progress=Math.min(95,org.progress+10);state.chats[id]=state.chats[id]||[];state.chats[id].push({who:"外包协作者 · 阿策",text:"已承接数据整理子任务，会把结果交回当前步骤。"});state.logs.unshift(`W${state.day} · ${org.name} 外包一个子任务，成本 ¥400`);save();document.querySelector("#cash-stat").textContent=`¥${state.cash.toLocaleString()}`;openOrgTab(id,"task");toast("子任务已匹配给外部协作者。")}
    function openAssignment(org){const task=state.tasks.find(t=>t.id===state.selectedTask);document.querySelector("#overlay-root").innerHTML=`<div id="assignment-overlay" class="overlay"><section class="modal"><h2>把任务交给 ${org.name}</h2><p>任务会从左侧 ToDo 移入这个组织，并开始自动运行。</p><div class="modal-box"><h3>${task.icon} ${esc(task.name)}</h3><p>客户：${esc(task.client)}<br>报酬：${task.reward}<br>平台判断：组织结构可以完成这项任务。</p></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">取消</button><button id="confirm-assignment" class="btn primary" onclick="assignTask('${org.id}','${task.id}')">确认分配</button></div></section></div>`}
    function assignTask(orgId,taskId){const org=state.orgs.find(o=>o.id===orgId),task=state.tasks.find(t=>t.id===taskId);org.status="working";org.task=task.name;org.progress=12;org.eta="预计 4 天";state.tasks=state.tasks.filter(t=>t.id!==taskId);state.selectedTask=null;state.compute-=8;state.logs.unshift(`W${state.day} · ${org.name} 接下《${task.name}》`);save();closeOverlay();render();toast(`${org.name} 已开始执行《${task.name}》`)}
    function advanceWork(){state.day++;const reviews=[];state.orgs=state.orgs.map(org=>{if(org.status!=="working")return org;const progress=Math.min(100,org.progress+35);if(progress===100){reviews.push({id:`review-${org.id}-${state.day}`,type:"review",orgId:org.id,title:`${org.name} 完成交付`,detail:`《${org.task}》等待你的验收。`});state.logs.unshift(`W${state.day} · ${org.name} 完成《${org.task}》，等待验收`);return {...org,status:"review",progress,eta:"等待验收"}}return {...org,progress,eta:progress>70?"预计 1 天":"预计 2 天"}});state.actions.push(...reviews);save();render();toast(reviews.length?`${reviews.length} 个组织完成工作，等待验收。`:"组织们继续运行了一天。")}
    function openAction(id){const action=state.actions.find(a=>a.id===id),org=state.orgs.find(o=>o.id===action.orgId);if(action.type==="review"){document.querySelector("#overlay-root").innerHTML=`<div class="overlay"><section class="modal"><h2>✅ 验收组织交付</h2><p>查看客户可用的成果，再决定通过或打回重做。</p><div class="modal-box"><h3>${org.name}</h3><p>${esc(org.task)}<br>完成度 100% · 预估质量 A<br>成果：一份可直接交给客户使用的方案与素材包。</p></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">稍后处理</button><button class="btn" onclick="rejectDelivery('${action.id}')">打回重做</button><button id="accept-delivery" class="btn green" onclick="acceptDelivery('${action.id}')">验收通过</button></div></section></div>`}else if(action.type==="risk"){document.querySelector("#overlay-root").innerHTML=`<div class="overlay"><section class="modal"><h2>⚠️ 运行风险</h2><p>${esc(action.detail)}</p><div class="modal-box"><h3>运营 Agent 建议</h3><p>追加 12 点算力完成数据清洗，可以解除当前阻塞。</p></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">稍后处理</button><button class="btn primary" onclick="resolveRisk('${action.id}')">投入算力并继续</button></div></section></div>`}else document.querySelector("#overlay-root").innerHTML=`<div class="overlay"><section class="modal"><h2>🌟 组织可以升级</h2><p>${esc(action.detail)}</p><div class="modal-box"><h3>获得 1 个组织优化点</h3><p>具体成长树仍待决策。本 Demo 先记录优化点，不自动选择升级方向。</p></div><div class="modal-actions"><button class="btn" onclick="closeOverlay()">保留优化点</button><button class="btn primary" onclick="closeOverlay();openOrganization('${org.id}')">查看组织</button></div></section></div>`}
    function rejectDelivery(actionId){const action=state.actions.find(a=>a.id===actionId),org=state.orgs.find(o=>o.id===action.orgId);org.status="working";org.progress=78;org.eta="返工 1 天";state.actions=state.actions.filter(a=>a.id!==actionId);state.actions.push({id:`replay-${org.id}-${state.day}`,type:"upgrade",orgId:org.id,title:`${org.name} 获得复盘素材`,detail:"本次打回已经形成一份复盘素材，可用于调教 Agent。"});state.logs.unshift(`W${state.day} · 《${org.task}》被打回重做，获得复盘素材`);save();closeOverlay();render();toast("任务已回到组织，开始返工。")}
    function acceptDelivery(actionId){const action=state.actions.find(a=>a.id===actionId),org=state.orgs.find(o=>o.id===action.orgId),finishedTask=org.task;org.status="idle";org.level++;org.task=null;org.progress=0;org.eta="";state.cash+=3200;state.archive.push({orgId:org.id,task:finishedTask,client:"任务客户",quality:"A",income:3200});state.actions=state.actions.filter(a=>a.id!==actionId);state.actions.push({id:`upgrade-${org.id}`,type:"upgrade",orgId:org.id,title:`${org.name} 升至 Lv.${org.level}`,detail:"获得一个组织优化点，可以改进组织图或成员能力。"});state.logs.unshift(`W${state.day} · ${org.name} 完成《${finishedTask}》，收入 ¥3,200`);save();closeOverlay();render();toast(`${org.name} 完成交付并升级了！`)}
    function resolveRisk(actionId){const action=state.actions.find(a=>a.id===actionId),org=state.orgs.find(o=>o.id===action.orgId);state.compute=Math.max(0,state.compute-12);org.status="working";org.eta="预计 2 天";state.actions=state.actions.filter(a=>a.id!==actionId);state.logs.unshift(`W${state.day} · 为 ${org.name} 追加 12 点算力并解除风险`);save();closeOverlay();render();toast("风险已解除，组织恢复运行。")}
    function toggleInventory(){state.inventoryOpen=!state.inventoryOpen;save();renderInventory()}
    function toast(message){document.querySelector("#toast-root").innerHTML=`<div class="toast">${esc(message)}</div>`;setTimeout(()=>document.querySelector("#toast-root").innerHTML="",2200)}
    restore();render();
  </script>
</body>
</html>
