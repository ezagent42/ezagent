# gitleaks config for the ezagent public repo.
#
# The `gitleaks` CI job (.github/workflows/ci.yml) exists to guard against NEW
# secret additions. Historical manuscripts under `docs/together/**` are
# dev-together working notes and evidence logs; any secret-shaped strings there
# are handled separately (history rewrite + credential rotation), NOT by this
# gate. They are allowlisted so a legacy-history match cannot block PRs — the
# gate's job is to stop new leaks, not to retro-clean history.

[extend]
useDefault = true

[allowlist]
description = "Known-benign classes; every entry has a rationale below"
# Clearly-fake DUMMY test keys committed by design in the CI workflow +
# config/test.exs (satisfy the cc-custom profile pre-flight check; test-mode
# stubs the real spawn so they never reach the network). Not real credentials.
regexes = [
  '''sk-test-dummy-deepseek-not-a-real-key''',
  '''sk-test-dummy-moonshot-not-a-real-key''',
]
paths = [
  # Historical dev-together manuscripts (handled by separate history rewrite).
  '''docs/together/.*''',
  # Third-party build deps (never committed; present only in local worktrees —
  # sqlite amalgamation, phoenix/plug_crypto/swoosh docstrings trip generic-api-key).
  '''deps/.*''',
  '''_build/.*''',
  # Dev/test-only fixed secrets, committed by design (standard Phoenix
  # dev secret_key_base + test signing salts). prod/runtime configs stay guarded.
  '''config/dev\.exs''',
  '''config/test\.exs''',
  # Test fixtures: repo policy is self-minted fake credentials in tests
  # (api_keys_test / app_settings_test fixture tokens).
  '''apps/[^/]+/test/.*''',
  '''tests/fixture/.*''',
  # Documentation examples (illustrative keys in skill docs / scenario scripts).
  '''\.claude/skills/elixir-phoenix-helper/SKILL\.md''',
  '''docs/scenarios/08-4agent-comprehensive/scenario\.md''',
]
