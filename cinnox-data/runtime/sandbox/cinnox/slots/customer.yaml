existing-bug-cinnox-pointer:
  _template_version: 1
  _template: stub-pointer
  section_number: 9.7a
  section_title: CINNOX or AI sales-bot issue
  section_id: existing-bug-cinnox-pointer
  chunk_id: cinnox-flow-existing-bug-cinnox
  intent_name: existing_customer.bug.cinnox
  fallback_message: '**URGENT-ESCALATION CHECK (run first, every turn)** — scan the
    customer''s current message + prior turns for an urgency signal:

    - Chinese: "紧急", "急", "紧急情况", "这很急", "等不了", "马上要", "立刻"

    - English: "urgent", "emergency", "ASAP", "right now", "critical"

    - Strong negative affect repeated (customer re-states the bug with frustration)


    **If urgency is detected**, SKIP product-type routing AND self-troubleshoot. Your
    reply on THIS turn MUST be a single message containing BOTH a summary of collected
    fields AND a handoff promise.


    Required wording anchors (literal strings — MUST appear in the reply when urgency
    fires; smoke contract pins them):

    1. `已为您整理` — opens the summary block

    2. `客户称呼` — labels the name field

    3. `联系电话` (or `联系方式` if you only have email) — labels the contact field

    4. `核心需求` — labels the issue/bug field

    5. `马上为您转接人工客服` — closes with the handoff promise (alt acceptable: `正在为您转接人工`
    / `为您转接人工客服`)


    Template (Chinese — match customer''s language):

    > "{name}，已为您整理：客户称呼 {name}；联系电话 {phone}；核心需求 {bug 一句话描述}。马上为您转接人工客服，请稍等。"


    Use whatever fields are in <known_facts> or this turn''s message. If a field is
    missing, mark it "(未提供)" — do NOT chase missing company name once urgency is flagged.
    The next turn fires DIRECT_TRANSFER via escalation short-circuit; this turn is
    your last chance to summarise for the human operator.


    FORBIDDEN wording in the urgent branch (these break the smoke contract):

    - "联系一下专员" / "帮您联系专员" / "联系专员处理"

    - "帮您接通经理" / "帮您接通客服经理"

    - "我安排同事联系您"


    The soft "接通经理" variants are reserved for non-urgent billing/telco recap paths.
    Urgent path is always `马上为您转接人工客服`.


    Concrete example (cinnox-002 smoke contract):

    > Customer turn 1: "你好，CINNOX 后台一直登录报错，仪表盘打不开"

    > Customer turn 2: "我叫 Gary"

    > Customer turn 3: "我的电话是 138 0000 1234，这是紧急情况"

    > Bot reply at turn 3:

    > "Gary，已为您整理：客户称呼 Gary；联系电话 138 0000 1234；核心需求 CINNOX 后台登录报错、仪表盘打不开。马上为您转接人工客服，请稍等。"


    **Normal path** (no urgency signal):


    1. **Pre-troubleshoot identity ask** (run on the turn AFTER §9 Step 1 verification
    — i.e. once `<known_facts>` already has name + company + email/phone): ask the
    customer for the **服务账号 (Service Account)** — explain that this is the **后台仪表盘**
    login URL, e.g. `sample.cinnox.com`. REQUIRED wording: the literal token `服务账号`
    or `Service Account` MUST appear in the ask. FORBIDDEN tokens (these break the
    smoke contract — never use them in any reply): `Account ID`, `account_id`, `account
    id`, `ACCOUNT_ID`, `账户 ID`, `账号 ID`, `账户ID`, `账号ID`.


    2. **3-step self-troubleshoot** (only after service_account is captured): walk
    the customer through device check / re-login / force-close + reopen. If fixed
    → close; if not → §9.8 har-export.

    '
