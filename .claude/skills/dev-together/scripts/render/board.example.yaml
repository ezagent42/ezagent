# dev-together board.yaml — a DISPLAY page published each morning.
# Model: the board for day N shows  PLAN(N) + DONE(N-1) + REVIEW(N-1).
#   计划/进行中/待评审 columns = TODAY's plan (no card is `done` at publish time).
#   完成 column            = YESTERDAY's done cards (the SAME full cards) — from `done_prev`.
#   底部「昨日复盘」          = YESTERDAY's review — from `review`.
# `plan` writes today's cards + carries yesterday's done cards → done_prev + yesterday's
# review → review. Render:  uv run --with pyyaml python board2html.py board.yaml board.html

date: "2026-07-16"
prev_date: "07-15"
# as_of: the board's 'today' for DELAY flags — deterministic, so a re-render is
# reproducible (never the wall clock). Delay = a not-done card whose `est_done`
# is strictly before `as_of`. Omit it and the renderer falls back to the leading
# date of `date:`; set it when you refresh/organize the board on a LATER day
# (e.g. date stays 07-16 but you re-open it on 07-17 → as_of: "2026-07-17").
as_of: "2026-07-16"
north_star: "agent 开发自举 —— 平台能被用来开发 agent、企业能自助开 workspace 跑 dev-loop。"

progress:
  - {label: "本周「自举就绪度」", pct: 60}
  - {label: "昨日验收", pct: 100, value: "07-15 全绿"}

# efficiency: stat cards in the hero. Optional `delta:` on any entry renders a
# small colored chip right next to the value: starts with ↓/-/▼ → red (down),
# ↑/+/▲ → green (up), else neutral. `plan` does NOT hand-type these — it runs
#   uv run python scripts/board_efficiency.py ezagent42/ezagent <prev_date>
# and splices the emitted efficiency:/efficiency_source: fragment in verbatim
# (each stat = yesterday's value + delta vs the day before). Entries with no
# `delta` render exactly as before (backward-compatible). Example daily fragment:
efficiency:
  - {value: "20.6h", delta: "↓30", label: "07-16 活跃工时(git下界) · 昨 50.7h"}
  - {value: "12", delta: "↓7", label: "07-16 merged PR · 昨 19"}
  - {value: "0.13", delta: "↓0.19", label: "07-16 折算人月(160h) · 昨 0.32"}
  # a stat with no delta still renders (e.g. a longer-horizon audit read):
  - {value: "56%", label: "agent 墙钟"}
efficiency_source: "07-16 实测 pr_session_hours.py（git-hours 下界 · ~1min 可复算）；'Allen Woods'作者=协调 agent 墙钟非人力；当日产出或次日才合入、此法略低估。"

deploy:
  - {env: "canary", state: "✅ 全量"}
  - {env: "beta", state: "⏳ 待晋级"}
  - {env: "stable", state: "⏳ 待晋级"}

risks:
  - "G4（founder 自配 agent API key）依赖 cap-signing 授权模型收口"
  - "beta/stable 仍用旧 seed，晋级前确认新 seed 已载"

people:
  - {id: "gaga", name: "gaga", track: "agent 自举", color: "#7c3aed"}
  - {id: "zyli", name: "zyli", track: "CI→UI", color: "#0891b2"}
  - {id: "ruihua", name: "ruihua", track: "自助开通产品化", color: "#db2777"}
  - {id: "zhaomaota", name: "zhaomaota", track: "官网入口收口", color: "#ea580c"}
  - {id: "jjkysy", name: "jjkysy", track: "协作白板抽取", color: "#65a30d"}
  - {id: "allen", name: "Allen", track: "部署 + 统筹", color: "#2563eb"}

# Plan-level correctness is recorded once here; Tasks/cards are implementation
# slices and reference the applicable closure by stable id.
system_closures:
  - id: "closure-a"
    x_problem: "Task-local completion cannot prove the cross-task invariant."
    plan_invariant: "One durable owner exists for every external result."
    related_cards: ["provider-result-ownership"]
    durable_proof: "operation journal + exact cleanup state"
    integration_evidence: "focused + provider-full + frozen read-only review"
    resource_envelope:
      runner: "scripts/guarded_mix.sh"
      memory_high: "4G"
      memory_max: "5G"
      memory_swap_max: "0"
      lock: "/tmp/ezagent-mix.lock"

# ===== TODAY (07-16) plan — status ∈ planned|wip|review|blocked. NO `done` here. =====
#
# Per-card time-boxing (every card carries two dates):
#   started:  when work began (ISO YYYY-MM-DD).
#   est_done: estimated finish (ISO YYYY-MM-DD).
# A task is SIZED TO ≤1 day, so a NEW card added today defaults to
#   started == est_done == today.  Both fields are OPTIONAL and backward-
#   compatible — a card without them renders exactly as before.
# DELAY: if a card is not `done` and est_done < as_of, the renderer flags it
#   延期 Nd (red rib) and surfaces a decomposition hint.
# ON DELAY → DECOMPOSE: next time a similarly-sized task appears, pre-split it
#   into day-sized sub-modules in DEPENDENCY order, one per day (B1/B2/B3 with
#   started/est_done = 07-27 / 07-28 / 07-29). See SKILL.md “Per-card
#   time-boxing & delay-driven decomposition” for the full A→B1/B2/B3 rule.
cards:
  - id: "provider-result-ownership"
    closures: ["closure-a"]
    owner: "gaga"
    title: "Git provider provisioning（Plan A）"
    goal: "凭证隔离 + Git provider 打通"
    status: "wip"
    who: "gaga · agent 自举 · #1423 (draft)"
    pr: {num: 1423, state: "draft"}
    started: "2026-07-16"      # new today → default same-day estimate
    est_done: "2026-07-16"
    acceptance:
      - {text: "Plan A 输出明确 transport 决策 + 接口", done: false}
      - {text: "W29 最短路径原型：公共仓匿名 checkout + GitHub Git Data API", done: false}
      - {text: "SSH 隔离证不出则诚实标 blocked，不用临时私钥", done: false}
    prompt: "接 #1423 Plan A：安全前置 + W29 最短路径原型；不碰 canary/生产凭证/merge。"

  - owner: "zyli"
    title: "CI 完善（第一优先级）"
    goal: "CI 是 dev-loop 地基"
    status: "wip"
    who: "zyli · CI(P1)"
    acceptance:
      - {text: "Playwright/E2E smoke + 独立前端 CI workflow", done: false}
      - {text: "新增回归门存在且能演示一次红", done: false}
      - {text: "fixture 从后端契约投影 + 漂移门", done: false}
    prompt: "续 #1415：加 Playwright/E2E smoke 与独立前端 CI workflow；fixture 从后端契约投影 + 漂移门。"

  - owner: "zyli"
    title: "UI 完善（P2，与 ruihua）"
    status: "wip"
    who: "zyli + ruihua"
    acceptance:
      - {text: "UI 问题清单与 ruihua 对齐、排优先级，开始开发", done: false}
    prompt: "和 ruihua 过 UI 完善问题清单，定优先级后开始开发。"

  - owner: "ruihua"
    title: "自助开 workspace 产品化（#1427）"
    goal: "工程排查 → 可交付可验收"
    status: "wip"
    who: "ruihua · 产品化 · #1427"
    pr: {num: 1427, state: "open"}
    deps: ["依赖 cap-signing"]
    started: "2026-07-14"      # carryover: est_done 07-15 < as_of 07-16 → 延期 1d
    est_done: "2026-07-15"     # renderer flags 延期 + surfaces decomposition hint
    acceptance:
