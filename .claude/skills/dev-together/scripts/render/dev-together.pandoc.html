<!DOCTYPE html>
<html lang="$if(lang)$$lang$$else$zh-CN$endif$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$if(title)$$title$$else$dev-together$endif$</title>
<style>
  body{font:14px/1.6 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#1a1a1a;max-width:1100px;margin:24px auto;padding:0 20px;background:#fff}
  h1{font-size:24px;border-bottom:3px solid #2563eb;padding-bottom:8px}
  h2{font-size:19px;margin-top:32px;color:#1e40af;border-left:4px solid #2563eb;padding-left:10px}
  h3{font-size:15px;margin-top:20px;color:#374151}
  .tablewrap{width:100%;overflow-x:auto;margin:12px 0}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:560px}
  th,td{border:1px solid #d1d5db;padding:7px 9px;text-align:left;vertical-align:top}
  th{background:#eff6ff;font-weight:600}
  tr:nth-child(even){background:#f9fafb}
  .kpi{display:inline-block;margin:6px 14px 6px 0;padding:10px 16px;background:#f1f5f9;border-radius:8px}
  .kpi b{font-size:22px;color:#2563eb;display:block}
  .big{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px 16px;margin:14px 0}
  .risk{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:12px 16px;margin:14px 0}
  .interim{background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:12px 16px;margin:14px 0;color:#3730a3}
  .ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.hold{background:#fee2e2;color:#991b1b}
  .pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600}
  blockquote{margin:10px 0;padding:8px 14px;background:#f8fafc;border-left:3px solid #94a3b8;color:#475569}
  code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:12px}
  .lbl{color:#1e40af;font-weight:600}
  .acc{color:#166534;font-weight:600}
  .dep{color:#92400e;font-weight:600}
</style>
</head>
<body>
$body$
</body>
</html>
